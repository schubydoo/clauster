# markdownlint-cli2 config — https://github.com/DavidAnson/markdownlint-cli2
#
# Lints our hand-written Markdown (README, CONTRIBUTING, SECURITY, UPGRADING,
# THIRD_PARTY_NOTICES, tests/E2E_CHECKLIST). Vendored READMEs and the gitignored
# scratch/ + CLAUDE.md are excluded (gitignore:true skips the latter two).
# Run locally and in CI via scripts/lint-docs.sh (pinned version, single source).

# Honour .gitignore so gitignored docs (scratch/, CLAUDE.md, AGENTS.md) are skipped.
gitignore: true

globs:
  - "**/*.md"

ignores:
  - "**/vendor/**" # third-party assets we ship verbatim
  - "**/node_modules/**"
  # knope owns CHANGELOG.md — it regenerates the file on every release prep from the
  # .changeset fragments (hand-edits get overwritten), and its blank-line spacing
  # between release sections trips MD012/no-multiple-blanks. Linting a tool-generated
  # file we don't control just blocks the release PR, so skip it.
  - "CHANGELOG.md"
  # knope changeset fragments are tool-managed (front-matter + a plain summary,
  # consumed at release prep), not prose docs — MD041's "first line must be an H1"
  # doesn't apply to them.
  - ".changeset/**"

config:
  default: true
  # MD013 line-length: prose is reflow-friendly; we don't hard-wrap docs.
  MD013: false
  # MD033 inline HTML: the README's hero + screenshot layout is intentional HTML
  # (centred headings, badge links, a screenshot table). Allow exactly the tags
  # the docs actually use today so arbitrary tags (<script>, <iframe>, …) and
  # stray HTML in the prose docs are still flagged. Keep this list tight — add a
  # tag only when a doc starts using it.
  MD033:
    allowed_elements:
      - a
      - b
      - br
      - code
      - em
      - h1
      - img
      - p
      - sub
      - table
      - td
      - tr

# Quiet the per-file progress noise; keep the error list.
noProgress: true
