# markdownlint-cli2 config — https://github.com/DavidAnson/markdownlint-cli2
#
# Lints our hand-written Markdown (README, CONTRIBUTING, SECURITY, UPGRADING,
# THIRD_PARTY_NOTICES, tests/E2E_CHECKLIST). Vendored READMEs are ignore-listed; the
# gitignored scratch/ and CLAUDE.local.md stay out via the positive globs + ignores.
# Run locally and in CI via scripts/lint-docs.sh (pinned version, single source).

# ⚠️ `gitignore: true` is FORBIDDEN here. To honour .gitignore the tool first hunts the
# whole working tree for ignore files (globby's `**/.gitignore` pass, which takes no
# ignore list at all), and that walk follows symlinks: every agent worktree under
# `.claude/worktrees/` carries a `.claude` symlink back to the repo's own `.claude/`, so
# the traversal cycles — one worktree makes it slow, two make it exponential and node
# aborts at its heap limit ("Ineffective mark-compacts near heap limit"; every
# `just check` during the v1.1 batch, re-proven 2026-08-30: even linting a single
# explicit file hung, and gitignore:false alone fixed it). Gitignored docs are kept out
# by the positive globs below plus the explicit `ignores` entry for CLAUDE.local.md.
gitignore: false

# Positive globs over the trees that actually hold our docs — deliberately NOT "**/*.md",
# which would walk the whole tree (including the worktree symlink cycle above).
# Adding a new doc directory? List it here.
globs:
  - "*.md"
  - ".github/**/*.md"
  - "docs/**/*.md"
  - "fuzz/**/*.md"
  - "src/**/*.md"
  - "tests/**/*.md"

# These base ignores DO prune traversal (markdownlint-cli2 passes them to globby as
# negated patterns) — but they cannot tame the gitignore:true ignore-file hunt above,
# which ignores them entirely; that's why the `.claude/**` entry once added for the OOM
# was useless and is gone. Do not read this list as making `gitignore: true` safe.
ignores:
  - "**/vendor/**" # third-party assets we ship verbatim
  - "**/node_modules/**"
  - "**/.venv/**" # a future tests/.venv would sit inside a globbed tree; prune it
  # Gitignored personal overrides (matched by "*.md" now gitignore:false can't skip it).
  - "CLAUDE.local.md"
  # knope owns CHANGELOG.md — it regenerates the file on every release prep from the
  # .changeset fragments (hand-edits get overwritten), and its blank-line spacing
  # between release sections trips MD012/no-multiple-blanks. Linting a tool-generated
  # file we don't control just blocks the release PR, so skip it.
  - "CHANGELOG.md"
  # knope changeset fragments are tool-managed (front-matter + a plain summary,
  # consumed at release prep), not prose docs — MD041's "first line must be an H1"
  # doesn't apply to them.
  - ".changeset/**"
  # HIGHLIGHTS.md is curated release-note content folded into the changelog/release
  # body by scripts/inject_highlights.py (#305), not a standalone doc — same as
  # CHANGELOG.md above, MD041's first-line-H1 rule doesn't apply.
  - "HIGHLIGHTS.md"

config:
  default: true
  # MD013 line-length: prose is reflow-friendly; we don't hard-wrap docs.
  MD013: false
  # MD033 inline HTML: the README's hero + screenshot layout is intentional HTML
  # (centred headings, badge links, a screenshot table). Allow exactly the tags
  # the docs actually use today so arbitrary tags (<script>, <iframe>, …) and
  # stray HTML in the prose docs are still flagged. Keep this list tight — add a
  # tag only when a doc starts using it.
  MD033:
    allowed_elements:
      - a
      - b
      - br
      - code
      - details
      - em
      - h1
      - img
      - p
      - sub
      - summary
      - table
      - td
      - tr

# Quiet the per-file progress noise; keep the error list.
noProgress: true
