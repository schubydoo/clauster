# Codecov config — coverage is REPORTED here for visibility (PR comments +
# trend graphs); the real enforcement is the local/CI 96% gate in
# pyproject [tool.pytest.ini_options] (--cov-fail-under=96, Linux). Both
# statuses are `informational: true` so Codecov nudges but never blocks a
# merge — it isn't a required check and the pyproject gate is the source of
# truth. Coverage is uploaded from one Linux cell only (see ci.yml).
coverage:
  status:
    project:
      default:
        target: 96%        # mirror the pyproject gate
        threshold: 1%      # tolerate sub-1% drift before flagging
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true     # only comment when coverage actually moves
