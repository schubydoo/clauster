# Codecov config. Coverage is REPORTED here for visibility (PR comment + trend
# graphs + per-component breakdown); the REAL project-total gate is the local/CI
# 96% floor in pyproject [tool.pytest.ini_options] (--cov-fail-under=96, enforced
# on the Linux cell). The `project` status mirrors that floor and stays
# `informational: true` (it nudges, never blocks — pyproject is the source of
# truth). The `patch` status is the one thing Codecov adds that pytest cannot —
# per-PR-diff coverage at 95% with `informational: false`: a visible pass/fail
# traffic light (green >= 95%, red X below) that nudges, never blocks (not a
# required check). Coverage is uploaded from every matrix cell tagged with its OS
# as a flag (Linux/macOS/Windows) for per-platform visibility; the internal-PR
# subset spans all three OSes, so every code PR lands all three flags fresh and
# carryforward is deliberately OFF (see the `flags` block below).
#
# Validate before deploying changes:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # ci.yml uploads coverage even when pytest FAILS (the `!cancelled()` guard), on
  # purpose: a coverage drop should surface exactly when a change breaks something.
  # So don't gate the Codecov status on CI passing — show coverage as soon as it's
  # uploaded. `wait_for_ci` is intentionally omitted: it only takes effect when
  # `require_ci_to_pass: true`, which we never set, so listing it would be a no-op.
  require_ci_to_pass: false
  notify:
    # Notify after the first upload and let later per-OS uploads update the comment
    # in place (behavior: default). Deliberately 1, NOT the upload count: a higher
    # threshold can starve — if a fast re-push cancels slower cells (the upload step
    # skips cancelled jobs), fewer reports land and a threshold-gated comment would
    # never post even though the completed cells produced coverage. 1 always fires;
    # the first report is ~the passing Linux number and ticks up as macOS/Windows
    # arrive, so an early single-OS comment is never a false alarm.
    after_n_builds: 1
    wait_for_ci: false # default is true — must be explicit to show coverage immediately

coverage:
  precision: 2
  round: down # a strict floor rounds down, matching the --cov-fail-under gate
  range: "90...100" # red->green band tuned to a project that sits ~96%
  status:
    project:
      default:
        target: 96% # mirror the pyproject --cov-fail-under floor
        threshold: 1% # tolerate sub-1% drift before flagging
        informational: true # nudge, never block — pyproject is the source of truth
    patch:
      default:
        # Per-diff coverage (new/changed lines only). The project status mirrors
        # the pytest gate and stays advisory; the patch is what Codecov adds that
        # pytest --cov-fail-under cannot — visibility on the *new* code a PR adds.
        # `informational: false` emits a pass/fail traffic light (green >= target,
        # red X below) so a coverage drop is visually loud in the checks list. It is
        # NOT a required check — the merge button stays green on a red X; docs-only
        # PRs get no upload and no check at all. Add `codecov/patch` to branch
        # protection later only if you want to block low-coverage PRs on merge.
        target: 95% # new/changed lines must be well covered. Raised 80 -> 95 once
                    # the repo hit 100% (the audit PR): at 80% a PR could add a fifth
                    # of its new lines untested and stay green, and the project status
                    # (96% + 1% slack, informational) wouldn't flag erosion in the
                    # 96-100% band — so patch is the real per-PR sentinel. 95 (not
                    # 100) leaves headroom for the occasional genuinely-hard line so
                    # the red X stays meaningful, not chronic (alert fatigue on a
                    # non-required check). Codecov honours our `# pragma` excludes, so
                    # truly-unreachable branches never trip it.
        threshold: 0% # no slack on the diff — a PR under 95% new-code coverage
                      # should add a test or a justified pragma
        informational: false # emit pass/fail traffic light; not a required check
        if_not_found: success # docs-only PRs (no upload) emit success, never block

# Informational setup: the per-line PR annotations are mostly visual clutter; the
# comment + dashboard carry the signal.
github_checks:
  annotations: false

# Per-OS coverage flags (uploaded from ci.yml, one per cell, tagged by
# `runner.os`). Declared explicitly to pin carryforward OFF: the internal-PR
# subset already spans all three OSes, so every code PR uploads all three flags on
# the current commit and nothing needs carrying forward from a prior commit (which
# would risk surfacing a stale per-OS number). Flag names MUST match the uploaded
# `runner.os` values exactly (Linux / macOS / Windows). No per-flag `statuses` —
# flags add VISIBILITY only, like components; they create no extra per-OS PR check.
flags:
  Linux:
    carryforward: false
  macOS:
    carryforward: false
  Windows:
    carryforward: false

comment:
  # Flags (per-OS) + components (per-area) both broken out in the PR comment.
  layout: "condensed_header, diff, flags, components, files"
  behavior: default # update the existing comment in place
  require_changes: true # only comment when coverage actually moves
  hide_project_coverage: false

# Per-area coverage breakdown in the dashboard + PR comment. No `statuses` are
# defined (here or in default_rules), so components add VISIBILITY only — they do
# NOT create extra per-component PR status checks. Paths are globs over the
# src/clauster modules; keep them roughly in sync as modules move.
component_management:
  individual_components:
    - component_id: bridge_core
      name: bridge core
      paths:
        - src/clauster/runner.py
        - src/clauster/procutil.py
        - src/clauster/pointers.py
        - src/clauster/code_sessions.py # #867 — pre-spawn anchor-session liveness for bridge pointers
        - src/clauster/pty_keeper.py
        - src/clauster/pty_screen.py # #534 — server-side pyte screen for live pty terminal
        - src/clauster/state.py
        - src/clauster/inspector.py
        - src/clauster/supervisor.py
        - src/clauster/bridge_log.py
        - src/clauster/atomicio.py
    - component_id: hosted
      name: hosted channel
      paths:
        - src/clauster/hosted.py
        - src/clauster/hosted_events.py
        - src/clauster/hosted_state.py
        - src/clauster/claustrum_client.py
        - src/clauster/claustrum_daemon.py
    - component_id: web
      name: web app
      paths:
        - src/clauster/app.py
        - src/clauster/auth.py
        - src/clauster/logstream.py
        - src/clauster/usage.py
        - src/clauster/metrics.py
        - src/clauster/prometheus.py
        - src/clauster/notify.py
        - src/clauster/claude_md.py
        - src/clauster/logging_config.py
        - src/clauster/webhooks.py
        - src/clauster/mcp_server.py # #527 — read-only clauster MCP stdio server
        - src/clauster/login_shepherd.py # #846 — dashboard `claude` login flow
        - src/clauster/login_status.py # #838 — `claude auth status` probe behind /healthz
    - component_id: provisioning
      name: provisioning
      paths:
        - src/clauster/provisioning.py
        - src/clauster/discovery.py
        - src/clauster/clone_jobs.py
    - component_id: trust_security
      name: trust & redaction
      paths:
        - src/clauster/trust.py
        - src/clauster/redact.py
        - src/clauster/environments.py
        - src/clauster/tls_provision.py # #790 — cert/key provisioning for the TLS listener
    - component_id: hooks_recap
      name: hooks & recap
      # Same glob problem as persistence below: `src/clauster/hooks/**` compiles to
      # `(?s:src/clauster/hooks/.*)\Z` and isn't picked up by Codecov's component
      # matcher — it was masked here only by the explicit recap.py path. List the
      # hooks module explicitly (the form the other components use, `^…py.*`).
      paths:
        - src/clauster/hooks/__init__.py
        - src/clauster/hooks/resume_recap.py
        - src/clauster/recap.py
    - component_id: persistence
      name: persistence (db)
      # Codecov's component matcher does NOT pick up a `src/clauster/db/**` glob here
      # (it leaves the component empty even when db/ is covered 100%), whereas the
      # explicit file paths the other components use DO match — so list the db modules
      # explicitly. Keep this list in sync as db/ grows (same convention as above).
      paths:
        - src/clauster/db/__init__.py
        - src/clauster/db/engine.py
        - src/clauster/db/bootstrap.py
        - src/clauster/db/models.py
        - src/clauster/db/persistence.py
        - src/clauster/db/stores.py
        - src/clauster/db/migrations/__init__.py
        - src/clauster/db/migrations/env.py
        - src/clauster/db/migrations/versions/__init__.py
        - src/clauster/db/migrations/versions/0001_baseline.py
        - src/clauster/db/migrations/versions/0002_session_events.py # #363 — session lifecycle table
        - src/clauster/db/migrations/versions/0004_api_tokens.py # #302 — named public-API bearer tokens
        - src/clauster/db/migrations/versions/0003_instance_id.py # #789 — instance-identity column
        - src/clauster/db/migrations/versions/0005_hosted_instance_id.py # hosted-session instance id
    - component_id: config_write
      name: config-write (settings.json / .mcp.json)
      # The config_write feature cluster (#687 / #690 / #732 / #738) — capability-gated
      # writes to ~/.claude.json, .mcp.json, and permission rules. Behind its own
      # fail-closed guard and tests; grouped separately from the read/edit cli_config
      # component so the breakdown reflects the distinct capability boundary.
      paths:
        - src/clauster/config_write.py
        - src/clauster/config_write_hooks.py
        - src/clauster/config_write_mcp.py
        - src/clauster/config_write_permissions.py
        - src/clauster/config_write_settings.py # #772 — generic env/model/misc settings.json editor
        - src/clauster/config_write_subagents.py # #773 — subagents (.claude/agents) surface
        - src/clauster/config_write_skills.py # #773 — skills (.claude/skills) surface
        - src/clauster/config_write_plugins.py # #773 — plugins + marketplaces surface
        - src/clauster/config_write_mcp_cli.py # #773 — CLI-driven MCP approvals helper
        - src/clauster/config_file_writer.py # #766 — path-contained file/dir writer primitive
        - src/clauster/claude_json.py
    # The config_write_* family above mirrors the same pattern as the other
    # explicit-path components (see persistence/hooks_recap notes) — Codecov's
    # component matcher doesn't pick up src/clauster/config_write* globs, so list
    # each module explicitly. Keep this list in sync as config_write grows.
    - component_id: cli_config
      name: cli & config
      paths:
        - src/clauster/ops.py
        - src/clauster/deps.py # #904 — optional-extras detection for doctor + UI greying
        - src/clauster/config.py
        - src/clauster/config_editor.py
        - src/clauster/config_writer.py
        - src/clauster/models.py
        - src/clauster/claude_cli.py
        - src/clauster/reconcile.py # #650 — `clauster config reconcile` subcommand
        - src/clauster/engine.py # #775 — shared read facade for the app + headless CLI
        - src/clauster/cli_read.py # #775 — headless read commands (projects/status/sessions/logs/open)
        - src/clauster/cli_write.py # #775 — headless write commands (start/stop)
        - src/clauster/__main__.py
        - src/clauster/__init__.py
