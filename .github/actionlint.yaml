# actionlint configuration.
#
# The ignores below exist because actionlint (≤ v1.7.12, the latest as of 2026-08-31)
# does not yet understand GitHub's `$/` self-repository `uses:` syntax (July 2026) and
# reports it as an invalid action/workflow reference. The syntax is deliberate — it is
# immune to runtime filesystem substitution and GitHub treats it as pinned — so the two
# messages are suppressed rather than the migration reverted. Scoped to exactly those
# message shapes; everything else actionlint checks still applies.
#
# ⚠️ Remove this file (and close clauster issue 1361) once rhysd/actionlint issue 711
# ships `$/` support and the pinned actionlint is bumped past it.
paths:
  .github/workflows/**/*.{yaml,yml}:
    ignore:
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
      - 'specifying action "\$/.+" in invalid format because ref is missing'
