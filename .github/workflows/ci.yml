name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` (beyond the opened/synchronize/reopened defaults) so
    # toggling the `full-ci` label re-triggers CI and immediately flips the
    # matrix between the subset and the full grid — otherwise the label only
    # takes effect on the next push.
    #
    # `ready_for_review` (also non-default) is the recovery path for issue #509:
    # if a `synchronize` ever fails to dispatch this required check (e.g. a merge
    # commit pushed under a non-trigger-capable token), marking the PR draft and
    # back to ready re-evaluates the head SHA and (re)dispatches — a no-side-effect
    # alternative to close+reopen.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Nightly full sweep on main: catches a portability/CVE/dep regression that a
  # trimmed internal-PR matrix would skip, without waiting for the next release.
  schedule:
    - cron: "27 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # setup — emit the test matrix + classify the diff. ONE cheap job that
  # decides everything downstream:
  #   • matrix:  internal PR  → a representative SUBSET (all 4 Pythons + all
  #              3 OSes in 4 legs, Windows-weighted since it's the buggiest
  #              platform, and ubuntu+3.13 always present = the coverage-gate
  #              and Codecov cell). push:main / nightly cron / fork PRs (after
  #              approval) / a `full-ci`-labelled PR → the FULL 3×4 = 12 grid.
  #              Trimming applies ONLY to internal PRs; main + nightly always
  #              run the full grid (release safety-net — a release is only ever
  #              cut from a green main).
  #   • code:    true unless the PR touches ONLY docs/meta files. The heavy
  #              jobs (tests, build, docker) gate on this so a docs-only PR
  #              skips them entirely. Fail-safe: anything unrecognised, an
  #              empty diff, or any non-PR event → code=true (never skip on
  #              main/cron). The `ci required checks passed` aggregator counts a
  #              skipped job as passing, so the required check still reports.
  # DRAFT PRs (#623): the heavy jobs (tests, build, docker) also carry
  #   `&& github.event.pull_request.draft != true`, so a DRAFT PR skips them
  #   entirely — a batch of drafts can be opened cheaply and each flipped to
  #   "ready for review" one at a time to fire its CI. `!= true` (not `== false`)
  #   so push:main / cron (null draft field) fail-safe to running. The aggregator
  #   counts the skipped jobs as passing, so `ci required checks passed` still
  #   reports green on a draft (never the permanent "Expected — waiting" block);
  #   `ready_for_review` is already in the pull_request types, so marking a draft
  #   ready re-dispatches the full run. Do NOT add this guard to `setup` or the
  #   aggregator (they must keep running so the required context always reports).
  # --------------------------------------------------------------------
  setup:
    name: setup (matrix + change filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Need both PR endpoints in history to diff base..head.
          fetch-depth: 0
          persist-credentials: false
      # Shared classifier (also used by security.yml) — keep the docs/meta
      # allowlist in one place.
      - name: Classify changed files (code vs docs-only)
        id: changes
        uses: ./.github/actions/changed-code
      - name: Decide matrix (subset vs full)
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          # FULL 3×4 grid. macOS/Windows were brought green via a .cmd test-stub
          # entrypoint + cross-platform guards; the full sweep keeps a
          # version-specific portability bug from hiding on an untested OS×py cell.
          full='{"include":[
            {"os":"ubuntu-latest","python":"3.11"},
            {"os":"ubuntu-latest","python":"3.12"},
            {"os":"ubuntu-latest","python":"3.13"},
            {"os":"ubuntu-latest","python":"3.14"},
            {"os":"macos-latest","python":"3.11"},
            {"os":"macos-latest","python":"3.12"},
            {"os":"macos-latest","python":"3.13"},
            {"os":"macos-latest","python":"3.14"},
            {"os":"windows-latest","python":"3.11"},
            {"os":"windows-latest","python":"3.12"},
            {"os":"windows-latest","python":"3.13"},
            {"os":"windows-latest","python":"3.14"}
          ]}'
          # SUBSET for internal PRs: 4 legs covering all 4 Pythons and all 3 OSes.
          # ubuntu+3.13 is mandatory (coverage gate + Codecov upload live there);
          # Windows gets two legs (our buggiest platform); one macOS leg.
          subset='{"include":[
            {"os":"ubuntu-latest","python":"3.13"},
            {"os":"windows-latest","python":"3.11"},
            {"os":"windows-latest","python":"3.14"},
            {"os":"macos-latest","python":"3.12"}
          ]}'
          use_full=false
          if [ "$EVENT_NAME" != "pull_request" ]; then
            use_full=true                                   # push:main, schedule
          elif [ "$IS_FORK" = "true" ]; then
            use_full=true                                   # fork PR → full gamut
          elif printf '%s' "$LABELS" | grep -q '"full-ci"'; then
            use_full=true                                   # escape hatch label
          fi
          if [ "$use_full" = "true" ]; then
            echo "Using FULL matrix (event=$EVENT_NAME fork=$IS_FORK)."
            echo "matrix=$(printf '%s' "$full" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "Using SUBSET matrix (internal PR)."
            echo "matrix=$(printf '%s' "$subset" | jq -c .)" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------
  # Unit tests across the matrix `setup` emitted. The 96% coverage gate
  # lives in pyproject addopts (--cov-fail-under=96); only Linux enforces
  # it (macOS/Windows report coverage but pass --cov-fail-under=0, since
  # branches like Linux jiffies / Windows O_BINARY are platform-specific
  # and no single OS reaches 96%). Skipped wholesale on a docs-only PR.
  # --------------------------------------------------------------------
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: setup
    if: needs.setup.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Cap how many matrix cells run at once so a clauster run (full grid = 12
      # cells) doesn't monopolise the account-wide concurrent-runner pool while
      # other repos queue. Controlled by the CI_MAX_PARALLEL repo variable so the
      # cap is tunable — or liftable — WITHOUT a code change: 4 = default cap; set
      # it to 12 (or higher) to effectively remove the cap, since the full grid is
      # 12 cells. The `|| '4'` fallback keeps CI safe if the variable is ever unset
      # or deleted. The internal-PR subset is only 4 cells, so a cap of 4 leaves PR
      # latency untouched and throttles only the full grid on push:main / nightly.
      max-parallel: ${{ vars.CI_MAX_PARALLEL || '4' }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv + Python
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      # `shell: bash` keeps one script across all three runners (Git Bash ships
      # on Windows). Matrix values flow through env (not inlined) for zizmor.
      - name: pytest
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          RUNNER_OS: ${{ runner.os }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          # Time the suite and record it — the runners (esp. Windows) vary a lot, so a
          # per-cell wall time on the run Summary + the slowest tests (`--durations`) make
          # a REAL slowdown obvious instead of mined from job timestamps. `|| rc=$?` so the
          # timing is still written when pytest fails (the default shell is `bash -eo pipefail`).
          start=$(date +%s)
          rc=0
          if [ "$RUNNER_OS" = "Linux" ]; then
            uv run --python "$PYTHON_VERSION" pytest -q --durations=15 \
              --cov-report=xml --junitxml=junit.xml -o junit_family=legacy || rc=$?
          else
            # macOS/Windows: keep the fail-under gate off (no single OS reaches
            # 96% on its own), but DO emit coverage.xml so each OS's coverage can
            # be uploaded under its own Codecov flag — per-OS visibility on the
            # platform branches Linux can't exercise.
            uv run --python "$PYTHON_VERSION" pytest -q --durations=15 --cov-fail-under=0 \
              --cov-report=xml || rc=$?
          fi
          dur=$(( $(date +%s) - start ))
          {
            echo "### ⏱ pytest timing"
            echo ""
            echo "| OS | Python | Wall time | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| $MATRIX_OS | $PYTHON_VERSION | ${dur}s | $([ "$rc" -eq 0 ] && echo pass || echo FAIL) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # Upload coverage from EVERY cell, tagged with its OS as a Codecov flag
      # (Linux/macOS/Windows), so coverage is broken out per platform — the axis
      # where clauster actually varies (74 sys.platform branches; zero version
      # branches). The internal-PR subset spans all three OSes, so every code PR
      # uploads all three flags on the current commit and no carryforward is needed.
      # Token-based upload (no id-token perm). Non-blocking: Codecov isn't a
      # required check and upload flakiness must never fail CI. `!cancelled()` so
      # a FAILED pytest still uploads (pytest writes the reports before the gate),
      # surfacing a coverage drop precisely when it matters. Skips the release
      # bot's PRs (knope opens them as the clauster-ci App; code never moves, so the
      # status/comment is pure noise) — filtered on the PR author; the login is empty
      # on push, so main-branch uploads are unaffected.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'clauster-ci[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ runner.os }}
          fail_ci_if_error: false
      # Test results only need a single upload — keep it on the Linux 3.13 gate
      # cell (always present in both the subset and the full matrix; only that
      # branch writes junit.xml).
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python == '3.13' && github.event.pull_request.user.login != 'clauster-ci[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  # --------------------------------------------------------------------
  # Build sdist + wheel. Cheap; confirms the package is shippable.
  # --------------------------------------------------------------------
  build:
    name: build sdist + wheel
    needs: setup
    if: needs.setup.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv + Python
        uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          extras: ""   # build only needs the build backend, not test/lint tooling
      - name: Build
        run: uv build
      - name: Upload dist artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------
  # Docker smoke-test. The image is built + Trivy-scanned in security.yml
  # but never RUN there — this is the runtime regression net. Build once,
  # then prove the server actually boots and serves /healthz two ways:
  #   1. `docker run`     — the image itself.
  #   2. `docker compose` — the published compose.yaml (#97).
  # The image binds 0.0.0.0, so it requires enforced auth to start; we mint
  # a throwaway argon2id hash from the image's own auth module (no real
  # secret) — /healthz is public, so liveness needs no login. Docs-only PRs
  # skip it.
  # --------------------------------------------------------------------
  docker:
    name: docker smoke-test
    needs: setup
    if: needs.setup.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Build amd64 once, load locally, and tag it as the compose image name too
      # so `docker compose` uses this build (pull policy "missing" → local hit),
      # never the published :latest. The gha cache keeps cold builds cheap.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            clauster:smoke
            ghcr.io/schubydoo/clauster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Throwaway hash from the image's OWN auth code — non-interactive (the CLI's
      # hash-password uses getpass), no hard-coded credential to scan-flag.
      - name: Mint a throwaway auth hash
        id: hash
        run: |
          set -euo pipefail
          HASH=$(docker run --rm --entrypoint python clauster:smoke -c \
            "from clauster.auth import hash_password, make_hasher; print(hash_password(make_hasher(), 'ci-smoke'))")
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      # Boot prerequisites the image deliberately omits:
      #  • clauster.yml — clauster needs one to exist (env vars only override
      #    scalars); projects_root=/projects exists in the image.
      #  • a `claude` binary — clauster resolves it on PATH at startup and exits
      #    if missing. The image ships WITHOUT claude by design (users mount it —
      #    see compose.yaml), so we mount a tiny stub, exactly as documented. The
      #    compose override mirrors compose.yaml's commented-out claude mount.
      - name: Write smoke config + claude stub
        run: |
          set -euo pipefail
          mkdir -p config projects
          cat > config/clauster.yml <<'YML'
          schema_version: 1
          projects_root: /projects
          state_dir: /config/state
          log_format: json
          YML
          cat > claude-stub <<'SH'
          #!/bin/sh
          case "$1" in
            --version) echo "2.1.200 (Claude Code)" ;;
            agents)    echo "[]" ;;
            *)         echo "[]" ;;
          esac
          SH
          chmod +x claude-stub
          cat > compose.ci.yaml <<'YML'
          # CI-only override: mount the stub claude onto PATH (compose.yaml ships
          # this commented out). Not committed — written by the smoke-test job.
          services:
            clauster:
              image: clauster:smoke
              volumes:
                - ./claude-stub:/usr/local/bin/claude:ro
          YML
      - name: docker run → /healthz
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          docker run -d --name clauster-smoke -p 7621:7621 \
            -e CLAUSTER_AUTH_ENABLED=true \
            -e CLAUSTER_AUTH_PASSWORD_REQUIRED=true \
            -e CLAUSTER_AUTH_PASSWORD_HASH="$HASH" \
            -v "$PWD/config:/config" \
            -v "$PWD/projects:/projects" \
            -v "$PWD/claude-stub:/usr/local/bin/claude:ro" \
            clauster:smoke
          ok=false
          for _ in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:7621/healthz || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "::error::docker run: /healthz never returned 200"
            docker logs clauster-smoke || true
            exit 1
          fi
          echo "docker run: /healthz 200 ✓"
          docker rm -f clauster-smoke
      - name: docker compose → /healthz
        env:
          # compose.yaml requires this (its `:?` guard); a real env var holds the
          # literal hash fine — only .env files need the `$`→`$$` doubling.
          CLAUSTER_AUTH_PASSWORD_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.ci.yaml up -d
          ok=false
          for _ in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:7621/healthz || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "::error::docker compose: /healthz never returned 200"
            docker compose -f compose.yaml -f compose.ci.yaml logs || true
            exit 1
          fi
          echo "docker compose: /healthz 200 ✓"
      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml down -v || true
          # Also reap the docker-run container — a failed healthz poll exits
          # before its inline `docker rm`, leaving it bound to port 7621.
          docker rm -f clauster-smoke || true

  # --------------------------------------------------------------------
  # Required-checks aggregator. ONE check for the `main` ruleset to gate
  # on (context: "ci required checks passed"), regardless of how many
  # underlying jobs exist. `if: always()` so it runs even when a need
  # failed or was skipped; jq fails it iff any listed job is neither
  # success nor skipped. Add a ci.yml job by appending to `needs:`.
  # --------------------------------------------------------------------
  ci-required-checks-passed:
    name: ci required checks passed
    if: always()
    needs:
      - setup
      - tests
      - build
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
