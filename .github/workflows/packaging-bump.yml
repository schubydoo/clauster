name: Packaging manifest bump

# Keep the in-repo package-manager manifests — the Scoop bucket (bucket/clauster.json),
# the Homebrew formula (Formula/clauster.rb), and the Nix flake (flake.nix) — in
# lockstep with published releases. Scoop's manifest carries `checkver`/`autoupdate`,
# but nothing INVOKES them for a self-hosted bucket (the official Scoop Excavator only
# services the ScoopInstaller org); Homebrew/Nix have no auto-update at all. Without
# this, `scoop install` / `brew install` / `nix run` keep serving whatever version the
# committed manifests pin, frozen until someone bumps them by hand.
#
# So on every published release we regenerate each manifest's version/url/hash from the
# release's authoritative SHA256SUMS (via scripts/bump_packaging.py) and open a PR. We
# DON'T push to main: main is branch-protected, and the bump is reviewable like any
# other change. release-please is deliberately NOT the mechanism — it runs at PR-prep
# time, before the binaries (and therefore the hashes) exist.
#
# A manifest not yet on main is skipped (the helper no-ops on absent files), so this can
# merge ahead of the Homebrew/Nix packaging and light them up once they land.
#
# Trust root: the SHA256SUMS asset, fetched over GitHub TLS from our own just-published
# release — the same trust model the install.sh/install.ps1 one-liners use. (Optional
# future hardening: `cosign verify-blob` against the shipped SHA256SUMS.sigstore.json
# before trusting it.)
on:
  release:
    types: [published]
  # Manual re-run for the rare case a release published but this job didn't fire
  # (or failed). Provide the tag explicitly, e.g. `v0.11.0`; empty = latest.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync the packaging manifests to (e.g. v0.11.0). Empty = latest."
        required: false
        default: ""

# Read-only by default; the write scope is minted just-in-time via the App token.
permissions:
  contents: read

concurrency:
  group: packaging-bump-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Sync packaging manifests to the release
    # workflow_dispatch is restricted to the default branch so a dispatch from an
    # arbitrary ref can't run this write-capable job. (release events already use
    # the default branch's workflow file.)
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # App token (NOT the default GITHUB_TOKEN): a PR opened by the default token
      # would not trigger downstream CI, and the default token can't push a branch
      # under branch protection. Re-minted per job (cheap). Requires secrets
      # RELEASE_PLEASE_APP_ID + RELEASE_PLEASE_APP_PRIVATE_KEY.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolve + STRICTLY validate the tag before it ever reaches a shell. The raw
      # value is passed via env (never inlined into the script) and must match a
      # vMAJOR.MINOR.PATCH shape, so a malformed/hostile tag can't inject.
      - name: Resolve target release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }} # read-only default token is enough to read releases
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to act on non-release tag '$tag' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Target tag: $tag"

      # Regenerate version/url/hash for every present manifest from the release's
      # SHA256SUMS. The helper fails closed (non-zero exit) if a present manifest's
      # asset is missing or a stale version would survive — we never push a
      # half-baked manifest. Absent manifests are skipped.
      - name: Regenerate packaging manifests
        id: regen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$tmp"
          python3 scripts/bump_packaging.py "$VERSION" "$GITHUB_REPOSITORY" "$tmp/SHA256SUMS"

          if git diff --quiet; then
            echo "Manifests already at $VERSION — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # Push to a per-version branch and open (or update) a PR. Never main.
      - name: Open packaging bump PR
        if: ${{ steps.regen.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          branch="packaging-bump/${TAG}"
          case "$branch" in
            packaging-bump/v[0-9]*) ;;
            *) echo "::error::refusing to push to unexpected branch '$branch'"; exit 1 ;;
          esac

          git config user.name "clauster-ci[bot]"
          git config user.email "clauster-ci[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          # Stage only the manifests that exist — the bump helper skips absent ones,
          # so `git add <missing-path>` must not hard-fail the job.
          for f in bucket/clauster.json Formula/clauster.rb flake.nix; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "chore(packaging): bump manifests to ${VERSION}"
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"

          # Open the PR only if one isn't already open for this branch (re-run safe).
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            body="$(printf '%s\n' \
              "Auto-generated by \`packaging-bump.yml\` on release **${TAG}**." \
              "" \
              "Regenerates the Scoop / Homebrew / Nix manifests' version, URLs, and" \
              "checksums from the release's signed \`SHA256SUMS\` (only manifests present" \
              "on main are touched). Review + merge to publish the new version to those" \
              "package managers.")"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(packaging): bump manifests to ${VERSION}" \
              --body "$body"
          else
            echo "PR already open for $branch — pushed the updated manifests to it."
          fi

          # Enable native auto-merge (squash) so the deterministic, CI-verified bump
          # lands hands-free once required checks pass — no manual merge per release.
          # The PR still satisfies the full main ruleset (required checks + thread
          # resolution); auto-merge removes the human click, not the gate. NOTE: the
          # ruleset requires 0 approvals and Greptile isn't a required check, so this
          # PR class merges with no human/reviewer eyes — a deliberate carve-out from
          # the usual "wait for the reviewer" rule, accepted because the bump is
          # machine-generated from the release's signed SHA256SUMS (fails closed), not
          # hand-authored logic. To require a human, set the ruleset to 1 approval.
          # Best-effort: a disabled repo "Allow auto-merge" setting or an unresolved
          # review thread just leaves the PR for a manual merge, so never fail the job.
          if ! gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$branch"; then
            echo "::warning::could not enable auto-merge on $branch — merge it manually"
          fi
