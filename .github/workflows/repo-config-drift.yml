name: Repo Config Drift

# Advisory drift check for repository LABELS and basic SETTINGS against the committed
# baselines in .github/repo-config/. The WRITE/reconcile half is repo-config-apply.yml.
#
# Advisory only — NEVER blocks a merge: both jobs are continue-on-error, always exit 0,
# and only print to the job summary. Do NOT add either to the required status checks.
#
# TOKEN SPLIT:
#   * `drift` (default GITHUB_TOKEN, no secrets) verifies labels + the read-VISIBLE
#     settings. Plain `pull_request` (never pull_request_target) + read-only perms, so it
#     is safe on fork PRs — a fork can't exfiltrate or mutate anything.
#   * `settings-admin` verifies the merge flags (allow_*_merge, delete_branch_on_merge),
#     which GET /repos returns ONLY to an admin-scope token (the GITHUB_TOKEN lacks it). It
#     uses REPO_CONFIG_TOKEN and runs ONLY on non-PR events (push:main / schedule /
#     dispatch), so no secret is ever exposed to a PR (fork or not). Read-only — it never
#     writes; reconciliation stays in repo-config-apply.yml.
#   * Branch protection / rulesets are out of scope (owned by the repo ruleset).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1" # weekly admin-settings verify, Monday 07:30 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-config-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: repo-config drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      issues: read # labels live on the issues API surface
    steps:
      # SHA-pinned (repo policy requires full-length commit SHAs) and
      # persist-credentials:false — this job only reads via `gh api`, it never
      # uses the git credential, so don't leave the token in .git/config.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check labels + settings drift (advisory, never blocks)
        id: drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          drift=0
          degraded=0

          {
            echo "## Repo config drift (advisory — does not block merge)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # --- LABELS ----------------------------------------------------
          # Normalise both sides identically: sort by name, sort object keys.
          # The fetch is guarded: a gh/jq failure (token / rate-limit / API blip)
          # is reported as "degraded" rather than silently writing an empty file
          # that the diff would then misread as massive drift (fail loud, not closed-
          # green). With `set -e` the bare fetch would abort the step; wrapping it in
          # the `if` keeps the job advisory while still surfacing the failure.
          if gh label list --repo "$REPO" --json name,color,description \
               | jq -S 'sort_by(.name)' > live-labels.json \
             && jq -S 'sort_by(.name)' .github/repo-config/labels.json \
               > baseline-labels.json; then
            if diff -u baseline-labels.json live-labels.json > labels.diff; then
              echo "### Labels: no drift ✅" >> "$GITHUB_STEP_SUMMARY"
            else
              drift=1
              {
                echo "### Labels: DRIFT ⚠️"
                echo ""
                echo "Live labels differ from \`.github/repo-config/labels.json\`."
                echo ""
                echo '```diff'
                cat labels.diff
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            degraded=1
            echo "### Labels: check degraded ⚠️ (API / permission / rate-limit)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # --- SETTINGS --------------------------------------------------
          # The merge flags (allow_*_merge, delete_branch_on_merge) are intentionally NOT compared:
          # GET /repos returns them only to an admin-level token, and the default GITHUB_TOKEN has
          # no `administration` scope, so it reads them as null → a permanent false drift. They
          # stay in settings.json and are reconciled by the apply workflow (REPO_CONFIG_TOKEN, which
          # has Administration); the main ruleset enforces squash-only/linear history regardless.
          # One shared filter projects BOTH sides to the read-visible subset, so they can't diverge.
          settings_filter='{description, homepage, topics: (.topics | sort), has_issues, has_wiki, has_projects}'
          if gh api "repos/$REPO" --jq "$settings_filter" | jq -S '.' > live-settings.json \
             && jq -S "$settings_filter" .github/repo-config/settings.json > baseline-settings.json; then
            if diff -u baseline-settings.json live-settings.json > settings.diff; then
              echo "### Settings: no drift ✅" >> "$GITHUB_STEP_SUMMARY"
            else
              drift=1
              {
                echo "### Settings: DRIFT ⚠️"
                echo ""
                echo "Live settings differ from \`.github/repo-config/settings.json\`."
                echo ""
                echo '```diff'
                cat settings.diff
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            degraded=1
            echo "### Settings: check degraded ⚠️ (API / permission / rate-limit)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$drift" -ne 0 ]; then
            {
              echo ""
              echo "> Drift detected. This check is **advisory only** and does"
              echo "> not block merge. To accept the live state as the new"
              echo "> baseline, refresh the JSON in \`.github/repo-config/\`"
              echo "> (see that folder's README)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$degraded" -ne 0 ]; then
            {
              echo ""
              echo "> ⚠️ One or more checks were **degraded** (a \`gh\`/\`jq\` call failed) —"
              echo "> the drift result above may be incomplete. Still advisory; never blocks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Advisory: never gate a merge. `continue-on-error` on the step covers any
          # unexpected `set -e` exit; the normal / drift / degraded paths reach here.
          exit 0

  # Verify the admin-only merge settings (allow_*_merge, delete_branch_on_merge) that the
  # default GITHUB_TOKEN can't read. Runs ONLY on non-PR events, so REPO_CONFIG_TOKEN is never
  # exposed to a (fork) PR. Read-only + advisory like the drift job — reconciliation lives in
  # repo-config-apply.yml.
  settings-admin:
    name: repo-config settings — admin-only fields (advisory)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout (the read of repo settings uses REPO_CONFIG_TOKEN, not GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check admin-only settings drift (advisory, never blocks)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_CONFIG_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Repo config drift — admin-only merge settings (advisory)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # One shared filter, projected identically onto both sides — same DRY pattern as the
          # read-visible settings in the drift job.
          filter='{allow_squash_merge, allow_merge_commit, allow_rebase_merge, delete_branch_on_merge}'

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "> REPO_CONFIG_TOKEN not set — admin-only fields not verified (degraded)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Guarded like the drift job: a gh/jq failure reports "degraded" rather than aborting.
          if gh api "repos/$REPO" --jq "$filter" | jq -S '.' > live-admin.json \
             && jq -S "$filter" .github/repo-config/settings.json > baseline-admin.json; then
            if jq -e 'any(.[]; . == null)' live-admin.json >/dev/null; then
              # The API returned the repo but null'd these admin-only fields → the token lacks
              # effective admin visibility (scope / SSO), NOT real drift. Report degraded so a
              # mis-scoped token can't masquerade as a booleans-vs-null false DRIFT.
              echo "### Merge settings: check degraded ⚠️ (token lacks admin visibility)" >> "$GITHUB_STEP_SUMMARY"
            elif diff -u baseline-admin.json live-admin.json > admin.diff; then
              echo "### Merge settings: no drift ✅" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### Merge settings: DRIFT ⚠️"
                echo ""
                echo "Live merge settings differ from \`.github/repo-config/settings.json\`."
                echo ""
                echo '```diff'
                cat admin.diff
                echo '```'
                echo ""
                echo "> Advisory — does not block. Reconcile via the Repo Config Apply workflow,"
                echo "> or refresh \`.github/repo-config/settings.json\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### Merge settings: check degraded ⚠️ (API / permission / rate-limit)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Advisory: never gate a merge.
          exit 0
