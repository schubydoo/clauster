# Keep open PRs current with main so the strict-up-to-date ruleset never forces
# a manual "Update branch" click. When main moves, merge it into every open PR's
# branch (the same operation as the GitHub "Update branch" button). Squash-merge
# collapses those merge commits, so main's history stays linear.
#
# Rolled in-repo (one `pulls.updateBranch` call via the first-party, SHA-pinned
# actions/github-script) rather than a third-party action — zero supply-chain
# surface to re-audit on version bumps.
#
# Auth: the default GITHUB_TOKEN CANNOT drive update-branch — github-actions[bot]
# lacks push rights to the head branch, so it 403s ("user doesn't have permission
# to update head repository"). We mint a short-lived token for the existing
# clauster-release-bot App (already has contents + PR write for release PRs),
# reusing the release-please secrets — no new credential. An App token also
# re-triggers the updated PR's CI (GITHUB_TOKEN would not), which we want.
#
# Bot-authored PRs (release-please App, Renovate) are skipped automatically by
# the `user.type === "Bot"` check; the excluded labels are belt-and-suspenders
# in case a release/dependency PR is ever opened by a non-bot.
name: Auto-update PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: update open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # job token only reads; the App token (below) does the writes
    steps:
      - name: Mint a clauster-release-bot token (reuses the release-please App secrets)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Scope the minted token to ONLY what update-branch needs, not the
          # App's full permission set (the x-accepted-github-permissions for
          # update-branch is pull_requests=write).
          permission-pull-requests: write
      - name: Update open PRs targeting the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const EXCLUDE = new Set([
              "dependencies",
              "autorelease: pending",
              "autorelease: tagged",
              "autorelease: snapshot",
              "autorelease: published",
            ]);
            const base = context.payload.repository.default_branch;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              base,
              state: "open",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            let updated = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.user?.type === "Bot") continue; // release-please + Renovate
              if (pr.labels.some((l) => EXCLUDE.has(l.name))) continue;
              try {
                await github.rest.pulls.updateBranch({
                  ...context.repo,
                  pull_number: pr.number,
                  // No-op (422) if the head moved under us — never clobbers a racing push.
                  expected_head_sha: pr.head.sha,
                });
                core.info(`updated #${pr.number} ${pr.title}`);
                updated++;
              } catch (err) {
                // 409 (merge conflict) and 422 (head moved / nothing to update)
                // are expected per-PR conditions — skip and continue. Anything
                // else (401/403 token or rate-limit, 5xx outage) is systemic:
                // fail the job loudly rather than passing green having updated
                // nothing.
                const status = err?.status ?? err?.response?.status;
                if (status === 409 || status === 422) {
                  core.warning(`skip #${pr.number} (${status}): ${err.message}`);
                  continue;
                }
                throw err;
              }
            }
            core.info(`updated ${updated} of ${prs.length} open PR(s) targeting ${base}`);
