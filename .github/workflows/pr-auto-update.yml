# Keep open PRs current with main so the strict-up-to-date ruleset never forces
# a manual "Update branch" click. When main moves, merge it into every open PR's
# branch (the same effect as the "Update branch" button). Squash-merge collapses
# those merge commits, so main's history stays linear.
#
# Rolled in-repo (the first-party, SHA-pinned actions/github-script) rather than a
# third-party action — zero supply-chain surface to re-audit on version bumps.
#
# Auth + API: the pulls.updateBranch REST endpoint is NOT available to GitHub Apps
# (its OpenAPI enabledForGitHubApps is false), and the default GITHUB_TOKEN is
# App-backed — so it can never call it (403 "user doesn't have permission to update
# head repository"). We instead use the repos.merge endpoint (enabledForGitHubApps
# true), authorized by a short-lived clauster-ci App token (reuses the clauster-ci
# App secrets — no new credential). An App token also re-triggers the updated PR's CI.
#
# Bot-authored PRs (the clauster-ci release App, Renovate) are skipped via the
# `user.type === "Bot"` check; fork PRs (head in another repo) and the excluded
# labels are skipped too.
#
# Two operational levers:
#   - Per-PR hold: label a PR `no-autoupdate` to leave it BEHIND main (it stays
#     out of the sweep until the maintainer rebases it manually).
#   - Global kill-switch: `gh variable set AUTO_UPDATE --body off` pauses the
#     whole sweep repo-wide (every open PR is left behind); `gh variable set
#     AUTO_UPDATE --body on` (or `gh variable delete AUTO_UPDATE`) resumes it.
# Either way, a held/paused PR sits BEHIND main and can't merge under the
# strict-up-to-date ruleset until it's manually updated — that's the intent.
name: Auto-update PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: update open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # job token only reads; the App token (below) does the writes
    steps:
      - name: Mint a clauster-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLAUSTER_CI_APP_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          # Exactly what the merges API needs: contents:write to push the merge
          # commit, pull_requests:read to list the open PRs.
          permission-contents: write
          permission-pull-requests: read
      # Fail LOUD if the mint produced an empty token (App uninstalled, secret
      # unresolved, etc.). Without this guard, github-script below would run with
      # an empty github-token and fall back to the job's default GITHUB_TOKEN — and
      # merge commits created with GITHUB_TOKEN do NOT re-trigger the updated PR's
      # CI (GitHub's recursion-suppression). That is the silent failure behind the
      # "required checks sit Expected, PR BLOCKED" symptom (issue #509): better to
      # error the job than to push a CI-suppressing merge commit. The mint action
      # usually fails on a bad secret, but this makes the empty-token contract
      # explicit and self-documenting.
      - name: Verify App token was minted
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::clauster-ci App token mint produced an empty token; \
          refusing to proceed (a merge commit pushed with GITHUB_TOKEN would not \
          re-trigger PR CI). Check the CLAUSTER_CI_APP_ID / CLAUSTER_CI_APP_PRIVATE_KEY \
          secrets and that the clauster-ci App is installed on this repo."
          exit 1
      - name: Update open PRs targeting the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTO_UPDATE: ${{ vars.AUTO_UPDATE }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const mode = (process.env.AUTO_UPDATE || 'on').toLowerCase();
            if (mode === 'off') { core.info('auto-update disabled via the AUTO_UPDATE repo variable'); return; }
            const EXCLUDE = new Set([
              "dependencies",
              "no-autoupdate", // per-PR opt-out: maintainer rebases this one manually
            ]);
            const base = context.payload.repository.default_branch;
            const repoFullName = context.payload.repository.full_name;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              base,
              state: "open",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            let updated = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.user?.type === "Bot") continue; // the release bot + Renovate
              if (pr.head?.repo?.full_name !== repoFullName) continue; // fork PR
              if (pr.labels.some((l) => EXCLUDE.has(l.name))) {
                core.info(`skip #${pr.number} (hold label)`);
                continue;
              }
              try {
                // merges API (App-enabled, unlike update-branch): merge the default
                // branch INTO the PR's branch — same effect as "Update branch".
                const resp = await github.rest.repos.merge({
                  ...context.repo,
                  base: pr.head.ref, // target: the PR branch
                  head: base, // source: the default branch
                });
                // 201 = merge commit created; 204 = already up to date (no-op).
                if (resp.status === 201) {
                  core.info(`updated #${pr.number} ${pr.title}`);
                  updated++;
                } else {
                  core.info(`#${pr.number} already current`);
                }
              } catch (err) {
                // 409 (merge conflict) and 404 (branch vanished) are expected
                // per-PR conditions — skip. Anything else (403 token, 5xx outage)
                // is systemic: fail loudly rather than passing green having done
                // nothing.
                const status = err?.status ?? err?.response?.status;
                if (status === 409 || status === 404) {
                  core.warning(`skip #${pr.number} (${status}): ${err.message}`);
                  continue;
                }
                throw err;
              }
            }
            core.info(`updated ${updated} of ${prs.length} open PR(s) targeting ${base}`);
