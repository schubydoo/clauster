# Keep open PRs current with main so the strict-up-to-date ruleset never forces
# a manual "Update branch" click. When main moves, merge it into every open PR's
# branch (the same effect as the "Update branch" button). Squash-merge collapses
# those merge commits, so main's history stays linear.
#
# Rolled in-repo (the first-party, SHA-pinned actions/github-script) rather than a
# third-party action — zero supply-chain surface to re-audit on version bumps.
#
# Auth + API: the pulls.updateBranch REST endpoint is NOT available to GitHub Apps
# (its OpenAPI enabledForGitHubApps is false), and the default GITHUB_TOKEN is
# App-backed — so it can never call it (403 "user doesn't have permission to update
# head repository"). We instead use the repos.merge endpoint (enabledForGitHubApps
# true), authorized by a short-lived clauster-ci App token (reuses the release-please
# secrets — no new credential). An App token also re-triggers the updated PR's CI.
#
# Bot-authored PRs (release-please App, Renovate) are skipped via the
# `user.type === "Bot"` check; fork PRs (head in another repo) and the excluded
# labels are skipped too.
name: Auto-update PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: update open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # job token only reads; the App token (below) does the writes
    steps:
      - name: Mint a clauster-ci App token (reuses the release-please App secrets)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Exactly what the merges API needs: contents:write to push the merge
          # commit, pull_requests:read to list the open PRs.
          permission-contents: write
          permission-pull-requests: read
      - name: Update open PRs targeting the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const EXCLUDE = new Set([
              "dependencies",
              "autorelease: pending",
              "autorelease: tagged",
              "autorelease: snapshot",
              "autorelease: published",
            ]);
            const base = context.payload.repository.default_branch;
            const repoFullName = context.payload.repository.full_name;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              base,
              state: "open",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            let updated = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.user?.type === "Bot") continue; // release-please + Renovate
              if (pr.head?.repo?.full_name !== repoFullName) continue; // fork PR
              if (pr.labels.some((l) => EXCLUDE.has(l.name))) continue;
              try {
                // merges API (App-enabled, unlike update-branch): merge the default
                // branch INTO the PR's branch — same effect as "Update branch".
                const resp = await github.rest.repos.merge({
                  ...context.repo,
                  base: pr.head.ref, // target: the PR branch
                  head: base, // source: the default branch
                });
                // 201 = merge commit created; 204 = already up to date (no-op).
                if (resp.status === 201) {
                  core.info(`updated #${pr.number} ${pr.title}`);
                  updated++;
                } else {
                  core.info(`#${pr.number} already current`);
                }
              } catch (err) {
                // 409 (merge conflict) and 404 (branch vanished) are expected
                // per-PR conditions — skip. Anything else (403 token, 5xx outage)
                // is systemic: fail loudly rather than passing green having done
                // nothing.
                const status = err?.status ?? err?.response?.status;
                if (status === 409 || status === 404) {
                  core.warning(`skip #${pr.number} (${status}): ${err.message}`);
                  continue;
                }
                throw err;
              }
            }
            core.info(`updated ${updated} of ${prs.length} open PR(s) targeting ${base}`);
