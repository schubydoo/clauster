name: Installer smoke

# Smoke-test every install method on real runners (the cross-OS / package-manager
# coverage the dev host can't provide): the one-line installers install.sh (Linux +
# macOS) and install.ps1 (Windows), the Homebrew formula (macOS), and the Nix flake
# (Linux). Each resolves a published release, installs the standalone binary, and
# asserts the installed `clauster` reports a version. Validates the install code (this
# PR's) against the real release assets. Non-required signal job (like build-binaries).
on:
  workflow_dispatch:
  pull_request:
    # ready_for_review fires on the draft→ready flip; keep opened/synchronize/
    # reopened so normal PRs + fixup pushes keep smoking installers — setting
    # any types: replaces the implicit defaults (#623).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - install.sh
      - install.ps1
      - uninstall.sh
      - uninstall.ps1
      - Formula/clauster.rb
      - flake.nix
      - flake.lock
      - .github/workflows/installer-smoke.yml

# Read-only; the installers only fetch public release assets. No secrets.
permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sh:
    name: install.sh (${{ matrix.os }})
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    strategy:
      fail-fast: false
      matrix:
        # One runner per published binary arch so install.sh is smoked end-to-end on
        # each: ubuntu-latest->linux-x86_64, ubuntu-24.04-arm->linux-arm64,
        # macos-latest->macos-arm64, macos-15-intel->macos-x86_64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run install.sh + verify
        run: |
          set -euo pipefail
          bash ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          clauster --version
          clauster --version | grep -q '^clauster'

  ps1:
    name: install.ps1 (windows)
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install.ps1 runs under a function + try/catch (no `exit`, for iex safety); it
      # signals failure via $global:LASTEXITCODE rather than a non-zero process exit,
      # so verify the OUTCOME (binary present + runnable) — more robust than trusting
      # the script's exit status.
      - name: Run install.ps1 + verify
        shell: pwsh
        run: |
          ./install.ps1
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\clauster\clauster.exe'
          if (-not (Test-Path $dest)) { throw "clauster.exe was not installed at $dest" }
          $v = & $dest --version
          if ($LASTEXITCODE -ne 0) { throw "clauster.exe --version exited with code $LASTEXITCODE" }
          Write-Host "version: $v"
          if ($v -notmatch '^clauster') { throw "unexpected --version output: $v" }

  uninstall-sh:
    name: uninstall.sh (${{ matrix.os }})
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Install the real binary, then prove uninstall.sh detects it (dry run changes
      # nothing) and removes it (a plain -y run leaves clauster off PATH). No state dir
      # or service exists on a fresh runner, so this smokes binary detection + removal.
      - name: install.sh then uninstall.sh
        run: |
          set -euo pipefail
          bash ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          clauster --version | grep -q '^clauster'
          # Dry run must detect the binary and remove nothing. Capture the output before
          # grepping: `grep -q` closes the pipe on first match, and the script's next
          # write would then hit EPIPE (a broken-pipe failure under pipefail).
          dry="$(bash ./uninstall.sh --dry-run)"
          printf '%s\n' "$dry" | grep -q 'binary:'
          test -x "$HOME/.local/bin/clauster"
          # Real uninstall removes the binary.
          bash ./uninstall.sh -y
          test ! -e "$HOME/.local/bin/clauster"
          if command -v clauster >/dev/null 2>&1; then
            echo "clauster still resolvable after uninstall" >&2; exit 1
          fi

  uninstall-ps1:
    name: uninstall.ps1 (windows)
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Verify OUTCOME (binary gone) rather than the script's exit status, mirroring the
      # install.ps1 job — the script signals via $global:LASTEXITCODE for iex safety.
      - name: install.ps1 then uninstall.ps1
        shell: pwsh
        run: |
          ./install.ps1
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\clauster\clauster.exe'
          if (-not (Test-Path $dest)) { throw "clauster.exe was not installed at $dest" }
          ./uninstall.ps1 -DryRun
          if (-not (Test-Path $dest)) { throw "dry run removed the binary" }
          ./uninstall.ps1 -Yes
          if (Test-Path $dest) { throw "clauster.exe still present after uninstall" }

  brew:
    name: Homebrew (${{ matrix.os }})
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel] # Apple Silicon + Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: brew install via a local tap + verify
        run: |
          set -euo pipefail
          # Modern Homebrew refuses a bare local formula path — it must live in a tap.
          # Stage our formula into an ephemeral local tap (mirrors real consumption via
          # a homebrew-<x> repo) and install from there.
          brew tap-new schubydoo/local --no-git
          tap_dir="$(brew --repository schubydoo/local)"
          mkdir -p "$tap_dir/Formula"
          cp ./Formula/clauster.rb "$tap_dir/Formula/clauster.rb"
          brew install --formula schubydoo/local/clauster
          clauster --version
          clauster --version | grep -q '^clauster'

  nix:
    name: Nix flake (${{ matrix.os }})
    if: github.event.pull_request.draft != true # draft PRs skip; ready_for_review re-fires (#623)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm] # x86_64 + arm64 Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Install Nix via the SHA-pinned action instead of `curl | sh` (the unpinned
      # download-then-run Scorecard flags as Pinned-Dependencies). The action verifies
      # its own installer; flakes are enabled via extra_nix_config.
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build + run the flake
        run: |
          set -euo pipefail
          # --no-update-lock-file uses the committed flake.lock and errors if it's
          # stale (rather than silently regenerating it), asserting lock/flake match.
          nix build .#clauster -L --no-update-lock-file
          ./result/bin/clauster --version
          ./result/bin/clauster --version | grep -q '^clauster'
          nix run .#clauster --no-update-lock-file -- --version
