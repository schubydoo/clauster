name: Installer smoke

# Smoke-test the one-line installers on real runners: install.sh (Linux + macOS)
# and install.ps1 (Windows) each resolve the latest published release, download the
# matching standalone binary, verify its SHA-256, and install it. We then assert the
# installed `clauster` reports a version. This validates the installer SCRIPTS (the
# PR's code) against the real release assets — the cross-OS coverage the dev host
# can't provide. Non-required signal job (like build-binaries / fuzzing).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/installer-smoke.yml

# Read-only; the installers only fetch public release assets. No secrets.
permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sh:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest -> linux-x86_64, macos-latest -> macos-arm64: both have a
        # published 0.10.0 binary, so install.sh should succeed end-to-end.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run install.sh + verify
        run: |
          set -euo pipefail
          bash ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          clauster --version
          clauster --version | grep -q '^clauster'

  ps1:
    name: install.ps1 (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # install.ps1 runs under a function + try/catch (no `exit`, for iex safety); it
      # signals failure via $global:LASTEXITCODE rather than a non-zero process exit,
      # so verify the OUTCOME (binary present + runnable) — more robust than trusting
      # the script's exit status.
      - name: Run install.ps1 + verify
        shell: pwsh
        run: |
          ./install.ps1
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\clauster\clauster.exe'
          if (-not (Test-Path $dest)) { throw "clauster.exe was not installed at $dest" }
          $v = & $dest --version
          if ($LASTEXITCODE -ne 0) { throw "clauster.exe --version exited with code $LASTEXITCODE" }
          Write-Host "version: $v"
          if ($v -notmatch '^clauster') { throw "unexpected --version output: $v" }
