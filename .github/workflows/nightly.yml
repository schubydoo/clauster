name: Nightly

# Daily build off main: push a rolling `:edge` multi-arch image to GHCR (signed
# with cosign, same as a release) and stash the nightly sdist+wheel as a
# downloadable workflow artifact. Skips itself when main hasn't moved in the
# last day (nothing new to rebuild); `workflow_dispatch` always runs.
#
# `:edge` is explicitly NOT `:latest` — the newest stable `v*` release keeps
# both the `:latest` image tag and GitHub's "Latest" release. This workflow
# never creates a GitHub Release.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

# The image goes out in three jobs — build by digest, sign, then tag — so `:edge` is
# never pullable while unsigned. See release.yml's header for the full reasoning; the
# shape is identical here.

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    name: changed since yesterday?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      # The exact main commit this run evaluated — the build jobs check out THIS,
      # not `refs/heads/main`, so a push to main mid-run can't make image/testpypi
      # build a different (or mismatched) commit than the gate saw.
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nightly always builds main — pin it so a workflow_dispatch selected
          # from another ref can't sneak that ref's code into the build.
          ref: refs/heads/main
          persist-credentials: false
      - name: Was there a commit in the last day?
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Freeze the commit the rest of the run builds (HEAD = main's tip here).
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Publish from main only. A workflow_dispatch can be launched from any
          # ref; refuse anything but main so we never push a feature branch to
          # `:edge` / nightly-dist.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nightly publishes from main only; got $REF → skip."
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → build."
            exit 0
          fi
          last=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          age=$(( now - last ))
          # ~25h window (a little over the daily cron period) so a commit since
          # the last run always triggers, with margin for runner scheduling jitter.
          if [ "$age" -le 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is ${age}s old → build."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit in ~25h (HEAD ${age}s old) → skip."
          fi

  image:
    name: nightly :edge image (amd64 + arm64)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deployment environment for the GHCR push (audit trail; protection rules,
    # if any, are managed repo-side). Same name the release GHCR push uses.
    environment: ghcr
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tagset.outputs.tags }}
    # No id-token here: `docker build` runs the Dockerfile, and that must not share
    # a job with the cosign OIDC identity. The `image-sign` job below signs the
    # digest this one pushes. Mirrors release.yml's docker-build/docker-sign split.
    permissions:
      contents: read
      # See release.yml's docker-build: the provenance/SBOM here are BuildKit
      # attestations pushed to the registry, so no `attestations: write` is needed
      # (that scope only serves GitHub's attestations API, which needs an OIDC token).
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }} # the exact commit the gate froze
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `edge` = the rolling main build; `sha-<short>` pins each night's build.
          # Deliberately NOT `latest` (that stays on the newest stable release).
          tags: |
            type=raw,value=edge
            type=sha,format=short
      - name: Build and push BY DIGEST (amd64 + arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No `tags:` — see release.yml's docker-build. `:edge` only appears after
          # the signature lands, so a pullable tag is never unsigned.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Flatten the tag set for the tag job
        id: tagset
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          flat="$(printf '%s' "$TAGS" | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//')"
          if [ -z "$flat" ]; then
            echo "::error::metadata-action produced no tags; refusing to continue" >&2
            exit 1
          fi
          echo "tags=$flat" >> "$GITHUB_OUTPUT"

  image-sign:
    name: Sign the nightly image (cosign keyless)
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ghcr # a signature is a registry publish; keep it in the same audit trail
    # No `contents: read` — this job never checks the repository out. It signs a
    # digest the build job already pushed, so nothing it runs comes from the repo.
    permissions:
      packages: write # cosign writes the signature back to ghcr.io
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::no image digest from the build job; refusing to sign" >&2
            exit 1
          fi
          # cosign signatures are keyed on the manifest DIGEST, not the tag —
          # both tags (edge, sha-<short>) point to the same digest, so a single
          # sign covers both.
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # Tags go on AFTER the signature — see release.yml's docker-tag for why this is
  # safe (imagetools re-tags content-addressably, so the digest and the signature
  # still match) and for the verify loop that proves it every run.
  image-tag:
    name: Tag the signed nightly image
    needs: [image, image-sign]
    if: needs.image-sign.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ghcr
    permissions:
      packages: write # write the tags to ghcr.io
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prove the digest really is signed BEFORE making it pullable
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # `needs.image-sign.result == 'success'` says a job finished; it does not say a
          # signature exists on THIS digest. That is the one fact the three-job order
          # exists to guarantee, so observe it against the registry instead of inferring
          # it from job status. Read-only — no id-token, no extra permission.
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/nightly\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"
      - name: Tag the signed digest, then prove the tags resolve to it
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ] || [ -z "${TAGS}" ]; then
            echo "::error::missing digest or tag set from the build job; refusing to tag" >&2
            exit 1
          fi
          args=()
          for tag in ${TAGS}; do args+=(--tag "${tag}"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for tag in ${TAGS}; do
            got="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${tag} resolves to ${got}, not the signed ${DIGEST}." \
                   "The tags are ALREADY LIVE. Sign ${got} and re-run, or delete the tags." >&2
              exit 1
            fi
            echo "verified ${tag} -> ${DIGEST}"
          done

  # Build the nightly dev dists in a job with NO id-token — `uv build` executes the
  # build backend and its hooks, and the version stamp below rewrites source files
  # before it. None of that may share a job with the TestPyPI OIDC identity. Same
  # split as release.yml's pypi-build/pypi.
  testpypi-build:
    name: nightly dev build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions REPLACE the workflow default, so re-declare
    # contents: read for the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }} # the exact commit the gate froze
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4" # pinned uv (Renovate-tracked); skip the flaky "latest" fetch
          # No cache in a publishing job (zizmor cache-poisoning): a cache
          # restored from a lower-privilege context could taint the artifact
          # this OIDC step ships. A once-a-night build gains little from a cache.
          enable-cache: false
      - name: Set up Python 3.13 (for uv build)
        run: uv python install 3.13
      # Stamp a unique PEP 440 dev version: the NEXT minor + `.dev<run_id>`, e.g.
      # 0.7.0 -> 0.8.0.dev27076179745. github.run_id increases monotonically per
      # repo, so each nightly sorts above the previous; the dev segment marks the
      # build as a pre-release of the next release (above the last real one, below
      # its final). The stamp script is stdlib-only, so it runs on the runner's
      # system python3 (no uv project sync needed); uv build below uses the 3.13
      # installed above. Edits the CI checkout only — never committed.
      - name: Stamp nightly dev version
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys
          n = os.environ["RUN_ID"]
          init = pathlib.Path("src/clauster/__init__.py")
          pyproj = pathlib.Path("pyproject.toml")

          def fail(msg):
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          text = init.read_text()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not m:
              fail("__version__ not found in src/clauster/__init__.py")
          cur = m.group(1)
          parts = cur.split(".")
          if len(parts) < 2 or not (parts[0].isdigit() and parts[1].isdigit()):
              fail(f"unexpected version format '{cur}' (want major.minor[.patch])")
          dev = f"{int(parts[0])}.{int(parts[1]) + 1}.0.dev{n}"

          # re.subn returns the replacement count — refuse to continue if a
          # pattern didn't match, so we never build/publish the stale real
          # version (which uv reads from pyproject) instead of the dev one.
          new_init, ni = re.subn(
              r'(__version__\s*=\s*")[^"]+(")', lambda x: x.group(1) + dev + x.group(2), text, count=1
          )
          # Anchor to the [project] table so a stray `version = "..."` in an
          # earlier [tool.*] section can't be stamped by mistake (which would be
          # a single, wrong replacement the count guard wouldn't catch).
          new_pt, npp = re.subn(
              r'(?ms)(^\[project\].*?\n)(version\s*=\s*")[^"]+(")',
              lambda x: x.group(1) + x.group(2) + dev + x.group(3),
              pyproj.read_text(), count=1,
          )
          if ni != 1 or npp != 1:
              fail(f"version substitution failed (init={ni}, pyproject={npp}) — refusing to publish a stale version")
          init.write_text(new_init)
          pyproj.write_text(new_pt)
          print(f"::notice::nightly version {dev}")
          PY
      - name: Build
        # Pin the build interpreter to the 3.13 installed above — `uv python
        # install` only puts it on PATH, it doesn't make `uv build` select it
        # (it would otherwise resolve whatever Python uv finds). clauster is
        # pure-Python (py3-none-any wheel) so the artifact is identical across
        # interpreters, but pinning keeps the build deterministic regardless of
        # ubuntu-latest's system Python.
        run: uv build --python 3.13
      - name: Upload nightly dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  testpypi:
    name: nightly dev build → TestPyPI
    needs: testpypi-build
    if: needs.testpypi-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted Publishing to TestPyPI (OIDC) — no stored token. This needs a
    # publisher configured on test.pypi.org FIRST (Account → Publishing → add a
    # pending publisher): PyPI project `clauster`, owner `schubydoo`, repo
    # `clauster`, workflow `nightly.yml`, environment `testpypi`. Until that
    # exists the publish step 403s (there is nothing to add on our side).
    environment:
      name: testpypi
      url: https://test.pypi.org/project/clauster/
    # No `contents: read` — this job never checks the repository out. It downloads
    # the dists the build job produced and uploads them, so nothing it runs comes
    # from the repository while the OIDC token is live.
    permissions:
      id-token: write
    steps:
      - name: Download the nightly dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # A re-dispatch of the same run would reuse the version; don't fail on it.
          skip-existing: true
