name: Claude review

# On-demand PR review: comment "@claude review" on a pull request.
# The job and all its settings live in schubydoo/shared-workflows. This file only calls it.

# No `concurrency:` on purpose. The workflow starts on every PR comment, and most comments
# are not "@claude review", so cancel-in-progress would kill a running review each time
# someone comments on the PR.
# jactionlint ignore=concurrency-limits
on:
  # A comment starts the review, so this trigger is required.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    # A called workflow gets no more permissions than the caller grants.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: schubydoo/shared-workflows/.github/workflows/claude-review.yml@dfc9a1a6f664da8bfb79511b2804426ccd47dc47 # v1.0.25
    secrets:
      app-client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
      # Only for the `auth: oauth` fallback.
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
