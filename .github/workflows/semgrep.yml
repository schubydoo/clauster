name: Semgrep

# Connects this repo to the Semgrep AppSec Platform (web dashboard) via
# `semgrep ci` + SEMGREP_APP_TOKEN. This is DISTINCT from the `semgrep` job in
# security.yml: that one runs `semgrep scan --config auto` and uploads SARIF to
# GitHub's code-scanning tab (and gates via the `security required checks
# passed` aggregator). This workflow instead reports to the Semgrep dashboard
# using the org's configured policy/rulesets. `semgrep ci` is diff-aware on PRs
# and does a full scan on push/schedule.
#
# Local hardenings over the upstream Semgrep template (so this survives the
# repo's own `zizmor` workflow-audit gate in security.yml):
#   - actions/checkout is SHA-pinned (unpinned-uses) — same pin as the rest of
#     the repo.
#   - persist-credentials: false (artipacked).
#   - explicit top-level least-privilege permissions.

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    # random HH:MM to avoid a load spike on GitHub Actions at 00:00
    - cron: "12 15 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: semgrep ci
