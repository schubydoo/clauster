name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "18 7 * * 1"
  push:
    branches: [main]
  # NOTE: deliberately NO `release: [published]` trigger. ossf/scorecard-action only
  # runs on the default branch and hard-fails ("Only the default branch main is
  # supported", .github#817) on a tag ref, so such a trigger only ever red-X'd every
  # release without scoring anything. Signed-Releases is re-scored after a publish by
  # the post-publish push to main from the packaging-bump PR merge (auto-merged, #480)
  # plus the weekly cron above — any main-ref scan after publish reads the new signed
  # assets via the releases API, so an immediate release-event scan was never needed.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # PAT with admin:read so the Branch-Protection check can read the
          # branch rules (the default GITHUB_TOKEN can't). Secret is configured
          # repo-side; without it that check scores 0 / "inconclusive".
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: results.sarif
          category: scorecard
