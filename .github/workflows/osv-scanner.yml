name: OSV-Scanner

# Scan our committed lockfiles (uv.lock, package-lock.json, tests/e2e/package-lock.json,
# flake.lock) against the OSV database (osv.dev) and upload SARIF to Security > Code scanning.
# Complements Dependabot: a broader advisory corpus, and it scans the *resolved* lockfiles
# rather than manifest version ranges. Non-required signal jobs (like fuzzing / e2e), and
# report-only for now (`fail-on-vuln: false`) so findings surface without blocking merges —
# flip to blocking once the signal is tuned. Tracked as #320 on Project #3.
#
# The OSV reusable workflows are SHA-PINNED, not tag-pinned. GitHub allows a reusable-workflow
# ref to be a SHA, tag, or branch (SHA is the safest — GitHub's own recommendation). Pinning by
# SHA — instead of the tag the OSV docs show — keeps the required `zizmor` workflow-audit check
# green and avoids re-introducing the Scorecard Pinned-Dependencies alerts cleared in #319.
# Renovate tracks the pin via the trailing `# vX.Y.Z` comment (helpers:pinGitHubActionDigests).

on:
  pull_request:
    # Trimmed off the `synchronize` storm (pr-auto-update fans a main push across
    # every open PR). This PR scan is report-only (fail-on-vuln:false) and overlaps
    # dependency-review on manifest CVEs, so a per-push rerun adds little; push:main
    # + the weekly cron remain the real gate.
    types: [opened, reopened, ready_for_review]
    # Scoped to what this scan actually reads: the committed lockfiles listed in
    # the header, the manifests they resolve from, and this workflow itself (so a
    # change here is still validated on its own PR). A `paths:` filter is SAFE
    # here — and only here — because NEITHER job below is a required status check:
    # a PR that skips the whole workflow leaves no context stuck at "Expected —
    # waiting for status", which is the #196 breakage that a paths-filtered
    # REQUIRED check causes. (ci.yml / security.yml back required contexts and so
    # must keep firing on every PR; they trim via an in-job conditional instead.)
    # push:main + the weekly cron still scan everything, so nothing goes
    # unscanned — this only stops re-scanning unchanged lockfiles on PRs that
    # cannot have moved a dependency.
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "tests/e2e/package.json"
      - "tests/e2e/package-lock.json"
      - "flake.lock"
      - "flake.nix"
      - ".github/workflows/osv-scanner.yml"
  schedule:
    - cron: "27 5 * * 1" # weekly full scan, Monday 05:27 UTC
  push:
    branches: [main]
  workflow_dispatch:

# No secrets, and fork PRs run safely (plain `pull_request`, never `pull_request_target`).
# Default-deny at the workflow level; each job grants only what it needs (least privilege).
permissions: {}

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-aware scan on PRs: reports only the vulnerabilities the PR introduces.
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: false # report-only signal for now; flip to blocking once tuned
    permissions:
      security-events: write # upload the SARIF to Security > Code scanning
      contents: read # checkout + read the lockfiles
      actions: read # read run metadata for the SARIF upload

  # Full scan on a schedule, on pushes to main, and on manual dispatch, via the OSV-Scanner
  # reusable full-scan workflow (SHA-pinned, like scan-pr above). This previously ran the
  # pinned OSV-Scanner binary directly because the reusable workflow referenced a conditional
  # actions/download-artifact@<tag> internally, which the repo's require-SHA-pin policy rejects
  # transitively at action-resolution time (it never runs, but still must resolve). Upstream
  # SHA-pinned that action in v2.5.0 (download-artifact@3e5f45b2 # v8.0.1), so every `uses:` in
  # the reusable workflow now resolves to a full-length SHA and the workaround is no longer
  # needed (#326). The reusable full-scan defaults to `-r ./` — the same recursive lockfile scan
  # the binary ran — and report-only via `fail-on-vuln: false`.
  scan-scheduled:
    name: full scan
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      fail-on-vuln: false # report-only signal for now; flip to blocking once tuned
    permissions:
      security-events: write # upload the SARIF to Security > Code scanning
      contents: read # checkout + read the lockfiles
      actions: read # read run metadata for the SARIF upload
