name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # This job name is a REQUIRED status check (see .github/settings.yml). The
    # family leaves lint non-required; clauster gates on it. Renaming this job
    # means updating the branch-protection contexts list too — so the name stays
    # "ruff + pyright" even though the job now also gates Markdown + YAML lint
    # (scripts/lint-docs.sh), to avoid orphaning the required context.
    name: ruff + pyright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install
        run: uv sync --extra dev --python 3.13
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright src/clauster
      # Markdown (markdownlint-cli2 via npx, version-pinned in the script) + YAML
      # (yamllint, installed by `uv sync --extra dev` above). The runner ships
      # Node/npx, so no extra setup is needed. Same script developers run locally.
      - name: markdown + yaml lint
        run: bash scripts/lint-docs.sh
