name: Scoop manifest bump

# Keep the in-repo Scoop bucket manifest (bucket/clauster.json) in lockstep with
# published releases. The manifest carries Scoop's own `checkver`/`autoupdate`
# blocks, but nothing INVOKES them for a self-hosted bucket (the official Scoop
# Excavator only services the ScoopInstaller org). Without this, `scoop install
# clauster` keeps serving whatever version the committed manifest pins, frozen
# until someone bumps it by hand.
#
# So on every published release we regenerate the manifest's version/url/hash from
# the release's authoritative SHA256SUMS and open a PR. We DON'T push to main: main
# is branch-protected, and the bump is reviewable like any other change. release-
# please is deliberately NOT the mechanism — it runs at PR-prep time, before the
# binaries (and therefore the hash) exist.
#
# Trust root: the SHA256SUMS asset, fetched over GitHub TLS from our own just-
# published release — the same trust model the install.sh/install.ps1 one-liners
# use. (Optional future hardening: `cosign verify-blob` against the shipped
# SHA256SUMS.sigstore.json before trusting it.)
on:
  release:
    types: [published]
  # Manual re-run for the rare case a release published but this job didn't fire
  # (or failed). Provide the tag explicitly, e.g. `v0.11.0`; empty = latest.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync the Scoop manifest to (e.g. v0.11.0). Empty = latest published."
        required: false
        default: ""

# Read-only by default; the write scope is minted just-in-time via the App token.
permissions:
  contents: read

concurrency:
  group: scoop-bump-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Sync bucket/clauster.json to the release
    # workflow_dispatch is restricted to the default branch so a dispatch from an
    # arbitrary ref can't run this write-capable job. (release events already use
    # the default branch's workflow file.)
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # App token (NOT the default GITHUB_TOKEN): a PR opened by the default token
      # would not trigger downstream CI, and the default token can't push a branch
      # under branch protection. Re-minted per job (cheap). Requires secrets
      # RELEASE_PLEASE_APP_ID + RELEASE_PLEASE_APP_PRIVATE_KEY.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolve + STRICTLY validate the tag before it ever reaches a shell. The raw
      # value is passed via env (never inlined into the script) and must match a
      # vMAJOR.MINOR.PATCH shape, so a malformed/hostile tag can't inject.
      - name: Resolve target release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }} # read-only default token is enough to read releases
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to act on non-release tag '$tag' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Target tag: $tag"

      # Regenerate version/url/hash from the release's SHA256SUMS. Fails closed if
      # the Windows asset (or its checksum) is missing — we never push a half-baked
      # manifest. jq --indent 4 preserves the file's existing formatting.
      - name: Regenerate Scoop manifest
        id: regen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          manifest="bucket/clauster.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest not found on the default branch"
            exit 1
          fi

          tmp="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$tmp"

          asset="clauster-${VERSION}-windows-x86_64.exe"
          hash="$(awk -v f="$asset" '$2 == f { print $1 }' "$tmp/SHA256SUMS")"
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::no valid sha256 for $asset in the $TAG SHA256SUMS (got '${hash:-<empty>}')"
            exit 1
          fi

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}#/clauster.exe"
          jq --indent 4 \
            --arg v "$VERSION" --arg u "$url" --arg h "$hash" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            "$manifest" > "$manifest.new"
          mv "$manifest.new" "$manifest"

          if git diff --quiet -- "$manifest"; then
            echo "Manifest already at $VERSION — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- "$manifest"
          fi

      # Push to a per-version branch and open (or update) a PR. Never main.
      - name: Open Scoop bump PR
        if: ${{ steps.regen.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          branch="scoop-bump/${TAG}"
          case "$branch" in
            scoop-bump/v[0-9]*) ;;
            *) echo "::error::refusing to push to unexpected branch '$branch'"; exit 1 ;;
          esac

          git config user.name "clauster-ci[bot]"
          git config user.email "clauster-ci[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add bucket/clauster.json
          git commit -m "chore(scoop): bump bucket manifest to ${VERSION}"
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"

          # Open the PR only if one isn't already open for this branch (re-run safe).
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            body="$(printf '%s\n' \
              "Auto-generated by \`scoop-bump.yml\` on release **${TAG}**." \
              "" \
              "Updates \`bucket/clauster.json\` version/url/hash from the release's" \
              "signed \`SHA256SUMS\` (Windows x86_64). Review + merge to publish the" \
              "new version to Scoop users.")"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(scoop): bump bucket manifest to ${VERSION}" \
              --body "$body"
          else
            echo "PR already open for $branch — pushed the updated manifest to it."
          fi
