name: changeset-autodraft

# SUGGEST a changeset fragment (as a one-time PR COMMENT) on PRs that touch src/ but lack
# one. The advisory `changeset-check` workflow NAGS (✅/❌ presence gate); this one has the
# model DRAFT the fragment text and post it as a suggestion the author can copy in — it does
# NOT auto-commit to the PR (#536: the auto-commit-to-PR-head behaviour was removed; the
# author owns committing the fragment).
#
# SECURITY POSTURE (read before touching this file — it runs an LLM over the PR diff):
#   * The job is gated to TRUSTED, NON-BOT, SAME-REPO PRs only:
#       - same-repo head (head.repo.full_name == github.repository) — never a fork;
#       - author_association OWNER/MEMBER/COLLABORATOR (mirrors claude.yml's trust gate);
#       - user.type != 'Bot' (avoids release/Renovate self-loops);
#       - head_ref != 'release' (never knope's release PR — it deletes changesets).
#   * `pull_request`, NOT `pull_request_target` — no fork-head checkout under a write token.
#     Forks fall back to the read-only `changeset-check` nag.
#   * COMMENT-ONLY, split write-from-post (least privilege): the LLM step has ONLY
#     Read/Grep/Glob/Write + read-only PR-diff MCP tools — no git/Bash, use_commit_signing
#     off — so it CANNOT commit, push, or comment. It only WRITES `changeset-suggestion.md`
#     into the runner workspace. A separate github-script step reads that file and posts the
#     comment with the job's `GITHUB_TOKEN` (`pull-requests: write`). There is NO write to
#     the PR head and NO App token — strictly less privilege than the old auto-commit path.
#   * ONE-TIME (loop-breaker): the `gate` precheck sets should_suggest only when src/ is
#     touched, no changeset is present, the `no-changelog` label is absent, AND no prior
#     suggestion comment (hidden marker) exists. Because comment-only never adds a changeset,
#     this marker — not a committed file — is what stops a re-comment on every synchronize.
#   * GENERATE-ONCE CAN GO STALE: the suggestion reflects the diff at first sight; later
#     commits can drift it. Acceptable — it's a suggestion the human reviews before committing.
#   * Non-required check; a failure goes red but never blocks merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # cancel-in-progress is SAFE: a rapid synchronize that cancels a run mid-draft is re-
  # evaluated by the next run's gate (the marker/idempotency check), so it re-suggests at
  # most once. Do NOT flip to false — overlapping runs could double-post the suggestion.
  group: changeset-autodraft-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest:
    name: suggest a changeset
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != 'release'
      && github.event.pull_request.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the diff + checkout base for context
      issues: read # gate lists PR (issue) comments for the marker; explicit since we call the issues API
      pull-requests: write # post the one-time suggestion comment
      id-token: write # claude-code-action attests its run
    steps:
      # LOOP-BREAKER precheck. should_suggest = touchesSrc && !hasChangeset && !no-changelog
      # && !alreadySuggested. The marker comment is the idempotency key (comment-only never
      # adds a changeset, so hasChangeset alone can't stop a re-comment).
      - name: Decide whether to suggest
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map(l => l.name);
            const hasNoChangelogLabel = labels.includes('no-changelog');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const hasChangeset = files.some(f => /^\.changeset\/.+\.md$/.test(f.filename));
            const touchesSrc = files.some(f => f.filename.startsWith('src/'));
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const MARKER = '<!-- changeset-autodraft-suggestion -->';
            // Match only a BOT-authored comment carrying the marker, so a human quoting the
            // bot's suggestion (which echoes the marker) can't trip the loop-breaker.
            const alreadySuggested = comments.some(
              c => c.user && c.user.type === 'Bot' && (c.body || '').includes(MARKER)
            );
            const shouldSuggest =
              touchesSrc && !hasChangeset && !hasNoChangelogLabel && !alreadySuggested;
            core.info(`touchesSrc=${touchesSrc} hasChangeset=${hasChangeset} ` +
                      `noChangelogLabel=${hasNoChangelogLabel} alreadySuggested=${alreadySuggested} ` +
                      `→ shouldSuggest=${shouldSuggest}`);
            core.setOutput('should_suggest', String(shouldSuggest));
      # Read-only base checkout: gives the LLM the repo to read src/ for context and a
      # workspace to write the scratch suggestion file. persist-credentials:false + base ref
      # (not the PR head) → no write token on any checked-out tree.
      - name: Check out (base, read-only)
        if: steps.gate.outputs.should_suggest == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Draft a changeset suggestion (write a scratch file — does NOT commit or comment)
        id: claude
        if: steps.gate.outputs.should_suggest == 'true'
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1.0.153
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # read-only PR-diff MCP tools (same-repo)
          use_commit_signing: false
          prompt: |
            Automation task: this PR changes files under `src/` but has no
            `.changeset/*.md` fragment. clauster is changesets-only — without a fragment
            the change ships with no changelog entry and no version bump. DRAFT one changeset
            fragment and write it to a scratch file; a later workflow step posts it to the PR
            as a suggestion comment (it is NOT committed), so you only write the file.

            Steps:

            1. Read the PR diff and look at what changed under `src/`.

            2. Pick exactly ONE bump type from the knope changeset vocabulary, by the
               user-facing effect:
                  - `minor` — a new user-facing feature.
                  - `patch` — a bug fix or small user-facing change.
                  - `major` — a breaking change.
                  - `perf`     — a performance improvement (patch bump).
                  - `security` — a security fix (patch bump).
                  - `build`    — build system / dependency change (patch bump).
               When unsure, DEFAULT TO `patch`. Do not invent any other type.

            3. Write a single file `changeset-suggestion.md` in the repository root. Its
               contents must be EXACTLY — front-matter `---`, the type, a closing `---`, a
               blank line, then ONE present-tense sentence:

                   ---
                   default: <type>
                   ---

                   <one present-tense sentence summarizing the user-facing change.>

               Do NOT put a PR number in the file — knope appends it at release time. Do NOT
               write a hash followed by digits anywhere (GitHub renders it as a link to an
               unrelated issue/PR); describe instead.

            4. Write ONLY that one `changeset-suggestion.md` file. Do NOT modify any other
               file, do NOT create anything under `.changeset/`, and do NOT commit, push, or
               comment — a workflow step posts your suggestion. (You have no git tools.)
          # Least-privilege tools: read the diff + write the one scratch file. NO git / Bash /
          # comment tools and use_commit_signing is off, so the model CANNOT commit, push, or
          # post a comment — the github-script step below posts the controlled comment.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,mcp__github__get_pull_request,mcp__github__get_pull_request_diff"
      # Post the drafted suggestion as a one-time PR comment (with the hidden marker the gate
      # checks). If the model wrote nothing, fail RED — no silent green no-op.
      - name: Post the suggestion as a PR comment
        if: steps.gate.outputs.should_suggest == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let fragment = '';
            try {
              fragment = fs.readFileSync('changeset-suggestion.md', 'utf8').trim();
            } catch (e) {
              core.setFailed('changeset-autodraft: no changeset-suggestion.md was written; nothing to post.');
              return;
            }
            if (!fragment) {
              core.setFailed('changeset-autodraft: the drafted suggestion was empty; nothing to post.');
              return;
            }
            const MARKER = '<!-- changeset-autodraft-suggestion -->';
            const body = [
              MARKER,
              '### 📝 Suggested changeset',
              '',
              'This PR touches `src/` but has no `.changeset/*.md` fragment, so it would ship ' +
                'with **no changelog entry and no version bump**. Here is a suggested fragment — ' +
                'review the bump type, then save it as `.changeset/<short-slug>.md` and commit it ' +
                '(or add the `no-changelog` label if a changelog entry is intentionally not wanted):',
              '',
              '```markdown',
              fragment,
              '```',
              '',
              '_Suggestion only — not auto-committed. `changeset-check` confirms once a fragment is present._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
