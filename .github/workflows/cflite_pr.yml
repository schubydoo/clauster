# ClusterFuzzLite — fuzz code changed by each PR (Atheris harnesses in fuzz/).
# Informational/Phase-1: a short per-PR run on the `address` sanitizer; it is NOT
# a required check, so a flaky finding never blocks a merge, but a reproducible
# crash surfaces here (and as SARIF in the Security tab). Longer corpus-building
# runs belong in the scheduled cflite_batch.yml.
# Docs: https://google.github.io/clusterfuzzlite/
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]
    # Trimmed: fuzz only when fuzz-relevant code changes, and only on PR
    # open/reopen/ready (not the per-push `synchronize` storm). The nightly
    # cflite_batch is the deep fuzzer; this per-PR pass is a quick, non-required
    # regression check, so once per PR is enough. Still feeds the OSSF Fuzzing check.
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - "fuzz/**"
      - "pyproject.toml"
      - "uv.lock"
      # The build image + script + pinned requirement exports: a change here rewrites
      # how the fuzzers are BUILT, and without this entry nothing pre-merge executes
      # it (found on the PR that hash-pinned the installs — its rewritten build.sh
      # was never run by CI because this filter skipped the job).
      - ".clusterfuzzlite/**"
      # This workflow itself, for the same reason: a PR that changes how the PR fuzzer
      # RUNS (timeouts, inputs, the `language` that sets the reproduce budget) would
      # otherwise never execute the rewritten job pre-merge.
      - ".github/workflows/cflite_pr.yml"

permissions: {}

jobs:
  pr-fuzzing:
    runs-on: ubuntu-latest
    # Was the only cflite job on GitHub's 360-minute default. Sized from the last 15
    # successful runs (11m09s–38m54s): the driver is NOT `fuzz-seconds: 180` but the
    # BUILD of all 18 harnesses (~41s of PyInstaller each, ≈12 min), which is why this
    # job sits at or above the band of batch/prune (55) and coverage (60) despite the
    # far smaller fuzz budget. 75 rather than 60 so the headroom holds at the OBSERVED
    # MAX and not merely at a typical run: 39 + one full crash-triage cycle (10
    # reproduce attempts x 120s = 20 min, the python reproduce timeout that
    # `language: python` selects) = 59, which 60 would clear by a single minute.
    # A hung job now dies in 75 min instead of 360.
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # Must be set on the RUN step too, not just the build: this input defaults
          # to `c++`, and it becomes FUZZING_LANGUAGE in the runner. At the default,
          # crash reproduction gets DEFAULT_REPRODUCE_TIME_SECONDS (30s) instead of
          # the 120s python entry in oss-fuzz's PER_LANGUAGE_REPRODUCE_TIMEOUTS, so a
          # genuine Atheris crash that is slow to re-trigger is silently written off
          # as unreproducible and never reported.
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
