name: E2E

# Opt-in browser end-to-end suite (tests/e2e): a real headless Chromium driven via
# Vercel's `agent-browser` CLI against a real `clauster` subprocess. Excluded from the
# default/required `tests` gate (pyproject `--ignore=tests/e2e`) because it pulls a
# browser binary and is slower; this job runs it as a NON-REQUIRED signal — like the
# fuzzing job — so UI regressions surface without blocking the merge/coverage gate.
on:
  # Nightly on main: catch a DOM/selector drift that no PR happened to touch the UI in.
  schedule:
    - cron: "41 4 * * *"
  # Manual re-run from the Actions tab (any branch).
  workflow_dispatch:
  # Per-PR only when something the suite actually exercises changed — keeps the job off
  # the critical path for backend/docs-only PRs.
  pull_request:
    # ready_for_review fires on the draft→ready flip; keep opened/synchronize/
    # reopened so normal PRs + fixup pushes keep running e2e — setting any
    # types: replaces the implicit defaults (#623).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # The templates/static the suite exercises live UNDER src/clauster/ — the old
      # bare "templates/**" / "static/**" matched nothing, so e2e never ran on a UI
      # change (it merged a broken suite #577 → #629). Anchor to the real paths.
      - "src/clauster/templates/**"
      - "src/clauster/static/**"
      - "tests/e2e/**"
      - "scripts/e2e.sh"
      - ".github/workflows/e2e.yml"

# Read-only token; the job needs no write scopes and handles no secrets, so a fork PR
# runs it safely (plain `pull_request`, never `pull_request_target`).
permissions:
  contents: read

# Key on the PR number (globally unique, so two same-named branches from different
# forks can't collide and cancel each other's runs); fall back to the ref for the
# cron + workflow_dispatch triggers, which have no PR context.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: browser e2e (agent-browser)
    # Draft PRs skip the browser suite; ready_for_review re-fires it (#623).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv + Python
        uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install agent-browser CLI
        # Pinned + integrity-checked via tests/e2e/package-lock.json (`npm ci`),
        # instead of an unpinned `npm i -g` (the global install Scorecard flags as
        # Pinned-Dependencies). 0.27.3 regressed `check` on the trust-gate checkbox
        # (8 failures in CI, 5 locally); 0.27.1 is the verified-green version the
        # suite was developed against. Bump deliberately (lockfile) + re-verify.
        # Put node_modules/.bin on PATH so `agent-browser` resolves for later steps
        # and scripts/e2e.sh without a global install.
        working-directory: tests/e2e
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      # Pin the Chrome-for-Testing build this leg runs against. `agent-browser install`
      # fetches the LATEST Chrome, so a new Chrome-for-Testing release can silently
      # destabilize the (non-required) 2-core leg — Chrome 151 did, see #947. Install an
      # explicit, Renovate-tracked build via the pinned @puppeteer/browsers CLI and point
      # agent-browser at it with AGENT_BROWSER_EXECUTABLE_PATH (scripts/e2e.sh then skips
      # its own latest-Chromium download). A version bump is a Renovate PR that re-runs
      # this e2e leg, so a new Chrome is verified green before it can land.
      - name: Install pinned Chrome-for-Testing
        working-directory: tests/e2e
        env:
          # renovate: datasource=custom.chrome-for-testing depName=chrome-for-testing
          CHROME_VERSION: "150.0.7871.124"
        run: |
          exe=$(node_modules/.bin/browsers install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/cft" | awk 'END{print $NF}')
          test -x "$exe"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$exe" >> "$GITHUB_ENV"
          echo "CHROME_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
      # Prove agent-browser actually LAUNCHES the pinned build, not a bundled/latest
      # Chrome — the pin above only points at an executable; if a future agent-browser
      # ignored AGENT_BROWSER_EXECUTABLE_PATH the leg would silently run unpinned again.
      # Assert the live browser's UA major matches the pin; fail closed on a mismatch.
      - name: Verify the pinned Chrome is what runs
        working-directory: tests/e2e
        run: |
          major="${CHROME_VERSION%%.*}"
          node_modules/.bin/agent-browser open about:blank >/dev/null
          ua=$(node_modules/.bin/agent-browser eval 'navigator.userAgent')
          node_modules/.bin/agent-browser close --all >/dev/null 2>&1 || true
          echo "user-agent: $ua"
          case "$ua" in
            *"Chrome/${major}."*) echo "pinned Chrome ${major} confirmed in use" ;;
            *) echo "::error::agent-browser is NOT using the pinned Chrome ${major} (ua=${ua})"; exit 1 ;;
          esac
      - name: Run E2E suite
        run: scripts/e2e.sh
      # The headless run has no display — a screenshot of the failing page (captured
      # per-failure in tests/e2e/conftest.py) is the only post-mortem signal.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-screenshots
          path: tests/e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 7
