name: PR Title

# Validate that the pull-request title follows Conventional Commits. Because the
# repo squash-merges, the PR title becomes the squashed commit subject. (Versioning
# and the CHANGELOG are driven by `.changeset/` fragments via knope, not the commit
# type — see knope.toml — but a clean, conventional history is still required.)
#
# Keep `synchronize` in the trigger list: `conventional PR title` is a REQUIRED
# status check and required checks are evaluated per head-SHA. Dropping
# `synchronize` would leave a fixup push's new head commit with no check run, so
# the PR would sit "Expected — waiting for status" and never merge. The re-run on
# each push is cheap (minutes are free on this public repo), so the check stays
# satisfiable on every head SHA.

on:
  pull_request:
    # `ready_for_review` (non-default) is the issue #509 recovery path: flipping a
    # PR draft → ready re-dispatches this required check on the current head SHA
    # without a push, for the rare case a `synchronize` failed to dispatch it.
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: conventional PR title
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Mint a short-lived clauster-ci App installation token (≥5,000 REST
      # req/hr, vs the 1,000/hr github-actions[bot] pool that fails spuriously
      # under multi-PR bursts). Same-repo PRs only — fork PRs can't read the App
      # secrets, so the step is skipped there and the action falls back to
      # GITHUB_TOKEN (see the token select below). No new credential.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLAUSTER_CI_APP_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: read
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          # App token on same-repo PRs; GITHUB_TOKEN fallback on forks (the mint
          # step above is skipped, so steps.app-token.outputs.token is empty).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            build
            test
            refactor
            style
