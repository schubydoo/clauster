# ClusterFuzzLite — weekly corpus PRUNE + COVERAGE replay. The maintenance
# counterpart to the daily cflite_batch.yml (which fuzzes + grows the corpus).
#
# - prune: the daily batch keeps APPENDING inputs to the persisted corpus; pruning
#   minimizes it (drops inputs that add no coverage) so the storage-repo doesn't
#   grow unboundedly. It still writes SARIF — but never from a REPRODUCED crash:
#   cifuzz's prune path returns testcase=None, so nothing is saved as a testcase and
#   the job cannot fail on a finding. What lands is the LAST harness's merge log put
#   through ClusterFuzz's stack parser, so a genuine crash SIGNATURE does surface.
#   Read it as a signature, not as a reproduction.
# - coverage: builds the harnesses with the `coverage` sanitizer, replays the whole
#   persisted corpus, and pushes the replay artefacts to the corpus repo's
#   `gh-pages` branch under `coverage/latest/`.
#   ⚠️ Through 2026-08-30 no HTML line-coverage report had ever landed — verified
#   against the corpus repo. The cause was NOT "impossible for Python": oss-fuzz's
#   base-runner `coverage` script has a coverage.py branch that builds an htmlcov
#   report and moves it to $COVERAGE_OUTPUT_DIR/report/$PLATFORM. We never reached
#   it, because the `run_fuzzers` step below passed no `language` (only the BUILD
#   step did) and that input defaults to `c++`, so the script took its LLVM branch.
#   Proof, from the uploaded logs themselves: they carried `-merge=1`
#   MERGE-INNER/MERGE-OUTER lines, which only the C/C++ path emits — the Python path
#   runs `-atheris_runs=N` and emits none. `language: python` is now set on the run
#   step (#1327; #1322 is the umbrella), but it is NECESSARY, not proven SUFFICIENT:
#   the Python report stage also unzips a `${fuzzer}.pkg.deps.zip` out of the coverage
#   BUILD. That one should already be produced — base-builder's compile_python_fuzzer
#   emits it whenever SANITIZER matches *coverage*, which the build step below sets —
#   but it has never been OBSERVED here, so treat it as the open question. (The other
#   input, `.coverage_$target`, the run step writes at the end of each target that
#   exits cleanly; a target that dies mid-replay skips it.)
#   ⚠️ So on the NEXT SCHEDULED RUN, check three things on `gh-pages`: whether
#   `coverage/latest/report/` appeared, whether the per-harness logs below SURVIVED,
#   and whether their `DONE cov: E ft: F` lines are still there.
#   ⚠️ A `report/` directory is NOT by itself proof the numbers are right. The report
#   loop has no `set -e`: if a harness's `.coverage_$fuzzer` is missing (it dies
#   mid-replay), the `mv` fails silently and the PREVIOUS harness's data is
#   re-translated under this one's name. Two ways to catch that, because they cover
#   different halves: a `.coverage_*` count below the harness count catches only the
#   missing-file variant — in the stale case the count still MATCHES and only the
#   content is wrong, which shows up as two or more BYTE-IDENTICAL files
#   (`md5sum report/linux/.coverage_*`). ⚠️ And if `report/` carries no `.coverage_*`
#   at all, do not read that as failure until it is checked: upstream runs
#   coverage.py `combine` WITHOUT `--keep`, which deletes those files, so they may
#   never reach the upload. In that case fall back to the logs — a harness whose log
#   stops before its `DONE` line is the trigger for the stale re-translate.
#   Those logs are the only fuzz-coverage signal we have; if the Python
#   path stops producing them without yet producing a report, revert `language` on
#   THIS job only — batch and PR need it for the reproduce timeout regardless.
#   Wait for the cron rather than reaching for `workflow_dispatch`. Both jobs carry an
#   `if: github.ref == 'refs/heads/main'` gate (issue 1348), but that enforces only the
#   REF half: a dispatch from a feature branch is skipped outright, so the PAT can no
#   longer be handed to unmerged workflow code. A dispatch FROM MAIN still runs, and
#   still writes the real `gh-pages` with the write PAT — so the advice above stands,
#   the gate narrows who can trip it rather than removing the hazard.
#   Note the job passes either way — CFLite discards the coverage
#   script's output — so a green run proves nothing; only `gh-pages` does.
#   ⚠️ Expect the artefact SHAPE to change on the Python path even when it works:
#   `<harness>.log` still gets written, but `_error.log` and the MERGE-INNER/OUTER
#   lines are C/C++-only and should disappear, and `fuzzer_stats/<harness>.json`
#   becomes a dummy `{}`. Update this list and fuzz/README.md once observed.
#   What has landed to date (under the `c++` default):
#     coverage/latest/logs/<harness>.log             — that harness's libFuzzer
#       replay log (stdout+stderr); its LAST `#N DONE cov: E ft: F` line is the edge
#       (E) and feature (F) count reached over the whole persisted corpus. It is not
#       the last line of the file — MERGE-OUTER: lines follow it
#     coverage/latest/logs/<harness>_error.log       — always EMPTY, and empty means
#       "no crash line matched": the C/C++ path creates it by redirecting a grep for
#       libFuzzer `ERROR:` lines, which is why the file exists at all
#     coverage/latest/fuzzer_stats/coverage_targets.txt — the harness list
#   Those per-harness edge counts are the signal we actually have that the harness
#   set has kept up with the code: a harness pinned at a handful of edges is one
#   whose corpus never gets past the guard clause, and a module with no harness at
#   all simply does not appear. There is no per-line/per-module view yet — reading it
#   needs the human judgement fuzz/README.md ("Reading the weekly coverage signal")
#   describes. The corpus repo is private, so read the logs by cloning `gh-pages`.
#
# Both reuse the same private storage-repo + FUZZ_STORAGE_TOKEN PAT as the batch.
# WEEKLY (not daily): a coverage build + full-corpus replay is far heavier than a
# time-boxed fuzz run, and the corpus changes slowly. NOT a required check — it
# signals, it never gates. If the PAT is rotated/expired these jobs keep passing
# but silently stop pruning/uploading. See https://google.github.io/clusterfuzzlite/.
name: ClusterFuzzLite cron (prune + coverage)

on:
  schedule:
    - cron: "41 5 * * 0" # weekly, Sunday 05:41 UTC (offset from the daily batch + Monday scorecard)
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    name: prune corpus
    # Schedule events already run on the default branch; this also constrains a manual
    # dispatch to main, so the FUZZ_STORAGE_TOKEN write PAT below can never be handed to
    # unmerged workflow code dispatched from an arbitrary ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ≈ fuzz-seconds (a TOTAL, split across harnesses) + build. The ≈7 min was observed at a
    # smaller harness count; at 18 the build dominates and prune projects to ≈25 min.
    timeout-minutes: 55
    permissions:
      contents: read # checkout + build the harnesses
      security-events: write # prune writes a SARIF regardless of findings (see header)
    concurrency:
      group: ${{ github.workflow }}-prune
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (address)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Prune the persisted corpus
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # Set for consistency with the other jobs and with this job's own build
          # step; the input defaults to `c++`. The reproduce timeout it governs is
          # INERT on prune — cifuzz's prune path returns `testcase=None`, so
          # run_fuzzers skips the crash branch and never reaches is_crash_reportable.
          # Where the 120s-vs-30s actually bites is batch and PR (see cflite_pr.yml).
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 666, matching cflite_batch.yml, for the same 11 -> 18 harness-count reason:
          # prune runs the same divide-across-targets loop, and here the per-target slice
          # is a MERGE TIMEOUT that raises (clusterfuzz's libFuzzer engine raises
          # TimeoutError on a timed-out merge, and nothing catches it), not a fuzz
          # duration that simply ends. Holding the slice at ~37s keeps that headroom.
          fuzz-seconds: 666
          mode: prune
          sanitizer: address
          output-sarif: true
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main

  coverage:
    name: coverage replay (per-harness edge stats)
    # Same default-branch gate as `prune`: this job pushes replay artefacts to the corpus
    # repo's `gh-pages` with the FUZZ_STORAGE_TOKEN write PAT, so a dispatch from an
    # arbitrary ref must not reach it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Coverage build + full-corpus replay over every harness — the slow one, and the job
    # whose cost scales on BOTH axes with the harness count (a PyInstaller build each,
    # ~41s, and a replay each). Re-checked at 18 harnesses rather than assumed: the last
    # three runs took 12.1, 12.1 and 12.3 min at 8, so scaling both halves 8 -> 18 projects
    # to ≈27 min. That leaves ≈2.2x headroom, so 60 stands — but this is the number to
    # re-derive first if the harness count grows again, since it has the least slack.
    timeout-minutes: 60
    permissions:
      contents: read # builds + replays only; the logs are pushed via the storage PAT
    concurrency:
      group: ${{ github.workflow }}-coverage
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (coverage)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: coverage
      # Replays the persisted corpus and uploads the per-harness libFuzzer logs to
      # gh-pages. No HTML report has reached us yet — see the file header for what
      # has landed under coverage/latest/, and for the three things to check on the
      # next run now that `language: python` is set.
      - name: Replay the corpus and upload the edge stats
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # The input this job hinged on: it defaults to `c++`, and it becomes
          # FUZZING_LANGUAGE in the runner, which is what oss-fuzz's base-runner
          # `coverage` script branches on. At the default it took the LLVM branch and
          # never reached the coverage.py one that builds the htmlcov report. See the
          # file header for what that changes and what still has to be checked.
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Inert here: CFLite's CoverageTargetRunner overrides the per-target loop and
          # calls generate_coverage_report directly, so fuzz-seconds is only validated
          # (must be >= 1), never spent. Tuning it on THIS job changes nothing.
          fuzz-seconds: 300
          mode: coverage
          sanitizer: coverage
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
