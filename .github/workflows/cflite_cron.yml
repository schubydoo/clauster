# ClusterFuzzLite — weekly corpus PRUNE + COVERAGE replay. The maintenance
# counterpart to the daily cflite_batch.yml (which fuzzes + grows the corpus).
#
# - prune: the daily batch keeps APPENDING inputs to the persisted corpus; pruning
#   minimizes it (drops inputs that add no coverage) so the storage-repo doesn't
#   grow unboundedly. It still writes SARIF — but never from a REPRODUCED crash:
#   cifuzz's prune path returns testcase=None, so nothing is saved as a testcase and
#   the job cannot fail on a finding. What lands is the LAST harness's merge log put
#   through ClusterFuzz's stack parser, so a genuine crash SIGNATURE does surface.
#   Read it as a signature, not as a reproduction.
# - coverage: builds the harnesses with the `coverage` sanitizer, replays the whole
#   persisted corpus, and pushes the coverage artefacts to the corpus repo's
#   `gh-pages` branch under `coverage/latest/`.
#   Those artefacts are: an HTML line-coverage
#   report (report/linux/, summary.json, textcov_reports/), the per-harness libFuzzer replay
#   logs (logs/<harness>.log), the per-target fuzzer_stats/<harness>.json the per-PR
#   code-change job reads to prune to affected harnesses, and the
#   fuzzer_stats/coverage_targets.txt harness list. The base-runner writes those fuzzer_stats
#   as a dummy `{}` on the Python path, so the two steps at the end of this `coverage` job
#   rebuild them into real per-target stats (issue 1503, scripts/gen_fuzzer_stats.py). For how
#   to read these artefacts, see fuzz/README.md ("Reading the weekly coverage signal").
#
#   The report + real stats land only because `language: python` is set on the run step below
#   (#1327; #1322 is the umbrella); at the `c++` default the script takes its LLVM branch and
#   the Atheris wrappers feed it nothing (the old runs uploaded only the replay logs plus
#   coverage_targets.txt). Reverting
#   `language` on THIS job is a trade, not a free fallback: the run returns to the LLVM branch
#   and writes no `coverage_d_*`, so the rebuild step's generator exits 1 and FAILS the
#   coverage job; the per-target fuzzer_stats on gh-pages stay stale (not overwritten). The
#   report stops refreshing, and the per-PR job then prunes against older coverage
#   (cflite_pr.yml, which warns past 15 days).
#   Batch and PR keep `language: python` for the reproduce timeout regardless.
#
#   Dispatch only from main. The write PAT is an environment secret in `fuzz-corpus` whose
#   `main`-only deployment-branch policy GitHub enforces server-side (issue 1348), so a
#   feature-branch dispatch cannot reach it (the `if:` on both jobs is belt-and-braces). A
#   dispatch FROM MAIN runs and writes the real `gh-pages`. CFLite discards the coverage
#   script's own exit, so the report and logs are not proven by job colour; read `gh-pages`
#   for those. The rebuild step DOES fail the job, though, when it finds no
#   `coverage_d_*` (the revert case above).
#
# Both reuse the same private storage-repo + FUZZ_STORAGE_TOKEN PAT as the batch.
# WEEKLY (not daily): a coverage build + full-corpus replay is far heavier than a
# time-boxed fuzz run, and the corpus changes slowly. NOT a required check — it
# signals, it never gates. A rotated or expired PAT REDs both cron jobs at their `run_fuzzers`
# step, not silently: the storage-repo URL becomes unclonable, and cifuzz's `GitFilestore`
# clones it eagerly in its constructor with an uncaught `subprocess.check_call` (the same eager
# clone cflite_pr.yml gates with a `git ls-remote` pre-check). See
# https://google.github.io/clusterfuzzlite/.
name: ClusterFuzzLite cron (prune + coverage)

on:
  schedule:
    - cron: "41 5 * * 0" # weekly, Sunday 05:41 UTC (offset from the daily batch + Monday scorecard)
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    name: prune corpus
    # Same server-side enforcement as `batch-fuzzing`: FUZZ_STORAGE_TOKEN is an environment
    # secret in `fuzz-corpus`, whose `main`-only deployment-branch policy GitHub checks
    # before the job starts (not overridable by this file). The `if:` is belt-and-braces.
    environment: fuzz-corpus
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ≈ fuzz-seconds (a TOTAL, split across harnesses) + build. The ≈7 min was observed at a
    # smaller harness count; at 18 the build dominates and prune projects to ≈25 min.
    timeout-minutes: 55
    permissions:
      contents: read # checkout + build the harnesses
      security-events: write # prune writes a SARIF regardless of findings (see header)
    concurrency:
      group: ${{ github.workflow }}-prune
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (address)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Prune the persisted corpus
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # Set for consistency with the other jobs and with this job's own build
          # step; the input defaults to `c++`. The reproduce timeout it governs is
          # INERT on prune — cifuzz's prune path returns `testcase=None`, so
          # run_fuzzers skips the crash branch and never reaches is_crash_reportable.
          # Where the 120s-vs-30s actually bites is batch and PR (see cflite_pr.yml).
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 666, matching cflite_batch.yml, for the same 11 -> 18 harness-count reason:
          # prune runs the same divide-across-targets loop, and here the per-target slice
          # is a MERGE TIMEOUT that raises (clusterfuzz's libFuzzer engine raises
          # TimeoutError on a timed-out merge, and nothing catches it), not a fuzz
          # duration that simply ends. Holding the slice at ~37s keeps that headroom.
          fuzz-seconds: 666
          mode: prune
          sanitizer: address
          output-sarif: true
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main

  coverage:
    name: coverage replay (per-harness edge stats)
    # Same server-side enforcement as `prune`: this job pushes replay artefacts to the corpus
    # repo's `gh-pages` with the FUZZ_STORAGE_TOKEN PAT, held as an environment secret in
    # `fuzz-corpus` whose `main`-only deployment-branch policy GitHub enforces before the job
    # starts (not overridable by this file). The `if:` is belt-and-braces.
    environment: fuzz-corpus
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Coverage build + full-corpus replay over every harness — the slow one, and the job
    # whose cost scales on BOTH axes with the harness count (a PyInstaller build each,
    # ~41s, and a replay each). Re-checked at 18 harnesses rather than assumed: the last
    # three runs took 12.1, 12.1 and 12.3 min at 8, so scaling both halves 8 -> 18 projects
    # to ≈27 min. That leaves ≈2.2x headroom, so 60 stands — but this is the number to
    # re-derive first if the harness count grows again, since it has the least slack.
    timeout-minutes: 60
    permissions:
      contents: read # builds + replays only; the logs are pushed via the storage PAT
    concurrency:
      group: ${{ github.workflow }}-coverage
      cancel-in-progress: true
    steps:
      - name: Build fuzzers (coverage)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: coverage
      # Replays the persisted corpus and uploads the report, the logs, and the per-target
      # stats to gh-pages under coverage/latest/. See the file header.
      - name: Replay the corpus and upload the edge stats
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # The input this job hinged on: it defaults to `c++`, and it becomes
          # FUZZING_LANGUAGE in the runner, which is what oss-fuzz's base-runner
          # `coverage` script branches on. At the default it took the LLVM branch and
          # never reached the coverage.py one that builds the htmlcov report. See the
          # file header for what that changes.
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Inert here: CFLite's CoverageTargetRunner overrides the per-target loop and
          # calls generate_coverage_report directly, so fuzz-seconds is only validated
          # (must be >= 1), never spent. Tuning it on THIS job changes nothing.
          fuzz-seconds: 300
          mode: coverage
          sanitizer: coverage
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
      # The base-runner writes a dummy `{}` fuzzer_stats/<target>.json on the Python path
      # (llvm-cov summaries are C/C++-only), so cifuzz's code-change pruning sees no coverage
      # and keeps every target. Rebuild the real per-target stats from the base-runner's own
      # per-target coverage data (coverage_d_<target>, left in build-out/) and push them over
      # the dummies on gh-pages, so the per-PR job can prune to affected targets. The generator
      # reads the data with coverage's CoverageData API (no source tree needed on the runner).
      # See scripts/gen_fuzzer_stats.py and issue 1503.
      - name: Check out clauster for the stats generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _srcgen
          persist-credentials: false
      - name: Rebuild real per-target fuzzer_stats and push to gh-pages
        shell: bash
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          # Hash-pin the install: this step holds the FUZZ_STORAGE_TOKEN, so an unpinned
          # pip fetch is a PAT-exfil surface (Scorecard Pinned-Dependencies). --require-hashes
          # binds the install to the pinned artifacts; --only-binary=:all: keeps it to a wheel so
          # the step never runs a source build (deterministic, and it fails loudly when no wheel
          # matches rather than compiling one). coverage has no runtime deps, so --no-deps, and
          # the generator uses coverage's 7.x CoverageData API, so the pin caps below 8.
          # Regenerate on a bump (the header in the file records this same command):
          #   echo 'coverage>=7,<8' | uv pip compile - --generate-hashes --no-annotate \
          #     -o .github/gen-fuzzer-stats-requirements.txt
          python3 -m pip install --quiet --require-hashes --no-deps --only-binary=:all: \
            -r _srcgen/.github/gen-fuzzer-stats-requirements.txt
          work="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://${FUZZ_STORAGE_TOKEN}@github.com/schubydoo/clauster-fuzz-corpus.git" "$work"
          python3 _srcgen/scripts/gen_fuzzer_stats.py \
            --coverage-dir "$GITHUB_WORKSPACE/build-out" \
            --out-dir "$work/coverage/latest/fuzzer_stats"
          # A harness that dies mid-replay leaves no coverage_d_<target> file, so its stats
          # stay a dummy {} and it will not prune. That direction is safe but silent, so a
          # shrinking set is surfaced loudly rather than read off gh-pages (issue 1503 review).
          built="$(find "$GITHUB_WORKSPACE/build-out" -maxdepth 1 -name 'coverage_d_*' | wc -l)"
          # grep -c prints the count and exits 1 on zero matches, so guard with `|| true`
          # (not `|| echo 0`, which would append a second line) and default an empty result.
          expected="$(grep -c . "$work/coverage/latest/fuzzer_stats/coverage_targets.txt" 2>/dev/null || true)"
          expected="${expected:-0}"
          if [ "$built" -lt "$expected" ]; then
            msg="fuzzer_stats: rebuilt $built of $expected targets; the rest keep dummy {} and will not prune (a harness may have died mid-replay)"
            echo "::warning::$msg"
            echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage/latest/fuzzer_stats
          if git diff --cached --quiet; then
            echo "fuzzer_stats unchanged"
            exit 0
          fi
          git commit -m "Real per-target fuzzer_stats for code-change pruning (issue 1503)"
          git push origin gh-pages
