name: Release Please

# Release Please reads Conventional Commits on main and opens a "release PR" that
# bumps the version (src/clauster/__init__.py + pyproject.toml) and rewrites
# CHANGELOG.md. Merging that PR tags the commit (e.g. `v0.2.0`), which fires
# release.yml (`on: push: tags`).
#
# Release shape (immutable releases, #98): the GitHub Release is cut as a DRAFT
# (config draft:true), assets are attached while it is still tag-less, then it is
# PUBLISHED (draft=false) which creates the tag and locks it immutable WITH the
# assets. The crown-jewel invariant: NOTHING flips draft=false until every dist AND
# every target binary is built, signed, and attached — any failure leaves an
# unpublished, tag-less draft (recoverable by hand), never a half-signed publish.
#
# This runs release-please as TWO separate invocations on purpose: one that ONLY
# cuts the draft release (job `prepare`), and — after the publish job has created
# the git tag — one that ONLY opens/updates the next release PR (job `next_pr`).
# Splitting the halves is what stops release-please from opening a bogus full-history
# downgrade PR while the just-cut release is still tag-less (see per-step notes).
#
# Job DAG:
#   prepare  -> cut the draft (or determine no release); emit release_created/upload_url
#   binaries -> (only on a release) build the standalone one-file binaries, 3-OS matrix
#   publish  -> (only on a release) build+sign dists+binaries, attach to the draft, publish
#   next_pr  -> (every push) open/update the next release PR + sync uv.lock, AFTER any publish

on:
  push:
    branches: [main]
  # Manual re-run, for the rare case a publish fails midway and is finished by hand:
  # re-running opens/updates the next release PR against the now-published tag. The
  # "open next PR" job is gated so a by-hand re-trigger can't open a PR against a
  # half-published release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Cut the draft release ONLY (never the next PR) -----------------------
  # release-please normally (1) cuts a GitHub Release when a release PR was just
  # merged, and (2) opens/updates the NEXT release PR. We split those. Here we do
  # (1) only, via skip-github-pull-request, because our releases are drafts and a
  # draft carries NO git tag until the publish job un-drafts it. Letting
  # release-please compute the next PR now — while the just-cut release is tag-less
  # — makes it log "No latest release found", rebuild from full history, and open a
  # bogus downgrade PR (observed: 0.6.0 -> 0.2.1, #147). Deferring (2) to the
  # `next_pr` job (after the tag exists) means that bogus PR is never created.
  #
  # This job is FAST (no build): on a non-release push it just determines there is
  # nothing to release, so the binaries/publish jobs below cost nothing then.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a short-lived installation token for the Clauster release GitHub App so
      # release writing is the app's bot identity, NOT a human, AND so the tag pushed
      # at publish still *triggers* release.yml (GITHUB_TOKEN-pushed tags don't —
      # anti-recursion). Requires secrets RELEASE_PLEASE_APP_ID +
      # RELEASE_PLEASE_APP_PRIVATE_KEY (see repo setup). Re-minted per job (cheap)
      # rather than passed between jobs as an output (secret hygiene).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Cut the draft release (no PR)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # --- Build the standalone binaries (only on a real release) ----------------
  # Reuses the validated build+smoke matrix (build-binaries.yml, also a nightly/PR
  # signal job). All jobs leading to a SignPath signing request must run on
  # GitHub-hosted agents (OSS origin verification, PR3) — that matrix does. The
  # binaries are uploaded as run artifacts and consumed by the publish job below.
  binaries:
    needs: prepare
    if: ${{ needs.prepare.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml

  # --- Sign + attach dists AND binaries to the draft, then publish -----------
  # Why this exists: OSSF Scorecard scans Release ASSETS for signatures (registry
  # cosign + PyPI attestations never put them there). We build + Sigstore-sign the
  # sdist/wheel AND the standalone binaries, generate SLSA provenance over all of
  # them, attach everything to the draft, then publish. Publishing via the APP token
  # is what lets the resulting tag trigger release.yml (PyPI + Docker). FAIL CLOSED:
  # if any dist or target binary is missing/unsigned, abort before draft=false — the
  # release stays an unpublished draft (no tag, no PyPI/Docker), recoverable by hand.
  publish:
    needs: [prepare, binaries]
    if: ${{ needs.prepare.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing (OIDC)
      attestations: write # actions/attest records SLSA build provenance
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv (build)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false # this job can push; avoid the cache-poisoning vector
      - name: Build sdist + wheel
        run: uv build
      # Pull the binaries built by the `binaries` job into ./binaries (one dir,
      # flattened): each artifact carries the renamed binary + its .sha256.
      - name: Download the standalone binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clauster-binary-*
          path: binaries
          merge-multiple: true
      # Replace the per-target .sha256 files with a single signed SHA256SUMS over
      # the binaries, and assert all three expected targets are present BEFORE we
      # sign/attach anything — a missing target must abort, never silently ship a
      # partial set.
      - name: Collect binaries + checksums
        shell: bash
        run: |
          set -euo pipefail
          cd binaries
          rm -f ./*.sha256
          shopt -s nullglob
          bins=(clauster-*)
          for want in linux-x86_64 macos-arm64 windows-x86_64; do
            match=0
            for b in "${bins[@]}"; do case "$b" in *"$want"*) match=1 ;; esac; done
            [ "$match" -eq 1 ] || { echo "missing binary for target '$want'; aborting" >&2; exit 1; }
          done
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${bins[@]}" > SHA256SUMS
          else
            shasum -a 256 "${bins[@]}" > SHA256SUMS
          fi
          echo "collected ${#bins[@]} binaries + SHA256SUMS"
      # Sigstore-sign the dists, the binaries, and the checksum manifest. Sigstore v3
      # writes a .sigstore.json bundle next to each input and exits non-zero on
      # failure, so a signing error aborts before publish.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
            ./binaries/clauster-*
            ./binaries/SHA256SUMS
      # SLSA build provenance over BOTH dists and binaries (the in-toto bundle we
      # also attach as multiple.intoto.jsonl so Scorecard's Signed-Releases
      # provenance probe credits it — it scans assets, not the attestation API).
      # Step-level actions/attest (not slsa-github-generator, which targets a release
      # by TAG after publish) because our draft is tag-less until publish.
      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl,binaries/clauster-*,binaries/SHA256SUMS"
      - name: Attach signed assets to the draft, then publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # release-please (v5) exposes NO numeric `id` output; the draft's numeric
          # release id is embedded in upload_url (.../releases/{id}/assets{?...}), so
          # derive it from there (carried from the prepare job).
          UPLOAD_URL: ${{ needs.prepare.outputs.upload_url }}
          REPO: ${{ github.repository }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Derive + validate the numeric release id (a non-match would otherwise
          # pass through verbatim and slip past an emptiness check).
          RELEASE_ID="$(printf '%s' "${UPLOAD_URL}" \
            | sed -E 's#.*/releases/([0-9]+)/assets.*#\1#')"
          if ! printf '%s' "${RELEASE_ID}" | grep -qE '^[0-9]+$'; then
            echo "could not derive numeric release id from upload_url='${UPLOAD_URL}'; aborting" >&2
            exit 1
          fi
          shopt -s nullglob
          dists=(dist/*.tar.gz dist/*.whl)
          dist_sigs=(dist/*.sigstore dist/*.sigstore.json)
          bins=(binaries/clauster-*)
          # Exclude the .sigstore bundles from the binary list (they also match
          # binaries/clauster-*.sigstore.json under the glob).
          bin_files=(); bin_sigs=()
          for f in "${bins[@]}"; do
            case "$f" in *.sigstore|*.sigstore.json) bin_sigs+=("$f") ;; *) bin_files+=("$f") ;; esac
          done
          sums=(binaries/SHA256SUMS)
          # Sigstore v3 writes only `.sigstore.json`; a wildcard-free `.sigstore`
          # literal would survive nullglob as a phantom path and abort the upload
          # loop (and make the gate below dead code), so glob the real bundle only.
          sums_sigs=(binaries/SHA256SUMS.sigstore.json)
          # FAIL CLOSED — refuse to publish unless the full, signed set is present.
          if [ ${#dists[@]} -eq 0 ]; then
            echo "no sdist/wheel to upload; aborting" >&2; exit 1
          fi
          if [ ${#dist_sigs[@]} -eq 0 ]; then
            echo "no dist .sigstore bundles; refusing to publish unsigned artifacts" >&2; exit 1
          fi
          if [ ${#bin_files[@]} -eq 0 ]; then
            echo "no standalone binaries to upload; aborting" >&2; exit 1
          fi
          if [ ${#bin_sigs[@]} -lt ${#bin_files[@]} ]; then
            echo "binary .sigstore bundles (${#bin_sigs[@]}) < binaries (${#bin_files[@]}); refusing" >&2
            exit 1
          fi
          if [ ${#sums_sigs[@]} -eq 0 ]; then
            echo "SHA256SUMS not signed; refusing to publish" >&2; exit 1
          fi
          if [ -z "${PROVENANCE_BUNDLE:-}" ] || [ ! -s "${PROVENANCE_BUNDLE}" ]; then
            echo "no SLSA provenance bundle produced; refusing to publish without provenance" >&2
            exit 1
          fi
          provenance="dist/multiple.intoto.jsonl"
          cp "${PROVENANCE_BUNDLE}" "${provenance}"
          assets=("${dists[@]}" "${dist_sigs[@]}" "${bin_files[@]}" "${bin_sigs[@]}" \
                  "${sums[@]}" "${sums_sigs[@]}" "${provenance}")
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            # Idempotent re-runs: delete any same-named asset from an earlier attempt
            # (a 422 already_exists under set -e would strand the draft). NAME via env
            # (not inlined into --jq) so a basename can't break out of the filter.
            existing_id="$(NAME="$name" gh api \
              "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq '.[] | select(.name == env.NAME) | .id' | head -n1)"
            if [ -n "$existing_id" ]; then
              echo "replacing existing asset ${name} (id ${existing_id})"
              gh api --method DELETE "repos/${REPO}/releases/assets/${existing_id}"
            fi
            echo "uploading ${name}"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$f"
          done
          # Publish: creates the git tag (release locks immutable with the assets);
          # the app-token push is what triggers release.yml.
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false
          echo "published release ${RELEASE_ID} with ${#assets[@]} assets."

  # --- Open or update the next release PR + sync uv.lock (every push) ---------
  # The deferred half of release-please. Runs AFTER any publish so the git tag
  # exists (no bogus-downgrade PR), but on EVERY push so the pending release PR
  # stays current. The `if` runs it when no release happened OR the publish
  # succeeded — a failed/half publish leaves the draft for hand-recovery instead.
  next_pr:
    needs: [prepare, publish]
    if: >-
      ${{ always() && needs.prepare.result == 'success'
      && (needs.prepare.outputs.release_created != 'true' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # skip-github-release: never touches the release — only manages the
      # `release-please--*` PR. By now any publish has created the tag, so
      # release-please sees the real latest version (0 unreleased commits -> opens
      # nothing; new commits -> a correct PR off the true latest tag).
      - name: Open the next release PR (no release)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # --- Keep uv.lock's editable self-version in sync with the release bump ---
      # release-please bumps pyproject.toml's version but NOT uv.lock, so the lock's
      # `[[package]] name = "clauster"` version drifts behind each release. When a
      # release PR is open, regenerate uv.lock on that PR branch so the lock bumps
      # with pyproject in the same merge. No-op otherwise. Pushes only to the bot's
      # own `release-please--*` branch, never to main.
      - name: Detect open release PR
        id: relpr
        env:
          GH_TOKEN: ${{ github.token }} # read-only default token is enough for `pr list`
        run: |
          set -euo pipefail
          # Pick the release PR by *authenticated identity*, not just branch name: it
          # must be authored by the release App, target main, and be in-repo. The
          # branch-name prefix alone would let any collaborator open a
          # `release-please--*` PR and have us check it out + run `uv lock` (which can
          # execute the project's build backend) in this trusted push context with the
          # app token in scope. gh renders an App author as `app/<slug>`.
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json headRefName,baseRefName,author,isCrossRepository \
            --jq '[.[]
                   | select(.headRefName | startswith("release-please--"))
                   | select(.baseRefName == "main")
                   | select(.isCrossRepository == false)
                   | select(.author.login == "app/clauster-ci")
                  ][0].headRefName // ""')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$branch" ]; then echo "Release PR branch: $branch"; else echo "No open release PR."; fi
      - name: Check out repo
        if: ${{ steps.relpr.outputs.branch != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        if: ${{ steps.relpr.outputs.branch != '' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false # this job can push; setup-uv caching is a poisoning vector
      - name: Sync uv.lock on the release PR
        if: ${{ steps.relpr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ steps.relpr.outputs.branch }}
        run: |
          set -euo pipefail
          case "$PR_BRANCH" in
            release-please--*) ;;
            *) echo "refusing to push to unexpected branch '$PR_BRANCH'"; exit 1 ;;
          esac
          git fetch --quiet origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync — nothing to commit."
            exit 0
          fi
          bot_user="clauster-ci[bot]"
          if ! bot_id="$(gh api "/users/${bot_user}" --jq '.id' 2>&1)" || [ -z "$bot_id" ]; then
            echo "::notice::could not resolve ${bot_user} id (${bot_id:-empty}); using github-actions[bot]"
            bot_user="github-actions[bot]"; bot_id="41898282"
          fi
          git config user.name "$bot_user"
          git config user.email "${bot_id}+${bot_user}@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock to the release version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_BRANCH}"
          echo "Pushed uv.lock sync to $PR_BRANCH."
