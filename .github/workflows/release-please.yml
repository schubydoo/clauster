name: Release Please

# Release Please reads Conventional Commits on main and opens a "release PR"
# that bumps the version (src/clauster/__init__.py + pyproject.toml) and rewrites
# CHANGELOG.md. Merging that PR tags the commit (e.g. `v0.2.0`), which fires
# release.yml (`on: push: tags`).
#
# This workflow runs release-please as TWO separate invocations on purpose: one
# that ONLY cuts the draft release, and — after the publish step has created the
# git tag — one that ONLY opens/updates the next release PR. Splitting the two
# halves is what stops release-please from opening a bogus full-history downgrade
# PR while the draft release is still tag-less (see the per-step notes below).

on:
  push:
    branches: [main]
  # Manual re-run, for the rare case a publish fails midway and is finished by
  # hand: re-running opens/updates the next release PR against the now-published
  # tag. The "open next PR" step is idempotent and gated on success(), so a
  # by-hand re-trigger can't open a PR against a half-published release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # On a release this job also builds + Sigstore-signs + uploads the dists, so
    # give it headroom beyond the release-please/app-token steps — a timeout here
    # would strand the release as an unpublished draft.
    timeout-minutes: 15
    # GITHUB_TOKEN stays read-only: the App token (minted below) does all the
    # release writing (PR, version bump, draft-release assets, publish). The added
    # scopes are id-token: write, for Sigstore keyless signing (OIDC) of the release
    # artifacts; and attestations: write, so actions/attest-build-provenance can
    # record the SLSA build provenance (both used in the signed-assets step below).
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      # Mint a short-lived installation token for the Clauster release GitHub
      # App so the release PR + version-bump commits are authored by the app's
      # bot identity, NOT a human account. Crucially this is *not* the default
      # GITHUB_TOKEN, so the tag pushed when the release PR merges still
      # *triggers* release.yml (GITHUB_TOKEN-pushed tags don't — anti-recursion).
      #
      # Requires (set up once, manually):
      #   - a GitHub App owned by the repo owner, installed on this repo, with
      #     repo permissions Contents: R/W + Pull requests: R/W;
      #   - secrets RELEASE_PLEASE_APP_ID (numeric App ID) and
      #     RELEASE_PLEASE_APP_PRIVATE_KEY (the App's .pem private key).
      # Until those exist this step 401s — merge this only after they're added.
      # Supersedes the old RELEASE_PLEASE_TOKEN PAT (which attributed PRs to a
      # real user); that secret can be deleted once this is live.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Scope the minted token to exactly what release-please needs, rather
          # than inheriting the installation's full permission set (zizmor
          # least-privilege). Add permission-issues: write only if you enable
          # release-please's label-on-issue features.
          permission-contents: write
          permission-pull-requests: write

      # --- Cut the release ONLY (never the next PR) --------------------------
      # release-please normally does two things per run: (1) cut a GitHub Release
      # when a release PR was just merged, and (2) open/update the NEXT release
      # PR. We split those. Here we do (1) only, via skip-github-pull-request,
      # because our releases are drafts (config draft:true, so we can attach
      # Sigstore-signed assets before they lock immutable) and a draft carries NO
      # git tag until the publish step below un-drafts it. If we let release-please
      # compute the next PR now — while the just-cut release is still tag-less —
      # it logs "No latest release found", rebuilds from the full commit history,
      # and opens a bogus downgrade PR (observed: 0.6.0 -> 0.2.1, #147). Deferring
      # (2) until after the tag exists (the "Open the next release PR" step below)
      # means that bogus PR is never created — no open-then-close churn.
      - name: Cut the draft release (no PR)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # --- Sign + attach release artifacts (OSSF Scorecard: Signed-Releases) ---
      # release-please created the GitHub Release as a DRAFT (config draft:true) —
      # not yet immutable, and with no git tag. GitHub's own recommended flow for
      # immutable releases is exactly this: create a draft, attach assets, publish.
      # We build + Sigstore-sign the sdist/wheel, attach them + their .sigstore
      # bundles to the draft, then publish it; publishing creates the tag and locks
      # the release immutable WITH the signed assets. Publishing via the APP token
      # (not GITHUB_TOKEN) is what lets the resulting tag trigger release.yml
      # (PyPI + Docker) — same anti-recursion reason as the release PR's tag.
      # Why this exists: Scorecard scans Release ASSETS for signatures, which the
      # registry cosign signature and PyPI-side attestations never put there, so
      # every prior release scored 0 (asset-less). If a step here fails the release
      # stays an unpublished draft (no tag, no PyPI/Docker) — recoverable by hand,
      # never a half-signed publish.
      - name: Check out the release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv (build)
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false # this job can push; avoid the cache-poisoning vector

      - name: Build sdist + wheel
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: uv build

      - name: Sign artifacts with Sigstore
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      # SLSA build provenance (OSSF Scorecard Signed-Releases: the provenance half,
      # i.e. the jump from 8/10 to 10/10). Generates a signed in-toto provenance
      # statement covering BOTH dists and records it on GitHub's attestation API;
      # ``bundle-path`` is the local bundle we also attach to the draft as a
      # ``*.intoto.jsonl`` Release asset (the publish step below), since Scorecard
      # scans Release ASSETS, not the attestation API.
      #
      # Why this step (actions/attest-build-provenance) and NOT the slsa-github-
      # generator reusable workflow: the generator is a job-level ``uses:`` that
      # attaches provenance to the release by TAG, after publish — but our flow
      # creates the release as a DRAFT (config draft:true), attaches signed assets
      # while it is still tag-less, then publishes (which locks it immutable, #98).
      # A draft has no tag for the generator to target, and immutable releases
      # forbid adding assets after publish — so provenance MUST be attached to the
      # draft in THIS job, which only a step-level action can do. The output bundle
      # is a Sigstore-wrapped in-toto statement; named ``*.intoto.jsonl`` it
      # satisfies Scorecard's provenance heuristic (confirm on the next release
      # re-scan — Scorecard re-scores Signed-Releases on a push to main).
      - name: Generate SLSA build provenance for the dists
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl"

      - name: Attach signed assets to the draft, then publish
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # release-please (v5) exposes NO numeric `id` output — its documented
          # release outputs are upload_url / html_url / tag_name / version / sha
          # / body (see the action README). The draft's numeric release id is
          # embedded in upload_url (.../releases/{id}/assets{?name,label}), so
          # derive it from there rather than from a non-existent `id` output.
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          REPO: ${{ github.repository }}
          # The SLSA provenance bundle written by attest-build-provenance; attached
          # below (renamed *.intoto.jsonl) so Scorecard's Signed-Releases provenance
          # probe credits it. Empty if the provenance step was skipped/failed.
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Pull the numeric {id} out of the upload_url template, then insist it
          # is all digits — a non-match would otherwise pass through verbatim and
          # slip past an emptiness check.
          RELEASE_ID="$(printf '%s' "${UPLOAD_URL}" \
            | sed -E 's#.*/releases/([0-9]+)/assets.*#\1#')"
          if ! printf '%s' "${RELEASE_ID}" | grep -qE '^[0-9]+$'; then
            echo "could not derive numeric release id from upload_url='${UPLOAD_URL}'; aborting" >&2
            exit 1
          fi
          # A draft has no git tag, so by-tag lookups 404 — upload by release ID via
          # the uploads host. Sigstore (v3) writes .sigstore.json bundles next to
          # each input; glob both bundle spellings defensively.
          shopt -s nullglob
          dists=(dist/*.tar.gz dist/*.whl)
          sigs=(dist/*.sigstore dist/*.sigstore.json)
          assets=("${dists[@]}" "${sigs[@]}")
          if [ ${#dists[@]} -eq 0 ]; then
            echo "no sdist/wheel to upload; aborting" >&2
            exit 1
          fi
          # Refuse to publish UNSIGNED artifacts: the whole point is signed Release
          # assets (Scorecard). Sigstore v3 exits non-zero on a signing failure so
          # this shouldn't trigger, but if a future glob/format change matched no
          # bundle we'd otherwise upload dists with no signature — abort instead.
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "no .sigstore bundles produced; refusing to publish unsigned artifacts" >&2
            exit 1
          fi
          # SLSA provenance: attest-build-provenance wrote one in-toto bundle for
          # both dists. Attach it as multiple.intoto.jsonl (the slsa-github-generator
          # filename Scorecard's provenance heuristic recognizes). Refuse to publish
          # without it — the whole point of this change is the provenance asset.
          if [ -z "${PROVENANCE_BUNDLE:-}" ] || [ ! -s "${PROVENANCE_BUNDLE}" ]; then
            echo "no SLSA provenance bundle produced; refusing to publish without provenance" >&2
            exit 1
          fi
          provenance="dist/multiple.intoto.jsonl"
          cp "${PROVENANCE_BUNDLE}" "${provenance}"
          assets+=("${provenance}")
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            # Idempotent re-runs: a same-named asset left by an earlier attempt
            # makes the POST 422 (already_exists), which under `set -e` would
            # abort before publish and strand the draft. Delete any existing
            # same-named asset first, then upload fresh. NAME via env (not
            # inlined into --jq) so a basename can't break out of the filter.
            existing_id="$(NAME="$name" gh api \
              "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate \
              --jq '.[] | select(.name == env.NAME) | .id' | head -n1)"
            if [ -n "$existing_id" ]; then
              echo "replacing existing asset ${name} (id ${existing_id})"
              gh api --method DELETE \
                "repos/${REPO}/releases/assets/${existing_id}"
            fi
            echo "uploading ${name}"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$f"
          done
          # Publish: creates the git tag (release locks immutable with the assets);
          # the app-token push is what triggers release.yml.
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false
          echo "published release ${RELEASE_ID} with ${#assets[@]} assets."

      # --- Open or update the next release PR (now the tag exists) ------------
      # The deferred half of release-please: open/update the PR that proposes the
      # NEXT release. skip-github-release means it never touches the release — it
      # only manages the `release-please--*` PR. By now the publish step (if this
      # push was a release) has created the git tag, so release-please sees the
      # real latest version: 0 unreleased commits -> it opens nothing; new commits
      # -> a correct PR based off the true latest tag. On an ordinary feature push
      # (no release this run) this is the step that keeps the pending release PR
      # current. Default `if: success()`, so a failed/half publish above leaves the
      # draft for hand-recovery instead of opening a PR against stale state.
      - name: Open the next release PR (no release)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # --- Keep uv.lock's editable self-version in sync with the release bump ---
      # release-please bumps pyproject.toml's version but NOT uv.lock, so the lock's
      # `[[package]] name = "clauster"` version drifts behind each release — a
      # papercut where every local `uv` run then regenerates uv.lock into a stray
      # diff. When a release PR is open (just created/updated by the step above),
      # regenerate uv.lock on that PR branch so the lock bumps together with
      # pyproject and lands in the same merge. A no-op on every other push (and when
      # the lock is already in sync). It pushes only to the bot's own
      # `release-please--*` branch, never to main.
      - name: Detect open release PR
        id: relpr
        env:
          GH_TOKEN: ${{ github.token }} # read-only default token is enough for `pr list`
        run: |
          set -euo pipefail
          # Pick the release PR by *authenticated identity*, not just the branch
          # name: it must be authored by the release App, target main, and be an
          # in-repo (non-fork) branch. The branch-name prefix alone would let any
          # collaborator open a `release-please--*` PR and have us check it out +
          # run `uv lock` (which can execute the project's build backend) in this
          # trusted push context with the app token in scope. gh renders an App
          # author as `app/<slug>`.
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json headRefName,baseRefName,author,isCrossRepository \
            --jq '[.[]
                   | select(.headRefName | startswith("release-please--"))
                   | select(.baseRefName == "main")
                   | select(.isCrossRepository == false)
                   | select(.author.login == "app/clauster-release-bot")
                  ][0].headRefName // ""')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$branch" ]; then echo "Release PR branch: $branch"; else echo "No open release PR."; fi

      - name: Check out repo
        if: ${{ steps.relpr.outputs.branch != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        if: ${{ steps.relpr.outputs.branch != '' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # No cache: this job can push, and setup-uv's default caching is a
          # cache-poisoning vector (zizmor). A one-off `uv lock` doesn't need it.
          enable-cache: false

      - name: Sync uv.lock on the release PR
        if: ${{ steps.relpr.outputs.branch != '' }}
        env:
          # App token (contents: write) so the push is authorized AND keeps the
          # release PR bot-authored. Branch via env (not inlined) — no injection.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ steps.relpr.outputs.branch }}
        run: |
          set -euo pipefail
          # Defensive: only ever touch the bot's release branch, never anything else.
          case "$PR_BRANCH" in
            release-please--*) ;;
            *) echo "refusing to push to unexpected branch '$PR_BRANCH'"; exit 1 ;;
          esac
          git fetch --quiet origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync — nothing to commit."
            exit 0
          fi
          # Attribute the commit to the release bot (fall back to the Actions bot).
          bot_user="clauster-release-bot[bot]"
          if ! bot_id="$(gh api "/users/${bot_user}" --jq '.id' 2>&1)" || [ -z "$bot_id" ]; then
            echo "::notice::could not resolve ${bot_user} id (${bot_id:-empty}); using github-actions[bot]"
            bot_user="github-actions[bot]"; bot_id="41898282"
          fi
          git config user.name "$bot_user"
          git config user.email "${bot_id}+${bot_user}@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock to the release version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_BRANCH}"
          echo "Pushed uv.lock sync to $PR_BRANCH."
