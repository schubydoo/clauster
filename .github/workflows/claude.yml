name: Claude Code

# Interactive "@claude" assistant — runs on HER subscription token.
#
# SECURITY (critical): issue_comment / issues / pull_request_review events run in
# the BASE repo context WITH secrets and can be triggered by ANYONE who can comment
# — the repo's "require approval for external contributors" Actions policy does NOT
# cover these (it only gates pull_request-triggered runs). So every branch below is
# gated on the *author's* association: only OWNER / MEMBER / COLLABORATOR can invoke
# it. A non-collaborator's "@claude" is ignored — no run, no token spend, and no
# attacker-supplied instructions reach the agent.
#
# Default posture is advisory (contents: read) — Claude can read + comment but not
# push. Bump `contents: write` only if you want "@claude fix it" to commit.
# The action is SHA-pinned (zizmor) and the job is concurrency- and time-bounded.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write # post replies / review comments
  issues: write # reply on issues
  id-token: write
  actions: read # read CI results on PRs

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@64de744025ca9e24df2b88204b4f1e968f39f009 # v1.0.139
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Stop Claude writing "#1"/"#2" to enumerate points — GitHub auto-links
          # a hash+number into a link to an unrelated issue/PR.
          claude_args: |
            --append-system-prompt "When listing or referring to findings or numbered points, do not write them as #1, #2, etc. GitHub turns a hash followed by digits into a link to an unrelated issue or PR. Use Finding 1, (1), or a short description instead."
