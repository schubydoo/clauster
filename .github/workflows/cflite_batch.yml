# ClusterFuzzLite — scheduled BATCH fuzzing (the deep counterpart to cflite_pr.yml).
# PR fuzzing (cflite_pr.yml) only exercises code touched by a diff (`mode:
# code-change`); this runs EVERY harness in fuzz/ on a schedule, so unchanged
# code is re-fuzzed regularly and each target gets a longer run than the per-PR
# pass. A reproducible crash surfaces here and as SARIF in the Security tab. NOT
# a required check — it signals, it never gates.
#
# Corpus persistence: this run clones the corpus from a private `storage-repo`
# (schubydoo/clauster-fuzz-corpus, auth via the FUZZ_STORAGE_TOKEN PAT), fuzzes,
# and pushes the grown corpus back — so coverage *compounds* across runs and
# reaches the deeper bugs a from-seed run never finds. The write PAT lives ONLY
# here (cron + workflow_dispatch, no fork exposure); cflite_pr.yml deliberately
# does NOT carry it (a fork PR with a write secret is an exfil surface). If the
# PAT is ever rotated/expired, this job keeps passing but silently stops
# accumulating. See https://google.github.io/clusterfuzzlite/.
#
# Cost knobs (see the CI-cost-audit TODO): the `cron` cadence and `fuzz-seconds`.
# NB `fuzz-seconds` is the TOTAL budget for the whole run, not a per-target one:
# CFLite divides it across the harnesses (`fuzz_seconds // fuzzers_left_to_run`
# in oss-fuzz's infra/cifuzz/run_fuzzers.py). So wall-clock ≈ fuzz-seconds + build
# and stays flat as harnesses are added — what shrinks is the time EACH harness
# gets. Adding harnesses is therefore a coverage-dilution decision, not a
# timeout one; raise `fuzz-seconds` (and re-check `timeout-minutes`) if the
# per-harness slice gets too thin.
name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "27 4 */2 * *" # odd calendar days (1,3,5…31), 04:27 UTC (corpus changes slowly — ~halves fuzz spend vs daily; batch depth + OSSF Fuzzing signal preserved)
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzzing:
    name: batch fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 55 # ≈ fuzz-seconds + build; generous headroom (observed ≈12 min)
    permissions:
      contents: read # checkout + build the harnesses
      security-events: write # upload crash SARIF to the Security tab
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300 # TOTAL for the run, split across the harnesses (see the header)
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          # Corpus persistence — accumulates the coverage corpus across runs so
          # fuzzing compounds toward deeper bugs (see the header note).
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main
