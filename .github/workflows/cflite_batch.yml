# ClusterFuzzLite — scheduled BATCH fuzzing (the deep counterpart to cflite_pr.yml).
# PR fuzzing (cflite_pr.yml) only exercises code touched by a diff (`mode:
# code-change`); this runs EVERY harness in fuzz/ on a schedule, so unchanged
# code is re-fuzzed regularly and each target gets a longer run than the per-PR
# pass. A reproducible crash surfaces here and as SARIF in the Security tab. NOT
# a required check — it signals, it never gates.
#
# Corpus persistence: this run clones the corpus from a private `storage-repo`
# (schubydoo/clauster-fuzz-corpus, auth via the FUZZ_STORAGE_TOKEN PAT), fuzzes,
# and pushes the grown corpus back — so coverage *compounds* across runs and
# reaches the deeper bugs a from-seed run never finds. The write PAT is an environment
# secret (`fuzz-corpus`, `main`-only branch policy that GitHub enforces server-side — see
# the job `if:` below), reachable only from these main-branch jobs (cron + a main-gated
# workflow_dispatch, no fork exposure). cflite_pr.yml never carries this WRITE PAT
# (a fork PR with a write secret is an exfil surface); for its per-PR code-change run it
# instead mints a separate READ-ONLY clauster-ci App token, scoped to the corpus repo and
# fork-gated, to LOAD the corpus (issue 1497 — read-only, it can never push). If the
# PAT is ever rotated/expired, this job keeps passing but silently stops
# accumulating. See https://google.github.io/clusterfuzzlite/.
#
# Cost knobs (see the CI-cost-audit TODO): the `cron` cadence and `fuzz-seconds`.
# NB `fuzz-seconds` is the TOTAL budget for the whole run, not a per-target one:
# CFLite divides it across the harnesses (`fuzz_seconds // fuzzers_left_to_run`
# in oss-fuzz's infra/cifuzz/run_fuzzers.py). So the FUZZ BUDGET stays flat as
# harnesses are added — what shrinks is the slice EACH harness gets. Per-target
# OVERHEAD does still scale (an Atheris process start plus a corpus push per
# target), and it dominates here: ≈12 min observed against a 300s budget. Adding
# harnesses is therefore a coverage-dilution decision, not a timeout one: raise
# `fuzz-seconds` in step with the harness count to hold the per-harness slice, and
# re-check `timeout-minutes`. At 666s / 18 harnesses that slice is ~37s.
name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    # odd calendar days (1,3,5…31), 04:27 UTC (corpus changes slowly — ~halves fuzz
    # spend vs daily; batch depth + OSSF Fuzzing signal preserved)
    - cron: "27 4 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzzing:
    name: batch fuzzing
    # FUZZ_STORAGE_TOKEN is an environment secret in `fuzz-corpus`, whose deployment-branch
    # policy limits it to `main`. GitHub checks the run's ref against that policy BEFORE the
    # job starts and it is not overridable by the workflow file, so a dispatch from an
    # arbitrary ref can never reach the write PAT below. (A job-level `if:` alone cannot
    # deliver this: a workflow_dispatch runs the SELECTED ref's own copy of this file, so a
    # branch that deleted the `if:` would bypass it — the environment is checked server-side.)
    # The `if:` stays as cheap belt-and-braces: it skips an accidental dispatch from a
    # non-default ref before a runner even spins up.
    environment: fuzz-corpus
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ≈ fuzz-seconds + build. The ≈12 min was observed at 8 harnesses / 300s; at 18 the
    # build step dominates (~41s each) and the run projects to ≈25 min — still 2x headroom.
    timeout-minutes: 55
    permissions:
      contents: read # checkout + build the harnesses
      security-events: write # upload crash SARIF to the Security tab
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          # Needed on the RUN step as well as the build — it defaults to `c++`, which
          # cuts crash reproduction from 120s to 30s and drops slow-to-re-trigger
          # Atheris crashes as "unreproducible". See cflite_pr.yml for the detail.
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # TOTAL for the run, split across the harnesses (see the header). 666 not 413
          # because this branch took the harness count 11 -> 18: the loop floors, and
          # 666//18 == 413//11 == 375//10 == 300//8 == 37s each, so the seven new
          # harnesses cost the existing eleven nothing. The extra 253s is ~4 min against
          # `timeout-minutes: 55` and a ≈12 min observed run — note the per-harness cost
          # that actually scales is PyInstaller in the BUILD step (~41s each), which
          # `fuzz-seconds` does not govern; at 18 harnesses expect ≈25 min end to end.
          fuzz-seconds: 666
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          # Corpus persistence — accumulates the coverage corpus across runs so
          # fuzzing compounds toward deeper bugs (see the header note).
          storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/schubydoo/clauster-fuzz-corpus.git
          storage-repo-branch: main
