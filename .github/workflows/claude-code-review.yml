name: Claude Code Review

# Optional second-opinion reviewer (alongside CodeRabbit) — NOT a required check.
# Runs Claude on HER own subscription token, so triggering is locked down:
#   * author-association gate -> only the owner / members / collaborators can run it;
#     a fork or drive-by external PR is skipped (no run, no token spend). This also
#     skips bot PRs (release-please / renovate) automatically — they're not
#     OWNER/MEMBER/COLLABORATOR.
#   * same-repo head only (`fork == false`) — a fork PR wouldn't get the secret anyway.
#   * the repo's Actions "require approval for all external contributors" policy is the
#     backstop for the pull_request trigger; this `if:` makes the skip automatic.
# All actions are SHA-pinned (zizmor) and the job is concurrency- and time-bounded.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write # post the review
  id-token: write # claude-code-action mints an OIDC token for auth — required

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@70a6e5256e9e2366a1ed5c041904a982ba3a328f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Native auto-review — NOT the `/code-review` plugin, which posts a fresh
          # full comment on every run (it ignores the sticky mechanism). With
          # track_progress the summary lives in ONE comment that updates in place on
          # each push, so re-runs don't repeat the whole review. Specific issues go
          # as inline comments. This is the action's documented auto-review pattern.
          track_progress: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The PR branch is checked out; use `gh pr diff` and `gh pr view` to see the change and its discussion.

            Be a careful reviewer, not a nitpicker — flag only real, actionable issues:
            - Correctness bugs, edge cases, and logic errors
            - Security: injection, auth/authorization, SSRF, path traversal, secret/credential exposure, and SILENT FAILURES (swallowed exceptions, bare `except`, fallbacks that hide errors)
            - Error handling and resource cleanup
            - Test coverage for new or changed logic (are the important paths and edge cases tested?)
            - Consistency with the patterns already used in the surrounding code
            - Performance problems that actually matter

            Repo context (a Python/FastAPI + Alpine.js app that spawns `claude remote-control` bridges):
            - Jinja2 autoescaping is on, so most "template XSS" concerns are false positives.
            - Style, formatting, and typing are enforced by ruff + pyright in CI — do NOT comment on those.
            - Skip trivia; only raise what's worth a maintainer's attention. If nothing is significant, say so plainly.

            Post specific issues as inline comments on the relevant lines. Give your overall verdict as your final summary — do not open a separate top-level comment (it lands in the tracking comment).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "When listing or referring to findings or numbered points, do not write them as #1, #2, etc. GitHub turns a hash followed by digits into a link to an unrelated issue or PR. Use Finding 1, (1), or a short description instead."
