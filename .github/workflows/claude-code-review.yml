name: Claude Code Review

# Optional second-opinion reviewer (alongside CodeRabbit) — NOT a required check.
# Runs Claude on HER own subscription token, so triggering is locked down:
#   * author-association gate -> only the owner / members / collaborators can run it;
#     a fork or drive-by external PR is skipped (no run, no token spend). This also
#     skips bot PRs (release-please / renovate) automatically — they're not
#     OWNER/MEMBER/COLLABORATOR.
#   * same-repo head only (`fork == false`) — a fork PR wouldn't get the secret anyway.
#   * the repo's Actions "require approval for all external contributors" policy is the
#     backstop for the pull_request trigger; this `if:` makes the skip automatic.
# All actions are SHA-pinned (zizmor) and the job is concurrency- and time-bounded.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write # post the review

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@70a6e5256e9e2366a1ed5c041904a982ba3a328f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
