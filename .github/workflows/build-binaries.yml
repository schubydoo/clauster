name: Build binaries

# Build the standalone one-file `clauster` binary on each target OS and smoke-test it
# (boot + /healthz — the real PyInstaller one-file failure mode, which `--version` alone
# misses). NON-REQUIRED signal job (like fuzzing / e2e): it proves the frozen build stays
# runnable and uploads downloadable artifacts; it is NOT wired into a release here. The
# `workflow_call` trigger lets the release pipeline reuse this exact matrix later
# (attach + sign + publish on the draft) — see scratch/binary-release-plan.md (PR2b).
on:
  workflow_call:
  workflow_dispatch:
  # Nightly on the default branch: catch a src/dep change that silently breaks the
  # frozen build without waiting for the next release.
  schedule:
    - cron: "37 5 * * *"
  # Per-PR only when something that affects the bundle changes (the spec, the build/
  # smoke scripts, this workflow, or the dependency set) — keeps the 5-target build off
  # the critical path for ordinary code PRs.
  pull_request:
    # ready_for_review fires the build on the draft→ready flip; keep opened/
    # synchronize/reopened so normal PRs + fixup pushes keep building — setting
    # any types: replaces the implicit defaults (#623).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clauster.spec
      - pyinstaller_entry.py
      - scripts/smoke_binary.py
      - .github/workflows/build-binaries.yml
      - pyproject.toml
      - uv.lock

# Read-only token; no secrets used, so a fork PR runs it safely.
permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    # Draft PRs skip the 5-target build; ready_for_review re-fires it (#623).
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: clauster
          # GitHub-hosted arm64 Linux runner (free for public repos). Native build —
          # PyInstaller cannot cross-compile, so each arch needs its own runner.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: clauster
          - os: macos-latest
            target: macos-arm64
            artifact: clauster
          # macos-13 (the old free Intel runner) was retired; macos-15-intel is the
          # current free-for-OSS x86_64 macOS runner. Intel macOS is winding down
          # (x64 runners retire ~2027), so macos-arm64 stays the durable mac target.
          - os: macos-15-intel
            target: macos-x86_64
            artifact: clauster
          - os: windows-latest
            target: windows-x86_64
            artifact: clauster.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5" # pinned uv (Renovate-tracked); skip the flaky "latest" fetch
          enable-cache: true
      - name: Set up Python + build env
        run: |
          uv python install 3.13
          uv sync --extra package --python 3.13
      # --no-sync: the sync above already installed the `package` extra for the
      # pinned 3.13; don't let a `.python-version` drift rebuild the venv without it.
      - name: Build one-file binary
        run: uv run --no-sync pyinstaller clauster.spec
      - name: Smoke test (boot + /healthz)
        run: uv run --no-sync python scripts/smoke_binary.py "dist/${{ matrix.artifact }}"
      # Rename to a per-target asset name and emit a sha256, mirroring how the signed
      # release assets will be named (PR2b). bash on all runners (git-bash on
      # Windows) keeps this single-shell.
      - name: Stage + checksum
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$("dist/$ARTIFACT" --version | awk '{print $NF}')"
          # Enforce a semver-ish prefix (matches 0.9.0 and dev builds like 0.10.0.dev7),
          # so an unexpected --version banner can't yield a wrongly-named asset — which
          # PR2b's release tooling reuses this step to produce.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "unexpected --version output; parsed version='$version'" >&2
            exit 1
          fi
          ext=""
          case "$ARTIFACT" in *.exe) ext=".exe" ;; esac
          name="clauster-${version}-${TARGET}${ext}"
          mkdir -p out
          cp "dist/$ARTIFACT" "out/$name"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd out && sha256sum "$name" > "$name.sha256" )
          else
            ( cd out && shasum -a 256 "$name" > "$name.sha256" )
          fi
          echo "staged out/$name (+ .sha256)"
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clauster-binary-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
