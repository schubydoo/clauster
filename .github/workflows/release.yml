name: "Release: distribute (PyPI + GHCR)"

# Fires when knope publishes a release tag (e.g. `v0.2.0`). knope itself creates
# the GitHub Release + signed assets (the CHANGELOG was written earlier by the
# prepare-release PR); this workflow's job is to publish the distribution.
# clauster ships to PyPI today; a multi-arch GHCR image can be added here once a
# Dockerfile lands (see the commented stub at the bottom).

on:
  push:
    tags:
      - "v*"
  # Manual fallback to (re)publish an existing tag — e.g. to recover a release
  # whose tag was pushed by GITHUB_TOKEN and therefore didn't trigger the
  # push-tags run. Dispatch from the default branch and pass the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must NOT be cancelled mid-flight.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: a build may ship to PyPI + GHCR :latest ONLY if it is a vN.N.N release
  # tag whose commit is on origin/main. Without this, a workflow_dispatch with a
  # free-form `tag` (a branch name or arbitrary ref) would build and publish that
  # ref as a real release (#400). Siblings gate likewise: nightly.yml refuses a
  # non-main ref; packaging-bump.yml validates the ^vN.N.N$ shape.
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # The publish jobs check out THIS SHA (not the tag name), so they build
      # exactly the commit validated here — no tag-repoint TOCTOU window.
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the on-main ancestry check is reliable
      - name: Require a vN.N.N tag whose commit is on origin/main
        id: resolve
        env:
          # Indirect through env to keep the ref out of the shell line (zizmor).
          RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RESOLVED_TAG"
          # Strip CR/LF: $tag (user-controlled inputs.tag) is echoed into the
          # ::error:: annotations below, where a stray newline could smuggle a
          # second runner workflow-command into the log.
          tag="${tag//[$'\r\n']/}"
          # 1) Shape — only stable vMAJOR.MINOR.PATCH tags publish.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish '$tag': not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          # 2) The tag must exist on origin and resolve to a commit. --force because
          #    fetch-depth:0 already fetched the tag at clone time; without it git
          #    refuses to re-fetch ("would clobber"), and we want origin's canonical tag.
          if ! git fetch --no-tags --force origin "refs/tags/${tag}:refs/tags/${tag}"; then
            echo "::error::Refusing to publish '$tag': no such tag on origin."
            exit 1
          fi
          # `^{commit}` peels an annotated tag to its commit object; without it
          # rev-parse returns the tag object's SHA and the ancestry check below
          # would compare the wrong object type.
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          # 3) That commit must be reachable from origin/main — this is what blocks
          #    a tag (or dispatch input) pointing at an unreviewed, off-main ref.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::Refusing to publish '$tag': commit $tag_commit is not on origin/main."
            exit 1
          fi
          echo "Validated '$tag' ($tag_commit): a vN.N.N tag on origin/main."
          echo "sha=$tag_commit" >> "$GITHUB_OUTPUT"

  pypi:
    name: PyPI publish (Trusted Publishing)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/clauster
    permissions:
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing — no API token stored
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }} # the exact commit validate froze
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29" # pinned uv (Renovate-tracked); skip the flaky "latest" fetch
          # Caching is intentionally OFF in the publish job (zizmor
          # cache-poisoning): a cache restored from a lower-privilege context
          # could taint the artifact this OIDC-signed step ships to PyPI. A
          # once-per-release build gains little from a warm cache anyway.
          enable-cache: false
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Build sdist + wheel
        run: uv build
      # Trusted Publishing: configure the publisher on PyPI FIRST
      # (pypi.org -> the clauster project -> Settings -> Publishing):
      #   owner=schubydoo, repo=clauster, workflow=release.yml, environment=pypi
      # Until that's set up, this step 403s — there is no token to add.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/

  docker:
    name: GHCR image (multi-arch)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deployment environment for the GHCR push — gives an audit trail of every
    # image publish and a place to attach protection (deployment ref policy,
    # optional required reviewer). The nightly `:edge` push uses the same `ghcr`
    # environment; its ref policy allows `main` (edge) + `v*` tags (releases).
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (OIDC)
      attestations: write # build provenance / SBOM attestations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }} # the exact commit validate froze
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag is refs/tags/vX.Y.Z on a push; semver patterns strip the leading v.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain provenance + SBOM attestations pushed with the image.
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, by digest)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done <<< "$TAGS"
