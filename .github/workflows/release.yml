name: Release

# Fires when Release Please pushes a tag (e.g. `v0.2.0`). Release Please itself
# creates the GitHub Release + CHANGELOG; this workflow's job is to publish the
# distribution. clauster ships to PyPI today; a multi-arch GHCR image can be
# added here once a Dockerfile lands (see the commented stub at the bottom).

on:
  push:
    tags:
      - "v*"
  # Manual fallback to (re)publish an existing tag — e.g. to recover a release
  # whose tag was pushed by GITHUB_TOKEN and therefore didn't trigger the
  # push-tags run. Dispatch from the default branch and pass the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must NOT be cancelled mid-flight.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    name: PyPI publish (Trusted Publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/clauster
    permissions:
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing — no API token stored
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Caching is intentionally OFF in the publish job (zizmor
          # cache-poisoning): a cache restored from a lower-privilege context
          # could taint the artifact this OIDC-signed step ships to PyPI. A
          # once-per-release build gains little from a warm cache anyway.
          enable-cache: false
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Build sdist + wheel
        run: uv build
      # Trusted Publishing: configure the publisher on PyPI FIRST
      # (pypi.org -> the clauster project -> Settings -> Publishing):
      #   owner=schubydoo, repo=clauster, workflow=release.yml, environment=pypi
      # Until that's set up, this step 403s — there is no token to add.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/

  docker:
    name: GHCR image (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deployment environment for the GHCR push — gives an audit trail of every
    # image publish and a place to attach protection (deployment ref policy,
    # optional required reviewer). The nightly `:edge` push uses the same `ghcr`
    # environment; its ref policy allows `main` (edge) + `v*` tags (releases).
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (OIDC)
      attestations: write # build provenance / SBOM attestations
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag is refs/tags/vX.Y.Z on a push; semver patterns strip the leading v.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain provenance + SBOM attestations pushed with the image.
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, by digest)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done <<< "$TAGS"
