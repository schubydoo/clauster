name: Security

# Consolidates the project's security scanners into one file so the security
# posture is grokkable at a glance. Each scanner is its own JOB (not a step) so
# they run in parallel and appear individually in the PR checks list and in the
# code-scanning Security tab.

on:
  push:
    branches: [main]
  pull_request:
    # Defaults (opened, synchronize, reopened) PLUS `ready_for_review`: this
    # workflow backs the required `security required checks passed` context, and
    # flipping a PR draft → ready is the issue #509 recovery path that re-dispatches
    # it on the current head SHA without a push.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff so the heavy analysers skip a docs-only change. The
  # `security required checks passed` aggregator still runs (it counts a skipped
  # job as passing), so the required context keeps reporting on docs-only PRs —
  # which is why these can't use a top-level `paths-ignore` (that would make the
  # required check never report and the PR hang "Expected — waiting").
  #
  # DRAFT PRs: every SARIF-uploading / expensive job below (codeql, zizmor,
  # dependency-review, and the `changes` classifier they gate on) carries
  # `github.event.pull_request.draft != true`, so a draft PR uploads no CodeQL or
  # zizmor SARIF and runs no dependency review — the shared GITHUB_TOKEN pool those
  # uploads draw on is what the skip protects. The ONE deliberate exception is
  # `gitleaks` (secret scan): it runs on drafts because it uploads NO SARIF and
  # mints its own App token, so a draft still gets a real secret scan (see its own
  # note). (`trivy-image` is not in the guarded set either: it is already
  # `github.event_name != 'pull_request'`, so a draft term there would be
  # unreachable.)
  # `!= true` (not `== false`) so push:main / the weekly cron — where `draft` is
  # null — fail-safe to running. `ready_for_review` is in the trigger types, so
  # flipping a draft ready re-dispatches the whole workflow on the current head
  # SHA. A job skipped by its `if:` reports a check run whose conclusion is
  # SUCCESS, so `security required checks passed` resolves on a draft rather than
  # hanging (the "Expected — waiting" failure mode comes from a workflow-level
  # `paths:` filter suppressing the check run, not from a job-level `if:`).
  changes:
    name: classify changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        uses: $/.github/actions/changed-code

  codeql:
    # codeql-fork-upload.yml matches this job by name PREFIX ("codeql analyze") to read
    # its conclusion; a rename there fails that consumer closed (loud), not silently.
    name: codeql analyze
    # ALWAYS run — never gate on the docs-only classifier. The `main` ruleset has
    # a `code_scanning` rule requiring the CodeQL tool to have results; GitHub's
    # merge protection treats a required tool that produced no results (a skipped
    # job) as unsatisfied, so a docs-only PR would sit at mergeStateStatus=BLOCKED
    # forever even with every required status check green. Re-analysing unchanged
    # code costs a little CI time, but minutes are free on this public repo and
    # this keeps the required code-scanning tool satisfiable on every PR.
    #
    # NB: this is the `pull_request` (merge-commit) analysis. A PARALLEL head-SHA
    # analysis runs in codeql.yml on `push` to cure the "stuck PR" class — a base
    # move recomputes `refs/pull/N/merge` but fires no `pull_request` event, so
    # this merge-ref result goes stale and the PR sticks at BLOCKED. The two are
    # intentional and NOT duplicates: they carry different refs (refs/pull/N/merge
    # here vs refs/heads/<branch> there). Do NOT skip this on `synchronize` as
    # "already covered by codeql.yml" without accepting the loss of the
    # merge-commit PR-diff annotations (the more accurate of the two).
    #
    # The one exception to "ALWAYS run" is a DRAFT PR, and it is safe precisely
    # BECAUSE of that parallel workflow: codeql.yml still analyses every push to
    # the branch's head SHA, and the `code_scanning` rule honours a head-SHA
    # analysis, so a draft is never left without results. Skipping the merge-ref
    # analysis while drafting halves the CodeQL SARIF uploads a draft generates —
    # the shared GITHUB_TOKEN pool those uploads draw on is the reason this guard
    # exists. `ready_for_review` restores the merge-ref analysis before review.
    #
    # ⚠️ One coverage window this opens, stated rather than buried: a FORK's draft
    # PR now gets NO CodeQL at all. codeql.yml's `on: push` fires in the fork's own
    # repository, never here (see its header), so the head-SHA analysis that covers
    # in-repo drafts cannot reach a fork — and this merge-ref job was the only thing
    # that did. It returns on `ready_for_review`, and a draft cannot merge, so this
    # is a deferral rather than a hole in the merge gate.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `analyze` runs with `upload: never` and a minted App token does the upload,
      # so the job token no longer needs `security-events: write`.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint an upload-only App token (`security-events: write`) BEFORE the analysis, so
      # the token exists regardless of the analysis outcome and the `always()` upload
      # below can post off the App's own rate bucket (#1445). Same-repo only; a fork PR
      # skips both the mint and the upload.
      - name: Mint SARIF upload token
        id: sarif-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          # `analyze` resolves an "analysis key" through the Actions API even with
          # `upload: never`, so the mint needs `actions: read` (and `contents: read` for
          # the bundle and repo reads), and CodeQL's own `token` is routed at this App
          # token below. Otherwise that lookup stays on GITHUB_TOKEN and throws under pool
          # exhaustion after the SARIF is already written.
          permission-actions: read
          permission-contents: read
          permission-security-events: write
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Route every CodeQL API call (bundle lookup, feature flags, analysis key,
          # status reports) at the App token, off the shared GITHUB_TOKEN pool. This is
          # NOT the SARIF upload route: `upload: never` means the action never posts, and
          # that route rejects App tokens (PR 1435). The internal endpoints degrade to
          # warnings with a non-Actions token (status-report.ts and feature-flags.ts map
          # 403/404 to `core.warning`).
          token: ${{ steps.sarif-token.outputs.token || github.token }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # `upload: never` + `output`: write the SARIF to disk instead of uploading via
          # the action (GITHUB_TOKEN-only; codeql-action#2719). The step below posts it
          # to the public endpoint with the minted App token. `token` routes analyze's own
          # API calls (the analysis-key lookup that runs even under `upload: never`, plus
          # status reports) at the App token, off the shared pool.
          upload: never
          output: codeql-sarif
          # Upload the POST-PROCESSED SARIF (fingerprints added), which the action writes
          # as `upload.sarif` in this dir; `SARIF_DIR` points here. The `*.sarif` glob
          # matches it, and the jq below still forces the category.
          post-processed-sarif-path: codeql-sarif-processed
          token: ${{ steps.sarif-token.outputs.token || github.token }}
      - name: Upload CodeQL SARIF
        # Post each analysis to the public `code-scanning/sarifs` endpoint with the
        # minted App token, off the shared GITHUB_TOKEN pool (see the trivy/zizmor jobs).
        # Every dynamic value comes through `env:`. Same-repo only: a fork PR cannot
        # write code scanning results, so skip (`always()` counts the skip as passing).
        if: >-
          ${{ always()
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.sarif-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          CHECKOUT_URI: file://${{ github.workspace }}
          # Trailing slash is load-bearing: GitHub parses `automationDetails.id` as
          # `category/run-id`, so `/language:python` with no slash records an EMPTY
          # category. `/language:python/` gives the category with an empty run-id.
          CATEGORY: "/language:${{ matrix.language }}/"
          SARIF_DIR: codeql-sarif-processed
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in "$SARIF_DIR"/*.sarif; do
            found=1
            # `automationDetails.id` = the analysis category, so a re-upload supersedes
            # the prior series for this language instead of duplicating it.
            sarif_b64="$(jq --arg cat "$CATEGORY" '.runs[].automationDetails.id = $cat' "$f" | gzip -c | base64 -w0)"
            sarif_id="$(gh api "repos/$REPO/code-scanning/sarifs" \
              -f "commit_sha=$COMMIT_SHA" \
              -f "ref=$REF" \
              -f "checkout_uri=$CHECKOUT_URI" \
              -f "tool_name=CodeQL" \
              -f "sarif=$sarif_b64" \
              --jq .id)"
            echo "Uploaded $f (id=$sarif_id); waiting for processing."
            last_err=""
            done_ok=""
            for _ in $(seq 1 30); do
              if ! status="$(gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" \
                --jq .processing_status 2>/tmp/gh_poll_err)"; then
                last_err="$(cat /tmp/gh_poll_err)"
                status="pending"
              fi
              echo "processing_status=$status"
              case "$status" in
                complete) done_ok=1; break ;;
                failed)
                  echo "CodeQL SARIF processing failed:" >&2
                  gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" --jq '.errors[]?' >&2
                  exit 1 ;;
              esac
              sleep 5
            done
            if [ -z "$done_ok" ]; then
              echo "::warning title=CodeQL SARIF::$f still '$status' after the bounded wait;" \
                "not failing the gate. last GET error: ${last_err:-none}"
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::warning title=CodeQL SARIF::no SARIF in $SARIF_DIR; nothing uploaded."
          fi
      - name: Save fork CodeQL SARIF artifact
        # FORK PR ONLY. The same-repo upload above is skipped for a fork (a fork's
        # job token cannot write code scanning results), so publish the
        # post-processed SARIF as an artifact instead. codeql-fork-upload.yml — a
        # `workflow_run` workflow running in the BASE-repo context with the
        # clauster-ci App token — downloads it and binds it to the PR's stable HEAD
        # SHA via the public `code-scanning/sarifs` endpoint, so the `code_scanning`
        # merge rule stops re-sticking as `main` moves and churns `refs/pull/N/merge`
        # (#1498). This job runs on `refs/pull/N/merge` for a fork with a read-only
        # GITHUB_TOKEN and no App secrets, so it CANNOT upload here; the consumer
        # does. No PR metadata is written into the artifact: the consumer derives the
        # PR number from the trusted `workflow_run.head_sha`, never from this
        # (fork-influenced) artifact. Single-language (python) matrix, so the fixed
        # artifact name cannot collide; add `-${{ matrix.language }}` if it grows.
        if: >-
          ${{ always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository }}
        # Keep an artifact-service hiccup off the required `codeql` job result so a 5xx
        # cannot red the job directly. This is NOT a silent fail-open: a fork PR has NO
        # merge-ref analysis to fall back on. The `Upload CodeQL SARIF` step above is
        # same-repo only, `analyze` runs `upload: never`, and codeql.yml is `on: push`,
        # which a fork never fires here — so a broken upload leaves ZERO code-scanning
        # results and a BLOCKED PR. The consumer (codeql-fork-upload.yml) therefore reads
        # this job's conclusion and FAILS CLOSED when the artifact is absent yet codeql
        # analyze concluded success, surfacing the broken producer instead of hiding it
        # (AGENTS.md invariant 1). Dropping continue-on-error here would trade that split
        # for a required check that reds on a transient hiccup, so the split lives in the
        # consumer. This step only ADDS head-SHA coverage; it must not block.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-fork-sarif
          # EXACT FILE, not a `*.sarif` glob. `post-processed-sarif-path` is not cleared
          # before analysis and lives under the fork's checkout, so a fork PR could commit
          # `codeql-sarif-processed/zz.sarif` and ship a SECOND file the consumer would
          # then post (issue 1500). CodeQL always writes its post-processed output to the
          # fixed name `upload.sarif` (verified from a live run) AFTER checkout, overwriting
          # any committed file at that name, so pinning the path removes the ACCIDENTAL
          # multi-file path. It does not make the file trustworthy: a `pull_request` run
          # executes the fork's own workflow, so a fork that rewrites this workflow can still
          # control what `upload.sarif` holds — which is why the `code_scanning` gate is
          # ADVISORY for forks (see the codeql-fork-upload.yml header). The consumer
          # additionally refuses an artifact holding more than one SARIF (AGENTS.md invariant 3).
          path: codeql-sarif-processed/upload.sarif
          if-no-files-found: warn
          retention-days: 1

  gitleaks:
    name: secret scan
    # Runs on drafts too — deliberately, and it is the one security job worth every
    # draft push. It mints an App token (≥5,000/hr) and uploads NO SARIF, so it
    # costs nothing from the shared GITHUB_TOKEN pool the draft skip exists to
    # protect; catching a leaked credential on the FIRST draft push — before later
    # commits bury it — is worth far more than the cheap run. (What actually keeps a
    # leak out of `main` is that a draft cannot merge and `ready_for_review` re-fires
    # the required aggregate before review — NOT the push:main / weekly-cron scans,
    # which fire only after the merge commit exists and are post-hoc detection, a
    # rotation event rather than a prevented leak.)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Spelled out for parity with the other scanners (it would otherwise inherit
    # the workflow-level contents:read) — checkout + the App token's contents
    # read are all this job needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so the action's
      # GitHub API calls (e.g. the "Get user" license check) don't exhaust the
      # 1,000/hr github-actions[bot] pool under bursts. Same-repo runs only
      # (push/schedule, or a same-repo PR); fork PRs lack the App secrets, so the
      # step is skipped and the token falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  trivy-image:
    name: trivy image scan
    # Building the image just to scan it is the long pole of this workflow (a few
    # minutes — it builds no-cache; see the build step). Skip it on PRs (where it's
    # report-only anyway); run on the main push + the weekly cron, which still catch
    # image CVEs and a broken Dockerfile before any tagged release. The `security
    # required checks passed` aggregator treats a skipped job as passing (same as
    # the PR-only dependency-review on push), so the required check stays green on
    # PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The SARIF upload uses a minted App token, so the job token needs only
      # `contents: read` (checkout and the Trivy DB pull).
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint an upload-only App token (`security-events: write`) BEFORE the scan, so a
      # findings-nonzero Trivy step (exit-code 1) cannot skip a mint gated on the
      # implicit `success()` and leave the `always()` upload with no token (#1444). The
      # same-repo `if:` is for parity; this job never runs on a pull_request, so it is
      # always true here.
      - name: Mint SARIF upload token
        id: sarif-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-security-events: write
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Build the amd64 image once and load it locally for the scan (no push).
      # NO build cache: the runtime `apt-get upgrade` layer is keyed on the FROM
      # digest, so a cached build serves stale OS packages and Trivy then flags CVEs
      # already fixed in what we ship — release.yml/nightly.yml build fresh, so the
      # scan must too (esp. when a Debian fix lands before upstream republishes the
      # base, leaving no digest bump to bust the cache — the libcurl deb13u4 case).
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: clauster:scan
          platforms: linux/amd64
          no-cache: true
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clauster:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # The job's `if` skips PRs entirely, so this only ever runs on the main
          # push + the weekly cron — always enforce (fail on findings).
          exit-code: "1"
      - name: Upload SARIF
        # Post to the public `code-scanning/sarifs` endpoint with the minted App token,
        # the same path the zizmor job uses, so this upload draws on the App's own
        # per-installation rate bucket instead of the shared GITHUB_TOKEN pool that hit
        # "API rate limit exceeded for installation" on PR 1431. `upload-sarif` cannot
        # take an App token (codeql-action#2719). Every dynamic value comes through
        # `env:`, so nothing is interpolated into the script body. `always()` so a
        # findings run (exit-code 1 above) still uploads.
        if: always()
        env:
          GH_TOKEN: ${{ steps.sarif-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          CHECKOUT_URI: file://${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -f trivy-image.sarif ]; then
            echo "::warning title=trivy SARIF::trivy-image.sarif is missing; the build or scan" \
              "failed, nothing uploaded."
            exit 0
          fi
          # `automationDetails.id` is what `upload-sarif` wrote from `category:`; the
          # sarifs endpoint takes no category field, so set it here so these uploads
          # supersede the existing `trivy-image` series. The trailing slash is
          # load-bearing: GitHub parses the id as `category/run-id`, so `trivy-image`
          # without one records an EMPTY category.
          sarif_b64="$(jq '.runs[].automationDetails.id = "trivy-image/"' trivy-image.sarif | gzip -c | base64 -w0)"
          sarif_id="$(gh api "repos/$REPO/code-scanning/sarifs" \
            -f "commit_sha=$COMMIT_SHA" \
            -f "ref=$REF" \
            -f "checkout_uri=$CHECKOUT_URI" \
            -f "tool_name=trivy" \
            -f "sarif=$sarif_b64" \
            --jq .id)"
          echo "Uploaded trivy SARIF (id=$sarif_id); waiting for processing."
          last_err=""
          for _ in $(seq 1 30); do
            if ! status="$(gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" \
              --jq .processing_status 2>/tmp/gh_poll_err)"; then
              last_err="$(cat /tmp/gh_poll_err)"
              status="pending"
            fi
            echo "processing_status=$status"
            case "$status" in
              complete) exit 0 ;;
              failed)
                echo "trivy SARIF processing failed:" >&2
                gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" --jq '.errors[]?' >&2
                exit 1 ;;
            esac
            sleep 5
          done
          echo "::warning title=trivy SARIF::still '$status' after the bounded wait;" \
            "not failing the gate. last GET error: ${last_err:-none}"
          exit 0

  zizmor:
    name: workflow audit
    # Skip on the `synchronize` storm (pr-auto-update fans a main push across every
    # open PR): re-running every push just taxes the API pools. Runs on PR
    # open/reopen/ready-for-review + push:main + weekly cron; `security required
    # checks passed` (if: always()) counts a skip as passing.
    # …and skip on a DRAFT PR for the same reason; `ready_for_review` re-fires it
    # on the flip.
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'synchronize')
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `contents: read` is all any step's job token needs: `actions/checkout` and
      # zizmor's fork fallback both read only. The SARIF upload uses a minted App
      # token, so the job token no longer needs `security-events: write` or `actions`.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so zizmor's GitHub
      # API calls (e.g. the /advisories audit) don't exhaust the 1,000/hr
      # github-actions[bot] pool under bursts (observed: zizmor /advisories 403).
      # This token carries `contents: read` only and goes to `Run zizmor` below. The
      # SARIF upload uses a SECOND token with `security-events: write`, minted just
      # before that step, so the `zizmor` binary never holds a scope that could rewrite
      # the Security tab (#1437). Same-repo runs only; fork PRs lack the App secrets,
      # so this step is skipped and zizmor falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      # A SECOND App token, `security-events: write` only, for the code-scanning/sarifs
      # POST below. Minted here, next to the first, so BOTH tokens exist before the audit
      # runs. `Run zizmor` exits nonzero on findings, and a mint placed after it with a
      # bare `if:` (implicit `success()`) would then be skipped, leaving the `always()`
      # upload with no token — the exact path `always()` exists for. Separate from the
      # audit token so the `zizmor` binary never holds the write scope (#1437). Same
      # same-repo `if:` as the first mint.
      - name: Mint SARIF upload token
        id: sarif-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-security-events: write
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9" # pinned uv (Renovate-tracked); skip the flaky "latest" fetch
      - name: Install zizmor
        env:
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.30.0"
        # Pinned so a bad PyPI release cannot change what runs under the App token.
        run: uv tool install "zizmor==$ZIZMOR_VERSION"
      - name: Run zizmor
        run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        # `always()` like the trivy upload above: zizmor exits nonzero when it has
        # findings, which is exactly when the SARIF is worth sending to the Security
        # tab. `upload-sarif` cannot take an App token: inside Actions it uploads through
        # `PUT /repos/{owner}/{repo}/code-scanning/analysis` (its `analyses.ts`), an
        # Actions-only route that answered "Not Found" to this App token on PR 1435 (run
        # 33700073187); codeql-action#2719 is the same failure. So this posts to the
        # public `POST /repos/{owner}/{repo}/code-scanning/sarifs` endpoint, which the
        # REST docs limit "per user or app installation", giving the App its own bucket
        # instead of the shared GITHUB_TOKEN pool that hit "API rate limit exceeded for
        # installation" on PR 1431. Every dynamic value arrives through `env:`, so
        # nothing is interpolated into the script body (zizmor's template-injection
        # audit). The upload token is required here, not GITHUB_TOKEN: this step's `if:`
        # already limits it to same-repo, where the mint runs, and a fork PR cannot write
        # code scanning results, so skip rather than red the required gate (`always()`
        # counts the skip as passing). Both tokens are minted before `Run zizmor`, so a
        # findings-nonzero audit cannot skip this token via a mint's implicit `success()`.
        if: >-
          ${{ always()
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.sarif-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          CHECKOUT_URI: file://${{ github.workspace }}
        run: |
          set -euo pipefail
          # `automationDetails.id` is what `upload-sarif` wrote from `category:`; the
          # sarifs endpoint takes no category field, so set it here so these uploads
          # supersede the existing `zizmor` analysis series instead of leaving stale
          # duplicates next to it.
          sarif_b64="$(jq '.runs[].automationDetails.id = "zizmor/"' results.sarif | gzip -c | base64 -w0)"
          sarif_id="$(gh api "repos/$REPO/code-scanning/sarifs" \
            -f "commit_sha=$COMMIT_SHA" \
            -f "ref=$REF" \
            -f "checkout_uri=$CHECKOUT_URI" \
            -f "tool_name=zizmor" \
            -f "sarif=$sarif_b64" \
            --jq .id)"
          echo "Uploaded zizmor SARIF (id=$sarif_id); waiting for processing."
          last_err=""
          for _ in $(seq 1 30); do
            # A transient GET error must not red an upload that already succeeded, so
            # keep polling and remember the last error for the timeout message below.
            if ! status="$(gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" \
              --jq .processing_status 2>/tmp/gh_poll_err)"; then
              last_err="$(cat /tmp/gh_poll_err)"
              status="pending"
            fi
            echo "processing_status=$status"
            case "$status" in
              complete) exit 0 ;;
              failed)
                echo "zizmor SARIF processing failed:" >&2
                gh api "repos/$REPO/code-scanning/sarifs/$sarif_id" --jq '.errors[]?' >&2
                exit 1 ;;
            esac
            sleep 5
          done
          # A slow-but-not-failed upload must not red this required check: the audit
          # verdict is the Run zizmor step, and the analysis lands a moment later. Warn
          # and pass, but surface the last GET error so a persistent id or permission
          # problem is not misread as a slow upload.
          echo "::warning title=zizmor SARIF::still '$status' after the bounded wait;" \
            "not failing the gate. last GET error: ${last_err:-none}"
          exit 0

  dependency-review:
    name: dependency review
    # PR-only, and only when the diff actually changes code/deps. Draft PRs skip
    # (`changes` is skipped there too, so its output would be empty anyway — the
    # explicit term keeps the reason readable rather than incidental).
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so the action's
      # dependency-graph + PR-comment API calls don't exhaust the 1,000/hr
      # github-actions[bot] pool under bursts. This job is already PR-only; on a
      # fork PR the App secrets are unavailable, so the step is skipped and the
      # action falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          repo-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  security-required-checks-passed:
    name: security required checks passed
    # `always()` so a failed/skipped need still lets this job evaluate them; the
    # draft term skips the whole aggregator on a draft PR, matching its upstreams
    # (see the DRAFT PRs note at the top of `jobs:`).
    if: always() && github.event.pull_request.draft != true
    needs:
      - changes
      - codeql
      - gitleaks
      - trivy-image
      - zizmor
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
