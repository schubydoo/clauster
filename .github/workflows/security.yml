name: Security

# Consolidates the project's security scanners into one file so the security
# posture is grokkable at a glance. Each scanner is its own JOB (not a step) so
# they run in parallel and appear individually in the PR checks list and in the
# code-scanning Security tab.

on:
  push:
    branches: [main]
  pull_request:
    # Defaults (opened, synchronize, reopened) PLUS `ready_for_review`: this
    # workflow backs the required `security required checks passed` context, and
    # flipping a PR draft → ready is the issue #509 recovery path that re-dispatches
    # it on the current head SHA without a push.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff so the heavy analysers skip a docs-only change. The
  # `security required checks passed` aggregator still runs (it counts a skipped
  # job as passing), so the required context keeps reporting on docs-only PRs —
  # which is why these can't use a top-level `paths-ignore` (that would make the
  # required check never report and the PR hang "Expected — waiting").
  #
  # DRAFT PRs: every SARIF-uploading / expensive job below (codeql, zizmor,
  # dependency-review, and the `changes` classifier they gate on) carries
  # `github.event.pull_request.draft != true`, so a draft PR uploads no CodeQL or
  # zizmor SARIF and runs no dependency review — the shared GITHUB_TOKEN pool those
  # uploads draw on is what the skip protects. The ONE deliberate exception is
  # `gitleaks` (secret scan): it runs on drafts because it uploads NO SARIF and
  # mints its own App token, so a draft still gets a real secret scan (see its own
  # note). (`trivy-image` is not in the guarded set either: it is already
  # `github.event_name != 'pull_request'`, so a draft term there would be
  # unreachable.)
  # `!= true` (not `== false`) so push:main / the weekly cron — where `draft` is
  # null — fail-safe to running. `ready_for_review` is in the trigger types, so
  # flipping a draft ready re-dispatches the whole workflow on the current head
  # SHA. A job skipped by its `if:` reports a check run whose conclusion is
  # SUCCESS, so `security required checks passed` resolves on a draft rather than
  # hanging (the "Expected — waiting" failure mode comes from a workflow-level
  # `paths:` filter suppressing the check run, not from a job-level `if:`).
  changes:
    name: classify changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        uses: $/.github/actions/changed-code

  codeql:
    name: codeql analyze
    # ALWAYS run — never gate on the docs-only classifier. The `main` ruleset has
    # a `code_scanning` rule requiring the CodeQL tool to have results; GitHub's
    # merge protection treats a required tool that produced no results (a skipped
    # job) as unsatisfied, so a docs-only PR would sit at mergeStateStatus=BLOCKED
    # forever even with every required status check green. Re-analysing unchanged
    # code costs a little CI time, but minutes are free on this public repo and
    # this keeps the required code-scanning tool satisfiable on every PR.
    #
    # NB: this is the `pull_request` (merge-commit) analysis. A PARALLEL head-SHA
    # analysis runs in codeql.yml on `push` to cure the "stuck PR" class — a base
    # move recomputes `refs/pull/N/merge` but fires no `pull_request` event, so
    # this merge-ref result goes stale and the PR sticks at BLOCKED. The two are
    # intentional and NOT duplicates: they carry different refs (refs/pull/N/merge
    # here vs refs/heads/<branch> there). Do NOT skip this on `synchronize` as
    # "already covered by codeql.yml" without accepting the loss of the
    # merge-commit PR-diff annotations (the more accurate of the two).
    #
    # The one exception to "ALWAYS run" is a DRAFT PR, and it is safe precisely
    # BECAUSE of that parallel workflow: codeql.yml still analyses every push to
    # the branch's head SHA, and the `code_scanning` rule honours a head-SHA
    # analysis, so a draft is never left without results. Skipping the merge-ref
    # analysis while drafting halves the CodeQL SARIF uploads a draft generates —
    # the shared GITHUB_TOKEN pool those uploads draw on is the reason this guard
    # exists. `ready_for_review` restores the merge-ref analysis before review.
    #
    # ⚠️ One coverage window this opens, stated rather than buried: a FORK's draft
    # PR now gets NO CodeQL at all. codeql.yml's `on: push` fires in the fork's own
    # repository, never here (see its header), so the head-SHA analysis that covers
    # in-repo drafts cannot reach a fork — and this merge-ref job was the only thing
    # that did. It returns on `ready_for_review`, and a draft cannot merge, so this
    # is a deferral rather than a hole in the merge gate.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: secret scan
    # Runs on drafts too — deliberately, and it is the one security job worth every
    # draft push. It mints an App token (≥5,000/hr) and uploads NO SARIF, so it
    # costs nothing from the shared GITHUB_TOKEN pool the draft skip exists to
    # protect; catching a leaked credential on the FIRST draft push — before later
    # commits bury it — is worth far more than the cheap run. (What actually keeps a
    # leak out of `main` is that a draft cannot merge and `ready_for_review` re-fires
    # the required aggregate before review — NOT the push:main / weekly-cron scans,
    # which fire only after the merge commit exists and are post-hoc detection, a
    # rotation event rather than a prevented leak.)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Spelled out for parity with the other scanners (it would otherwise inherit
    # the workflow-level contents:read) — checkout + the App token's contents
    # read are all this job needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so the action's
      # GitHub API calls (e.g. the "Get user" license check) don't exhaust the
      # 1,000/hr github-actions[bot] pool under bursts. Same-repo runs only
      # (push/schedule, or a same-repo PR); fork PRs lack the App secrets, so the
      # step is skipped and the token falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  trivy-image:
    name: trivy image scan
    # Building the image just to scan it is the long pole of this workflow (a few
    # minutes — it builds no-cache; see the build step). Skip it on PRs (where it's
    # report-only anyway); run on the main push + the weekly cron, which still catch
    # image CVEs and a broken Dockerfile before any tagged release. The `security
    # required checks passed` aggregator treats a skipped job as passing (same as
    # the PR-only dependency-review on push), so the required check stays green on
    # PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Build the amd64 image once and load it locally for the scan (no push).
      # NO build cache: the runtime `apt-get upgrade` layer is keyed on the FROM
      # digest, so a cached build serves stale OS packages and Trivy then flags CVEs
      # already fixed in what we ship — release.yml/nightly.yml build fresh, so the
      # scan must too (esp. when a Debian fix lands before upstream republishes the
      # base, leaving no digest bump to bust the cache — the libcurl deb13u4 case).
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: clauster:scan
          platforms: linux/amd64
          no-cache: true
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clauster:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # The job's `if` skips PRs entirely, so this only ever runs on the main
          # push + the weekly cron — always enforce (fail on findings).
          exit-code: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  zizmor:
    name: workflow audit
    # Skip on the `synchronize` storm (pr-auto-update fans a main push across every
    # open PR): the SARIF upload is GITHUB_TOKEN-only (codeql-action#2719), so
    # re-running every push just taxes the 1,000/hr pool. Runs on PR
    # open/reopen/ready-for-review + push:main + weekly cron; `security required
    # checks passed` (if: always()) counts a skip as passing.
    # …and skip on a DRAFT PR for the same reason (the SARIF upload taxes the
    # shared GITHUB_TOKEN pool); `ready_for_review` re-fires it on the flip.
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'synchronize')
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so zizmor's GitHub
      # API calls (e.g. the /advisories audit) don't exhaust the 1,000/hr
      # github-actions[bot] pool under bursts (observed: zizmor /advisories 403).
      # Same-repo runs only; fork PRs lack the App secrets, so the step is skipped
      # and the token falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8" # pinned uv (Renovate-tracked); skip the flaky "latest" fetch
      - name: Install zizmor
        run: uv tool install zizmor
      - name: Run zizmor
        run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: zizmor

  dependency-review:
    name: dependency review
    # PR-only, and only when the diff actually changes code/deps. Draft PRs skip
    # (`changes` is skipped there too, so its output would be empty anyway — the
    # explicit term keeps the reason readable rather than incidental).
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint a clauster-ci App token (≥5,000 REST req/hr) so the action's
      # dependency-graph + PR-comment API calls don't exhaust the 1,000/hr
      # github-actions[bot] pool under bursts. This job is already PR-only; on a
      # fork PR the App secrets are unavailable, so the step is skipped and the
      # action falls back to GITHUB_TOKEN below.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTER_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTER_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          repo-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  security-required-checks-passed:
    name: security required checks passed
    # `always()` so a failed/skipped need still lets this job evaluate them; the
    # draft term skips the whole aggregator on a draft PR, matching its upstreams
    # (see the DRAFT PRs note at the top of `jobs:`).
    if: always() && github.event.pull_request.draft != true
    needs:
      - changes
      - codeql
      - gitleaks
      - trivy-image
      - zizmor
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
