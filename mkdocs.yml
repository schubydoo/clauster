site_name: Clauster
site_description: >-
  Self-hosted web UI for spawning and managing Claude Code remote-control
  bridges on a remote host.
site_url: https://schubydoo.github.io/clauster/
repo_url: https://github.com/schubydoo/clauster
repo_name: schubydoo/clauster
copyright: Copyright &copy; schubydoo — Apache-2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  # Listing `plugins:` at all disables the implicit default set, so `search` must
  # be re-listed explicitly or the site silently loses its search box.
  - search
  # Every moved or renamed page MUST add `old-path.md: new-path.md` here — this is
  # the only thing keeping bookmarked/externally-linked URLs alive, and
  # `mkdocs build --strict` will NOT flag a missing entry.
  - redirects:
      redirect_maps: {}
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - Quickstart: quickstart.md
      - Installation: installation.md
  - Concepts:
      - How Clauster works: architecture.md
      - How Clauster secures itself: security.md
      - Privacy: privacy.md
  - Guides:
      - Configuration: configuration.md
      - The in-app config editor: guides/config-editor.md
      - Networking & exposing: networking.md
  - Reference:
      - Public API: public-api.md
      - MCP server: mcp.md
  - Operations:
      - Operations runbook: operations.md
      - Troubleshooting: troubleshooting.md
      - Upgrading: upgrading.md
      - Changelog: changelog.md
  - Project:
      - Contributing: contributing.md
      - Support: support.md
      - Reporting a vulnerability: security-policy.md
