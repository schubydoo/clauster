<script nonce="{{ csp_nonce }}">
  const STATUS_LABELS = {
    starting: "Starting", running: "Running", stopping: "Stopping", stopped: "Stopped",
    interrupted: "Interrupted", crashed: "Crashed", error: "Failed to start",
  };
  // Amber = recoverable, you didn't end it (interrupted/crashed -> Resume). Red = you
  // must intervene (error: never started -> fix config). Grey = you stopped it.
  const STATUS_BADGE = {
    running: "bg-green-lt", starting: "bg-azure-lt", stopping: "bg-orange-lt",
    interrupted: "bg-yellow-lt", crashed: "bg-yellow-lt", error: "bg-red-lt",
    // Resting state: no fill. A filled pill is reserved for states that need
    // attention (running/error/interrupted) so a wall of grey pills doesn't read
    // as "everything is flagged"; stopped is just quiet text + its dot.
    stopped: "bg-transparent text-secondary px-1",
  };
  const STATUS_DOT = {
    running: "bg-green", starting: "bg-azure status-dot-animated", stopping: "bg-orange status-dot-animated",
    interrupted: "bg-yellow", crashed: "bg-yellow", error: "bg-red", stopped: "bg-secondary",
  };
  const ROOT = "{{ request.scope.root_path }}";
  const MAX_LOG_LINES = 1000;
  const MAX_PENDING = 1000;   // cap the paused-log buffer so it can't grow without bound
  // Reconnect delay + consecutive-failure cap shared by both live streams: the bridge-log tail
  // (openLogs) and the hosted live-view (openHosted). Both auto-reconnect a dropped socket after
  // LOG_RECONNECT_MS while the bridge/session still reads live, and both give up after
  // MAX_LOG_RECONNECTS consecutive failures so a permanently-dead socket stops retrying. A streamed
  // frame resets each stream's counter, so a genuinely-healthy stream reconnects without limit.
  const LOG_RECONNECT_MS = 1500;
  const MAX_LOG_RECONNECTS = 5;  // give up auto-reconnect after this many consecutive failures (CodeRabbit)
  const PROJECT_NAMES = [{% for p in projects %}{{ p.name | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}];
  const INITIAL_TRUST = { {% for p in projects %}{{ p.name | tojson }}: {{ p.trust_state.value | tojson }}{% if not loop.last %}, {% endif %}{% endfor %} };
  const DEFAULT_SPAWN_MODE = {{ default_spawn_mode | tojson }};
  const DEFAULT_PERMISSION_MODE = {{ default_permission_mode | tojson }};
  const DEFAULT_RESUME_MODE = {{ default_resume_mode | tojson }};
  const USAGE_MODE = {{ usage_mode | tojson }};  // usage.mode — "cost" | "tokens" | "off"
  const CURRENCY = {{ currency | tojson }};  // usage.currency — code, shown in the tooltip
  const CURRENCY_SYMBOL = {{ currency_symbol | tojson }};  // resolved symbol for cost mode
  const FX_RATE = {{ fx_rate | tojson }};  // usage.fx_rate — static USD->display multiplier
  const TOKENS_INCLUDE_CACHE = {{ token_total_includes_cache | tojson }};  // count cache in the total?
  const METRICS_ENABLED = {{ metrics_enabled | tojson }};  // metrics.enabled — live CPU/mem/disk line
  const METRICS_SHOW_DISK = {{ metrics_show_disk | tojson }};  // metrics.show_disk — disk-rate part
  const METRICS_POLL_MS = {{ metrics_poll_ms | tojson }};  // metrics.poll_seconds × 1000
  const CLAUSTRUM_ENABLED = {{ claustrum_enabled | tojson }};  // claustrum.enabled — hosted live-view channel
  // Pre-selected launch mode. Hosted ("browser") is opt-in and fails closed when
  // claustrum is off, so on a default install we pre-select a working mode (#345).
  const DEFAULT_LAUNCH_MODE = CLAUSTRUM_ENABLED ? "browser" : "desktop";

  // Humanize a token count for the compact badge (1.2M / 3.4k); the exact value
  // lives in the tooltip (usageTitle).
  function fmtTokens(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  // Theme toggle (navbar) — persisted, mirrors the no-flash init above.
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    function sync() {
      var dark = document.documentElement.getAttribute("data-bs-theme") === "dark";
      btn.querySelector(".icon-sun").style.display = dark ? "none" : "inline-block";
      btn.querySelector(".icon-moon").style.display = dark ? "inline-block" : "none";
    }
    btn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      localStorage.setItem("clauster-theme", next);
      sync();
    });
    sync();
  });

  function dashboard() {
    return {
      instances: {},
      externalSessions: {},
      externalOpen: {},   // project name -> true while its external-session detail is expanded
      adoptableProjects: [],  // names whose external session is a standard bridge we can adopt (#330)
      // --- in-app config editor (FE-3, Tier-A allowlist) ---
      configEditor: {
        open: false, loading: false, saving: false,
        fields: {}, specs: {}, edits: {}, editable: [], hash: null,
        error: "", saved: false, trigger: null, gen: 0,
      },
      configQuery: "",
      // --- read-only transcript viewer (#431) ---
      // order: "desc" (newest-first, default) | "asc" (oldest-first) — sort toggle (#612).
      // q: in-message substring filter; queryTooShort drives the "keep typing" state (#612).
      transcripts: {
        open: false, loading: false, loadingMore: false,
        project: "", sessions: [],
        session: "", turns: [], total: 0, nextCursor: null,
        error: "", trigger: null, gen: 0,
        order: "desc", q: "", queryTooShort: false,
      },
      agents: [],
      agentDispatchOpen: false,
      agentForm: { project: "", prompt: "", cloud: false, busy: false },
      agentStopping: {},   // job id -> true while a stop request is in flight
      agentResuming: {},   // job id -> true while a resume request is in flight (#336)
      forgetting: {},      // bridge/hosted id -> true while a forget request is in flight
      launching: {},       // project name -> true while a launch is in flight (double-submit guard)
      // --- hosted live-view sessions (claustrum stream-json channel, CL-4c) ---
      hosted: [],                 // GET /api/hosted snapshot (channel="hosted" instances)
      hostedDispatchOpen: false,
      hostedForm: { project: "", permission_mode: DEFAULT_PERMISSION_MODE, busy: false },
      hostedStopping: {},         // hosted id -> true while a stop is in flight
      hostedResuming: {},         // hosted id -> true while a resume is in flight
      hostedView: {},             // hosted id -> { open, ws, token, lastSeq, events[], input, sending, connLost, attempts }
      _hostedSeq: 0,              // monotonic token per opened hosted live-view (retire check; see openHosted)
      errors: {},
      qrOpen: {},
      qrNonce: {},
      logs: {},
      spawnMode: {},
      permMode: {},
      resumeMode: {},
      confirmBypass: {},
      bypassTyped: {},
      confirmTrust: {},
      trustConfirmed: {},   // the "I trust…" checkbox in the trust-on-start dialog
      cmd: {},
      usage: {},
      sortMeta: {},       // project name -> {last_used: iso|null, cost_usd: float|null}; Zone 1 sort (lazy)
      preflight: {},      // project name -> per-project preflight result ({ok, checks}); lazy-loaded
      preflightOpen: {},  // project name -> true while its preflight-warning detail is expanded
      metrics: {},        // project name -> live CPU/mem/disk sample (null when not running)
      trustState: {},     // project name -> 'trusted' | 'untrusted' (reactive; no reload on trust)
      trusting: {},       // project name -> bool (trust request in flight)
      toasts: [],
      _toastSeq: 0,
      _logSeq: 0,          // monotonic token per opened log tail (retire check; see openLogs)
      connLost: false,    // polling has failed repeatedly -> data is stale
      _refreshFails: 0,
      _refreshing: false,    // single-flight guard for refresh()
      _refreshQueued: false,  // a refresh requested while one was in flight -> run one trailing
      np: { open: false, name: "", submittedName: "", mode: "create", url: "", shallow: false,
            gitInit: false, busy: false, error: null, warn: null,
            cloning: false, progress: { percent: null, phase: "" } },
      // System-readiness (preflight) — the `clauster doctor` checks surfaced in the
      // browser so a precondition (claude not logged in, dir untrusted, …) is visible
      // up front instead of failing silently when you click Start. loaded stays false
      // until /api/doctor answers, so the panel never flashes empty.
      readiness: { loaded: false, ok: true, checks: [], showAll: false, showPanel: false },
      activeFilter: "all",   // Zone 2 unified-list filter: all | browser | desktop | detached
      projectFilter: "",     // Zone 1 search box
      showAllProjects: false, // Zone 1: reveal projects beyond the cap
      projectSort: "name",   // Zone 1 sort (FE-2): name (default, no reorder) | last-used | cost
      projectRanks: {},      // project name -> CSS flex `order` int when a non-name sort is active
      async init() {
        for (const n of PROJECT_NAMES) {
          this.spawnMode[n] = DEFAULT_SPAWN_MODE;
          this.permMode[n] = DEFAULT_PERMISSION_MODE;
          this.resumeMode[n] = DEFAULT_RESUME_MODE;
        }
        this.trustState = { ...INITIAL_TRUST };
        await this.refresh();
        // Preflight in ONE batched request (server does a single discovery scan) so
        // first paint doesn't fire N per-project /preflight calls (was O(N²) on the
        // server). Usage stays per-project but rides the cached discovery cheaply.
        this.loadAllPreflight();
        for (const n of PROJECT_NAMES) { this.loadUsage(n); }
        this.loadReadiness();  // fire-and-forget: doctor runs subprocess probes, don't block first paint
        setInterval(() => this.refresh(), 4000);
        // Live metrics on their own cadence (metrics.poll_seconds), if enabled.
        if (METRICS_ENABLED) { this.refreshMetrics(); setInterval(() => this.refreshMetrics(), METRICS_POLL_MS); }
      },
      // --- system readiness (preflight panel) ---
      async loadReadiness() {
        try {
          const r = await fetch(ROOT + "/api/doctor");
          if (r.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (!r.ok) return;
          const d = await r.json();
          this.readiness.ok = !!d.ok;
          this.readiness.checks = Array.isArray(d.checks) ? d.checks : [];
          this.readiness.loaded = true;
        } catch (e) { /* fetch failed -> leave loaded=false so the panel stays hidden */ }
      },
      readinessIssues() { return this.readiness.checks.filter((c) => c.status !== "ok"); },
      // A "warn" lets a session still start; anything else (error/fail) is a hard blocker.
      // The pill's severity + wording follow this so it doesn't cry wolf over warnings.
      readinessBlockers() { return this.readiness.checks.filter((c) => c.status !== "ok" && c.status !== "warn"); },
      readinessWarnings() { return this.readiness.checks.filter((c) => c.status === "warn"); },
      checkGlyph(s) { return s === "ok" ? "✓" : s === "warn" ? "⚠" : "✗"; },
      checkClass(s) { return s === "ok" ? "text-success" : s === "warn" ? "text-warning" : "text-danger"; },
      // --- launch popover + unified active list ---
      // Outcome-language launch choices — jargon (hosted/bridge/background) mapped to
      // the plain result the user gets. The "cloud" checkbox folds into Background.
      launchModes() {
        const modes = [
          { id: "desktop", label: "In claude.ai / Desktop", sub: "connect from your phone or the Claude app" },
          { id: "detached", label: "Background", sub: "runs in the background — check back later" },
        ];
        // Hosted ("browser") needs claustrum; offering it on a default install pre-selects
        // a fail-closed mode (#345). Only surface it — first, and badged experimental —
        // when the channel is actually enabled.
        if (CLAUSTRUM_ENABLED) {
          modes.unshift({ id: "browser", label: "Here in the browser",
                          sub: "watch it work live, approve tools inline", badge: "experimental" });
        }
        return modes;
      },
      // Route a launch by chosen mode: browser=hosted, desktop=bridge, detached=background.
      async launchRun(name, mode, perm, cloud, prompt) {
        if (this.launching[name]) return;  // a launch is already in flight — ignore the double-click
        this.launching[name] = true;
        try {
          if (mode === "browser") { await this._launchHosted(name, perm); }
          else if (mode === "detached") { await this._launchDetached(name, prompt, cloud, perm); }
          // bridge: route through start() so the trust + bypassPermissions gates still apply.
          // await it (start is async) so launching[name] stays set across the spawn — else
          // the finally clears the guard immediately and a desktop double-click double-spawns.
          else { if (perm) this.permMode[name] = perm; await this.start(name); }
        } finally {
          this.launching[name] = false;
        }
      },
      async _launchHosted(name, perm) {
        try {
          const res = await fetch(ROOT + "/api/instances", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: "hosted", project: name, permission_mode: perm || DEFAULT_PERMISSION_MODE }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            this.toast(name + ": running in the browser", "success");
            await this.refresh();
            if (b && b.claustrum_process_id) this.openHosted(b.claustrum_process_id);  // watch it immediately
          } else { this.toast(this._hostedFailMsg(b.detail || res.status), "error"); }
        } catch (e) { this.toast(this._hostedFailMsg(), "error"); }
      },
      // Hosted runs need claustrum; a fail-closed launch otherwise dead-ends with a bare
      // error. Point the user at the precondition rather than just reporting failure (#345).
      _hostedFailMsg(detail) {
        const base = "couldn't run in the browser";
        if (!CLAUSTRUM_ENABLED) return base + " — needs claustrum enabled (see docs)";
        return detail ? base + " — " + detail : base;
      },
      async _launchDetached(name, prompt, cloud, perm) {
        try {
          const body = { project: name };
          if (prompt && prompt.trim()) body.prompt = prompt.trim();
          if (cloud) body.rc_name = name;  // "also register on claude.ai"
          if (perm) body.permission_mode = perm;  // background runs unattended — honor the choice
          const res = await fetch(ROOT + "/api/agents", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            // With claude.ai registration this isn't really a forget-about-it background run —
            // it's a live, conversational session you drive from Desktop and can Stop here; say so.
            this.toast(cloud ? name + ": started — connect from claude.ai / Desktop"
                             : name + ": started (background)", "success");
            await this.refresh();
          }
          else { this.toast("start failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("start failed", "error"); }
      },
      // Per-project rollup of live sessions (bridge + hosted; background approximated out
      // for now — bg jobs are keyed by cwd, not project name).
      runningCountFor(name) {
        let n = 0;
        const i = this.instances[name];
        if (i && ["running", "starting", "stopping"].includes(i.status)) n++;
        n += this.hosted.filter((h) => h.project === name && ["running", "starting"].includes(h.status)).length;
        return n;
      },
      // Bridges currently alive (the instances map is project-keyed -> values array).
      activeBridges() {
        return Object.values(this.instances).filter((i) => ["running", "starting", "stopping"].includes(i.status));
      },
      // --- Zone 2 split: a live-only main list + a collapsed "Recent / resumable" group ---
      // so the Active zone (fixed at the top) only ever shows what's genuinely running.
      liveHosted() { return this.hosted.filter((h) => ["running", "starting", "stopping"].includes(h.status)); },
      endedHosted() { return this.hosted.filter((h) => ["stopped", "crashed", "error"].includes(h.status)); },
      // A detached session is "live" while its worker process runs or it's actively
      // working/blocked; once ended there's no process to Stop — only Forget (remove the record).
      agentLive(j) { return j.worker_alive || ["working", "blocked"].includes(j.state); },
      liveAgents() { return this.agents.filter((j) => this.agentLive(j)); },
      endedAgents() { return this.agents.filter((j) => !this.agentLive(j)); },
      // Stopped/crashed bridges that can be reconnected (Resume) — surfaced in Recent.
      endedBridges() { return Object.values(this.instances).filter((i) => this.isResumable(i.project)); },
      hasLive() { return this.liveHosted().length + this.activeBridges().length + this.liveAgents().length + this.externalSessionsFlat().length > 0; },
      // #357: only offer filter chips for session types actually present, so a chip can
      // never select an empty set on open.
      presentFilters() {
        const f = ["all"];
        if (this.liveHosted().length) f.push("browser");
        if (this.activeBridges().length) f.push("desktop");
        if (this.liveAgents().length) f.push("detached");
        if (this.externalSessionsFlat().length) f.push("external");
        return f;
      },
      // #357: if the active filter's session type has emptied out, its chip is gone
      // from presentFilters() — leaving activeFilter pointing at an absent type means no
      // chip reads as the current selection (every aria-pressed=false) and the remaining
      // sessions hide behind an unreachable filter. Fall back to "all" so the selection
      // is always a present, screen-reader-reachable chip. Driven from refresh().
      ensureValidFilter() {
        if (!this.presentFilters().includes(this.activeFilter)) this.activeFilter = "all";
      },
      // #357: live sessions matching the active filter; 0 drives the "no matches" line
      // (e.g. the selected type empties out while still active).
      activeFilterCount() {
        const counts = {
          all: this.liveHosted().length + this.activeBridges().length + this.liveAgents().length + this.externalSessionsFlat().length,
          browser: this.liveHosted().length,
          desktop: this.activeBridges().length,
          detached: this.liveAgents().length,
          external: this.externalSessionsFlat().length,
        };
        return counts[this.activeFilter] ?? 0;
      },
      hasRecent() { return this.endedHosted().length + this.endedBridges().length + this.endedAgents().length > 0; },
      recentCount() { return this.endedHosted().length + this.endedBridges().length + this.endedAgents().length; },
      // Whether the Recent group actually holds a *resumable* item, so the label doesn't
      // imply resume for a set of ended background agents (which are never resumable):
      // ended bridges are resumable by definition (isResumable), ended hosted only with a
      // claude_session_uuid, ended detached agents never. (#333 Option B)
      hasResumable() {
        return this.endedBridges().length > 0
          || this.endedHosted().some((h) => h.claude_session_uuid);
      },
      // Status -> left-rail colour: the rail encodes liveness/attention, NOT mode (mode is
      // already the badge). live=green · starting=azure · attention=yellow · ended=grey.
      hostedRailClass(h) {
        if (h.status === "running") return "sess-live";
        if (h.status === "starting") return "sess-starting";
        if (h.status === "stopping") return "sess-warn";
        return "sess-dead";
      },
      agentRailClass(j) {
        if (j.state === "blocked") return "sess-warn";
        if (j.worker_alive || j.state === "working") return "sess-live";
        return "sess-dead";
      },
      bridgeRailClass(name) {
        const s = this.displayStatus(name);
        if (s === "running") return "sess-live";
        if (s === "starting") return "sess-starting";
        if (s === "interrupted" || s === "crashed" || s === "stopping") return "sess-warn";
        return "sess-dead";
      },
      // Zone 1 search + cap: keep a long project list from burying Active sessions.
      matchesProject(name) {
        const q = (this.projectFilter || "").trim().toLowerCase();
        return !q || name.toLowerCase().includes(q);
      },
      // A row shows if it matches the search; with no search, only the first 6 show
      // until "Show all" is toggled — but a project with a live session is NEVER hidden by
      // the cap (you should always see what you're running in). We don't *reorder* the list
      // on launch, though — that's the same "don't move things under the user" rule that
      // pinned the Active zone; the row stays put, the "● N running" badge marks it.
      projectVisible(name, idx) {
        if ((this.projectFilter || "").trim()) return this.matchesProject(name);
        if (this.runningCountFor(name) > 0) return true;
        // The 6-row cap + Show-all toggle apply in EVERY sort. In name order the stable Jinja
        // `idx` is the row's position. In a non-name sort the DOM order stays A–Z (idx is
        // meaningless) and the visual order is the CSS-`order` rank, so cap by that rank instead
        // — otherwise the cap would keep the first 6 *alphabetical* rows, not the first 6 by the
        // chosen sort. While the ranks are still loading (async sortmeta) don't cap, so the list
        // never flashes empty mid-fetch.
        if (this.projectSort !== "name") {
          if (!Object.keys(this.projectRanks || {}).length) return true;
          return this.showAllProjects || this.projectOrderRank(name) < 6;
        }
        return this.showAllProjects || idx < 6;
      },
      // Zone 1 sort (FE-2) — opt-in, explicit-only. Default 'name' keeps the current
      // A–Z order with zero reorder; last-used/cost reorder via CSS `order` (no DOM
      // moves, so x-show/idx stay intact) and reveal the full list. Lazily (re)fetched
      // on each non-name sort selection — never on first paint — so the ranks reflect
      // the latest session history (a project you just finished sorts to the top).
      // Degrades to name order if the keys never load.
      async loadSortMeta() {
        // Clear ranks up front so projectVisible's loading guard shows the FULL list (not the
        // previous sort's capped six) for the duration of the async fetch; recompute refills them.
        this.projectRanks = {};
        try {
          const res = await fetch(ROOT + "/api/projects/sortmeta");
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (!res.ok) return;  // advisory — sort silently falls back to name order
          this.sortMeta = await res.json();
          this.recomputeProjectRanks();
        } catch (e) { /* advisory — sort stays on name order */ }
      },
      // Rebuild the name -> CSS-`order` map for the current sort. Assigns a whole object
      // so Alpine's reactive Proxy sees the change (avoids the frame-drop class #310/#315).
      recomputeProjectRanks() {
        if (this.projectSort === "name") { this.projectRanks = {}; return; }
        const meta = this.sortMeta || {};
        const key = this.projectSort === "cost" ? "cost_usd" : "last_used";
        const valOf = (n) => {
          const m = meta[n];
          if (!m) return null;
          if (key === "last_used") return m.last_used ? Date.parse(m.last_used) : null;
          return (typeof m.cost_usd === "number") ? m.cost_usd : null;
        };
        // Most-recent / highest-cost first; a null (no history) sinks to the bottom,
        // ties broken by name so the order is deterministic.
        const ranks = {};
        [...PROJECT_NAMES].sort((a, b) => {
          const va = valOf(a), vb = valOf(b);
          if (va === vb) return a.localeCompare(b);
          if (va === null) return 1;
          if (vb === null) return -1;
          return vb - va;
        }).forEach((n, i) => { ranks[n] = i; });
        this.projectRanks = ranks;
      },
      // CSS flex `order` for a row under the active sort (0 = first); unknown -> sink.
      projectOrderRank(name) {
        const r = this.projectRanks[name];
        return (r === undefined || r === null) ? 9999 : r;
      },
      // --- toasts ---
      toast(msg, type = "info") {
        const id = ++this._toastSeq;
        this.toasts.push({ id, msg, type });
        setTimeout(() => this.dismissToast(id), 4500);
      },
      dismissToast(id) { this.toasts = this.toasts.filter((t) => t.id !== id); },
      // --- config editor (FE-3) ---
      configSections() {
        const seen = [];
        for (const p of this.configEditor.editable) {
          const s = p.split(".")[0];
          if (!seen.includes(s)) seen.push(s);
        }
        return seen;
      },
      configFieldsFor(section) {
        return this.configEditor.editable.filter((p) => p.split(".")[0] === section);
      },
      configSectionLabel(section) {
        const first = this.configFieldsFor(section)[0];
        return (first && this.configEditor.specs[first] && this.configEditor.specs[first].section_label) || section;
      },
      // Fields in a section that match the filter (label / key / description, case-insensitive).
      configFieldsVisible(section) {
        const q = (this.configQuery || "").trim().toLowerCase();
        const fields = this.configFieldsFor(section);
        if (!q) return fields;
        return fields.filter((p) => {
          const s = this.configEditor.specs[p] || {};
          return ((s.label || "") + " " + (s.key || "") + " " + (s.description || "")).toLowerCase().includes(q);
        });
      },
      // A child field is gated off by a dependency: a boolean master switch that is off, or a
      // value-gated master whose value != the required one (spec.depends_on_value).

          this._markHostedEnded(id, this.hosted.find((x) => x.claustrum_process_id === id), fallback);
        }
        // A resolution flips the matching parked-permission item; it adds no new line.
        if (e.type === "control_resolved") {
          this._resolveHostedPermission(id, e.request_id, e.behavior);
          this.$nextTick(() => this.scrollHosted(id));
          return;
        }
        for (const it of this._hostedEventToItems(e)) v.events.push(it);
        if (v.events.length > MAX_LOG_LINES) v.events.splice(0, v.events.length - MAX_LOG_LINES);
        this.$nextTick(() => this.scrollHosted(id));
      },
      _resolveHostedPermission(id, requestId, behavior) {
        const v = this.hostedView[id];
        if (!v) return;
        for (const it of v.events) {
          if (it.kind === "permission" && it.request_id === requestId) {
            it.resolved = true;
            it.decision = ["allow", "deny", "interrupted"].includes(behavior) ? behavior : "answered";
          }
        }
      },
      // Translate one fanned event into renderable conversation items (per the design
      // doc's frame table: gap → "output lost (N frames)", lost → error, etc.).
      _hostedEventToItems(e) {
        switch (e.type) {
          case "frame": return this._hostedFrameToItems(e.frame || {});
          case "control_request": {
            const req = e.request || {};
            let input = "";
            if (req.input != null) { try { input = JSON.stringify(req.input); } catch (_) { input = ""; } }
            return [{ kind: "permission", request_id: e.request_id, subtype: e.subtype || "",
                      tool: req.tool_name || "", input, resolved: false, decision: null }];
          }
          case "control_ack": return [];  // MCP handshake; nothing user-facing
          case "stderr": case "text": return [{ kind: "stderr", text: e.text || "" }];
          case "exit":
            return [{ kind: "marker", text: "session ended" + (e.exit_code != null ? " (exit " + e.exit_code + ")" : "") }];
          case "lost": return [{ kind: "error", text: "stream lost: " + (e.reason || "daemon connection dropped") }];
          case "gap": {
            const n = e.dropped != null ? e.dropped
                    : (e.to_seq != null && e.from_seq != null ? e.to_seq - e.from_seq - 1 : null);
            return [{ kind: "gap", text: "output lost" + (n != null ? " (" + n + " frames)" : "") }];
          }
          default: return [];
        }
      },
      _hostedFrameToItems(frame) {
        const t = frame.type;
        if (t === "system") return [{ kind: "marker", text: "· " + (frame.subtype || "system") + " ·" }];
        if (t === "result") {
          // The result frame echoes the final assistant text the `assistant` frame
          // already rendered — re-rendering it double-printed every reply (#591). Keep
          // it only for the error path, where `result` carries text no assistant frame
          // emits (e.g. "Not logged in · Please run /login"); a success collapses to a
          // turn-boundary marker. `is_error` is the SDK's canonical error flag on the
          // result message and the ONLY reliable gate — subtype reads "success" even on
          // auth failure, so we key off is_error. A falsy is_error always means `result`
          // is the assistant-text duplicate (rate-limit / quota / teardown errors all set
          // is_error: true), so collapsing it never drops a user-facing error.
          if (frame.is_error) {
            const txt = (typeof frame.result === "string" && frame.result) ? frame.result : "turn failed";
            return [{ kind: "error", text: txt }];
          }
          return [{ kind: "marker", text: "· turn complete ·" }];
        }
        if (t === "assistant" || t === "user") {
          const content = (frame.message || {}).content;
          const items = [];
          if (typeof content === "string") {
            if (content.trim()) items.push({ kind: "msg", role: t, text: content });
          } else if (Array.isArray(content)) {
            for (const block of content) {
              if (!block || typeof block !== "object") continue;
              if (block.type === "text" && block.text) items.push({ kind: "msg", role: t, text: block.text });
              else if (block.type === "tool_use")
                items.push({ kind: "tool", name: block.name || "tool", input: block.input != null ? JSON.stringify(block.input) : "" });
              else if (block.type === "tool_result") {
                let txt = block.content;
                if (Array.isArray(txt)) txt = txt.map((b) => (b && b.text) ? b.text : "").join("");
                if (typeof txt !== "string") txt = "";
                items.push({ kind: "toolresult", text: txt });
              }
            }
          }
          return items;
        }
        return [];  // unknown frame type — ignore rather than dump raw
      },
      scrollHosted(id) {
        const el = document.getElementById("hosted-stream-" + id);
        if (el) el.scrollTop = el.scrollHeight;
      },
      async sendHosted(id) {
        const v = this.hostedView[id];
        if (!v || v.sending) return;
        const text = (v.input || "").trim();
        if (!text) return;
        v.sending = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) + "/message", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) { v.input = ""; }
          else { const b = await res.json().catch(() => ({})); this.toast("send failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("send failed", "error"); }
        // reset on EVERY path incl. the 401 early-return so the input can't wedge (#336 pattern; fixes #401).
        finally { v.sending = false; }
      },
      // Answer a parked tool-permission request (CL-5). Optimistically flips the item
      // on success; the control_resolved event confirms it (idempotent).
      async respondHosted(id, requestId, decision) {
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) +
                                  "/permissions/" + encodeURIComponent(requestId), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ decision }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) { this._resolveHostedPermission(id, requestId, decision); }
          else { const b = await res.json().catch(() => ({})); this.toast("permission " + decision + " failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("permission " + decision + " failed", "error"); }
      },
      // --- log streaming ---
      toggleLogs(name) {
        const s = this.logs[name];
        if (s && s.open) { this.closeLogs(name); } else { this.openLogs(name); }
      },
      openLogs(name, manual = false) {
        // `manual` = an operator click on Reconnect (vs. the auto-reconnect re-entry below).
        // A manual retry resets the consecutive-failure counter so the give-up cap can't make
        // the Reconnect button a no-op: once auto-reconnect hits MAX_LOG_RECONNECTS the carried
        // `attempts` would otherwise re-trip the cap on the very first onclose, so the button
        // looked dead even after the bridge's tail was reachable again (#584).
        // Idempotent + state-bound: retire any prior state first, then bind THIS socket's
        // handlers to its own `state` object (identity-checked against the live this.logs[name]).
        // So a reconnect (the Reconnect button re-calls this) can't leave two tails streaming
        // into one view, and a retired socket's late onmessage/onclose can't append to — or flip
        // `lost` on — the fresh panel.
        const prev = this.logs[name];
        if (prev) {
          prev.open = false;
          if (prev.ws) { try { prev.ws.close(); } catch (e) {} }
        }
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const url = proto + "://" + location.host + ROOT + "/ws/bridge-log/" + encodeURIComponent(name);
        // Tag this tail with a unique token; the retire check below compares the token, NOT
        // object identity — once Alpine wraps `state` in a reactive Proxy, comparing the raw
        // object against the stored proxy is ALWAYS unequal and would drop every frame (see
        // liveState() below, which returns the proxy so handlers mutate through reactivity).
        const token = ++this._logSeq;
        // Carry the prior tail's lines/buffer forward across a reconnect (auto-reconnect below,
        // or the Reconnect button) so a transient drop doesn't blank the panel — mirrors the
        // hosted view, which carries its events forward on reopen.
        const state = { open: true, ws: null, token,
                        lines: prev ? prev.lines : [], pending: prev ? prev.pending : [],
                        paused: prev ? prev.paused : false, lost: false, reconnecting: false,
                        attempts: (prev && !manual) ? prev.attempts : 0 };
        this.logs[name] = state;
        const self = this;
        // Resolve the LIVE tail as the reactive proxy (or null if retired). The token compare
        // (not object identity) survives the Proxy wrap; returning the proxy `s` — not the raw
        // `state` — means the handlers below mutate THROUGH Alpine's reactivity, so each frame
        // renders immediately. Mutating the raw `state` instead bypasses the Proxy set-traps and
        // the tail would only repaint on the next unrelated reactive flush (the 4s poll). This
        // matches closeLogs/pauseLogs/resumeLogs, which already mutate the proxy.
        const liveState = () => {
          const s = self.logs[name];
          return s && s.open && s.token === token ? s : null;
        };
        const ws = new WebSocket(url);
        ws.onmessage = (ev) => {
          const s = liveState();
          if (!s) return;  // a retired socket → ignore
          s.lost = false;  // a frame arrived → the tail is live again
          s.reconnecting = false;
          s.attempts = 0;  // reset the retry cap — a healthy tail reconnects without limit
          if (s.paused) {
            s.pending.push(ev.data);
            if (s.pending.length > MAX_PENDING) s.pending.splice(0, s.pending.length - MAX_PENDING);
            return;
          }
          s.lines.push(ev.data);
          if (s.lines.length > MAX_LOG_LINES) s.lines.splice(0, s.lines.length - MAX_LOG_LINES);
          self.$nextTick(() => self.scrollLog(name));
        };
        // A dropped socket (network blip, an idle proxy/tunnel reaping a quiet WS, bridge death)
        // used to strand the panel on a "disconnected" banner needing a manual Reconnect. Instead,
        // if the bridge is still live, auto-reconnect after a short delay so a transient drop
        // self-heals — mirroring the hosted live-view (openHosted). Only when the bridge is
        // actually gone do we surface the "disconnected — may have stopped" banner. Token-checked
        // via liveState() so a retired socket can't touch the fresh panel; closeLogs()/openLogs()
        // clear `open` first so an intentional close never reconnects. onclose always follows
        // onerror, so it alone decides — no separate onerror handler needed.
        ws.onclose = () => {
          const s = liveState();
          if (!s) return;  // deliberate close / retired → don't reconnect
          // Only reconnect a tail whose bridge the snapshot still reports as live; a stopped /
          // crashed / gone bridge stays on the disconnect banner instead of looping forever. The
          // 4s /api/instances poll keeps statusOf() fresh, so this converges either way.
          if (!["running", "starting"].includes(self.statusOf(name))) {
            s.reconnecting = false; s.lost = true; return;
          }
          // Cap consecutive failed reconnects: if the snapshot still reads "running" but the socket
          // keeps closing (a stale poll after the bridge died, or a server that 1008s every attempt),
          // give up after MAX_LOG_RECONNECTS instead of looping until the poll catches up. A streamed
          // frame (onmessage) resets the counter, so a genuinely-healthy tail reconnects indefinitely.
          if (s.attempts >= MAX_LOG_RECONNECTS) {
            s.reconnecting = false; s.lost = true; return;
          }
          s.attempts += 1;
          s.lost = false;
          s.reconnecting = true;  // through the proxy → surfaces "reconnecting…"
          setTimeout(() => {
            const s2 = self.logs[name];
            if (s2 && s2.token === token && s2.open) self.openLogs(name);
          }, LOG_RECONNECT_MS);
        };
        this.logs[name].ws = ws;
      },
      closeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.open = false;  // before close(), so the onclose `lost` handler sees it as intentional
        if (s.ws) { try { s.ws.close(); } catch (e) {} }
      },
      pauseLogs(name) { if (this.logs[name]) this.logs[name].paused = true; },
      resumeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.lines.push(...s.pending); s.pending = [];
        if (s.lines.length > MAX_LOG_LINES) s.lines.splice(0, s.lines.length - MAX_LOG_LINES);
        s.paused = false;
        this.$nextTick(() => this.scrollLog(name));
      },
      scrollLog(name) {
        const el = document.getElementById("log-" + name);
        if (el) el.scrollTop = el.scrollHeight;
      },
      jumpToLatest(name) { this.scrollLog(name); },
    };
  }

  function reaper() {
    return {
      open: false, loading: false, loaded: false, error: null,
      ghosts: [], total: 0, liveDirs: 0, busy: false, result: null, deleteTyped: "",
      toggle() { this.open = !this.open; if (this.open && !this.loaded) this.load(); },
      summary() {
        if (!this.ghosts.length) return "No leftover environments — nothing to clean up.";
        return this.ghosts.length + " leftover · " + this.liveDirs +
          " live dir(s) kept · cloud Default never touched";
      },
      async load() {
        this.loading = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/ghosts");
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "failed to scan"; }
          else { this.ghosts = body.ghosts || []; this.total = body.total; this.liveDirs = body.live_dirs; }
        } catch (e) { this.error = String(e); }
        finally { this.loaded = true; this.loading = false; }
      },
      async _reap(action, confirm) {
        this.busy = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/reap", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action, confirm, ids: this.ghosts.map((g) => g.id) }),
          });
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "reap failed"; return; }
          const errs = Object.keys(body.errors || {}).length;
          const msg = "✓ " + action + "d " + body.reaped.length + " environment(s)" +
            (body.skipped.length ? " · skipped " + body.skipped.length : "") +
            (errs ? " · " + errs + " error(s)" : "");
          this.deleteTyped = "";
          await this.load();
          this.result = msg;
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; }
      },
      archive() { this._reap("archive", "archive"); },
      del() { if (this.deleteTyped === "DELETE") this._reap("delete", "DELETE"); },
    };
  }
</script>
