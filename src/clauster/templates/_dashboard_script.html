<script>
  const STATUS_LABELS = {
    starting: "Starting", running: "Running", stopping: "Stopping", stopped: "Stopped",
    interrupted: "Interrupted", crashed: "Crashed", error: "Failed to start",
  };
  // Amber = recoverable, you didn't end it (interrupted/crashed -> Resume). Red = you
  // must intervene (error: never started -> fix config). Grey = you stopped it.
  const STATUS_BADGE = {
    running: "bg-green-lt", starting: "bg-azure-lt", stopping: "bg-orange-lt",
    interrupted: "bg-yellow-lt", crashed: "bg-yellow-lt", error: "bg-red-lt",
    // Resting state: no fill. A filled pill is reserved for states that need
    // attention (running/error/interrupted) so a wall of grey pills doesn't read
    // as "everything is flagged"; stopped is just quiet text + its dot.
    stopped: "bg-transparent text-secondary px-1",
  };
  const STATUS_DOT = {
    running: "bg-green", starting: "bg-azure status-dot-animated", stopping: "bg-orange status-dot-animated",
    interrupted: "bg-yellow", crashed: "bg-yellow", error: "bg-red", stopped: "bg-secondary",
  };
  const ROOT = "{{ request.scope.root_path }}";
  const MAX_LOG_LINES = 1000;
  const MAX_PENDING = 1000;   // cap the paused-log buffer so it can't grow without bound
  const PROJECT_NAMES = [{% for p in projects %}{{ p.name | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}];
  const INITIAL_TRUST = { {% for p in projects %}{{ p.name | tojson }}: {{ p.trust_state.value | tojson }}{% if not loop.last %}, {% endif %}{% endfor %} };
  const DEFAULT_SPAWN_MODE = {{ default_spawn_mode | tojson }};
  const DEFAULT_PERMISSION_MODE = {{ default_permission_mode | tojson }};
  const DEFAULT_RESUME_MODE = {{ default_resume_mode | tojson }};
  const USAGE_MODE = {{ usage_mode | tojson }};  // usage.mode — "cost" | "tokens" | "off"
  const CURRENCY = {{ currency | tojson }};  // usage.currency — code, shown in the tooltip
  const CURRENCY_SYMBOL = {{ currency_symbol | tojson }};  // resolved symbol for cost mode
  const FX_RATE = {{ fx_rate | tojson }};  // usage.fx_rate — static USD->display multiplier
  const TOKENS_INCLUDE_CACHE = {{ token_total_includes_cache | tojson }};  // count cache in the total?
  const METRICS_ENABLED = {{ metrics_enabled | tojson }};  // metrics.enabled — live CPU/mem/disk line
  const METRICS_SHOW_DISK = {{ metrics_show_disk | tojson }};  // metrics.show_disk — disk-rate part
  const METRICS_POLL_MS = {{ metrics_poll_ms | tojson }};  // metrics.poll_seconds × 1000
  const CLAUSTRUM_ENABLED = {{ claustrum_enabled | tojson }};  // claustrum.enabled — hosted live-view channel

  // Humanize a token count for the compact badge (1.2M / 3.4k); the exact value
  // lives in the tooltip (usageTitle).
  function fmtTokens(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  // Theme toggle (navbar) — persisted, mirrors the no-flash init above.
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    function sync() {
      var dark = document.documentElement.getAttribute("data-bs-theme") === "dark";
      btn.querySelector(".icon-sun").style.display = dark ? "none" : "inline-block";
      btn.querySelector(".icon-moon").style.display = dark ? "inline-block" : "none";
    }
    btn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      localStorage.setItem("clauster-theme", next);
      sync();
    });
    sync();
  });

  function dashboard() {
    return {
      instances: {},
      externalSessions: {},
      agents: [],
      agentDispatchOpen: false,
      agentForm: { project: "", prompt: "", cloud: false, busy: false },
      agentStopping: {},   // job id -> true while a stop request is in flight
      forgetting: {},      // bridge/hosted id -> true while a forget request is in flight
      launching: {},       // project name -> true while a launch is in flight (double-submit guard)
      // --- hosted live-view sessions (claustrum stream-json channel, CL-4c) ---
      hosted: [],                 // GET /api/hosted snapshot (channel="hosted" instances)
      hostedDispatchOpen: false,
      hostedForm: { project: "", permission_mode: DEFAULT_PERMISSION_MODE, busy: false },
      hostedStopping: {},         // hosted id -> true while a stop is in flight
      hostedResuming: {},         // hosted id -> true while a resume is in flight
      hostedView: {},             // hosted id -> { open, ws, token, lastSeq, events[], input, sending, connLost }
      _hostedSeq: 0,              // monotonic token per opened hosted live-view (retire check; see openHosted)
      errors: {},
      qrOpen: {},
      qrNonce: {},
      logs: {},
      spawnMode: {},
      permMode: {},
      resumeMode: {},
      confirmBypass: {},
      bypassTyped: {},
      confirmTrust: {},
      trustConfirmed: {},   // the "I trust…" checkbox in the trust-on-start dialog
      confirmNew: {},
      cmd: {},
      usage: {},
      metrics: {},        // project name -> live CPU/mem/disk sample (null when not running)
      trustState: {},     // project name -> 'trusted' | 'untrusted' (reactive; no reload on trust)
      trusting: {},       // project name -> bool (trust request in flight)
      toasts: [],
      _toastSeq: 0,
      connLost: false,    // polling has failed repeatedly -> data is stale
      _refreshFails: 0,
      _refreshing: false,    // single-flight guard for refresh()
      _refreshQueued: false,  // a refresh requested while one was in flight -> run one trailing
      np: { open: false, name: "", submittedName: "", mode: "create", url: "", shallow: false,
            gitInit: false, busy: false, error: null, warn: null,
            cloning: false, progress: { percent: null, phase: "" } },
      // System-readiness (preflight) — the `clauster doctor` checks surfaced in the
      // browser so a precondition (claude not logged in, dir untrusted, …) is visible
      // up front instead of failing silently when you click Start. loaded stays false
      // until /api/doctor answers, so the panel never flashes empty.
      readiness: { loaded: false, ok: true, checks: [], showAll: false, showPanel: false },
      activeFilter: "all",   // Zone 2 unified-list filter: all | browser | desktop | detached
      projectFilter: "",     // Zone 1 search box
      showAllProjects: false, // Zone 1: reveal projects beyond the cap
      async init() {
        for (const n of PROJECT_NAMES) {
          this.spawnMode[n] = DEFAULT_SPAWN_MODE;
          this.permMode[n] = DEFAULT_PERMISSION_MODE;
          this.resumeMode[n] = DEFAULT_RESUME_MODE;
        }
        this.trustState = { ...INITIAL_TRUST };
        await this.refresh();
        for (const n of PROJECT_NAMES) this.loadUsage(n);
        this.loadReadiness();  // fire-and-forget: doctor runs subprocess probes, don't block first paint
        setInterval(() => this.refresh(), 4000);
        // Live metrics on their own cadence (metrics.poll_seconds), if enabled.
        if (METRICS_ENABLED) { this.refreshMetrics(); setInterval(() => this.refreshMetrics(), METRICS_POLL_MS); }
      },
      // --- system readiness (preflight panel) ---
      async loadReadiness() {
        try {
          const r = await fetch(ROOT + "/api/doctor");
          if (r.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (!r.ok) return;
          const d = await r.json();
          this.readiness.ok = !!d.ok;
          this.readiness.checks = Array.isArray(d.checks) ? d.checks : [];
          this.readiness.loaded = true;
        } catch (e) { /* fetch failed -> leave loaded=false so the panel stays hidden */ }
      },
      readinessIssues() { return this.readiness.checks.filter((c) => c.status !== "ok"); },
      // A "warn" lets a session still start; anything else (error/fail) is a hard blocker.
      // The pill's severity + wording follow this so it doesn't cry wolf over warnings.
      readinessBlockers() { return this.readiness.checks.filter((c) => c.status !== "ok" && c.status !== "warn"); },
      readinessWarnings() { return this.readiness.checks.filter((c) => c.status === "warn"); },
      checkGlyph(s) { return s === "ok" ? "✓" : s === "warn" ? "⚠" : "✗"; },
      checkClass(s) { return s === "ok" ? "text-success" : s === "warn" ? "text-warning" : "text-danger"; },
      // --- launch popover + unified active list ---
      // Outcome-language launch choices — jargon (hosted/bridge/background) mapped to
      // the plain result the user gets. The "cloud" checkbox folds into Fire-and-forget.
      launchModes() {
        return [
          { id: "browser", label: "Here in the browser", sub: "watch it work live, approve tools inline" },
          { id: "desktop", label: "In claude.ai / Desktop", sub: "connect from your phone or the Claude app" },
          { id: "detached", label: "Fire-and-forget", sub: "runs detached — check back later" },
        ];
      },
      // Route a launch by chosen mode: browser=hosted, desktop=bridge, detached=background.
      async launchRun(name, mode, perm, cloud, prompt) {
        if (this.launching[name]) return;  // a launch is already in flight — ignore the double-click
        this.launching[name] = true;
        try {
          if (mode === "browser") { await this._launchHosted(name, perm); }
          else if (mode === "detached") { await this._launchDetached(name, prompt, cloud, perm); }
          // bridge: route through start() so the trust + bypassPermissions gates still apply.
          // await it (start is async) so launching[name] stays set across the spawn — else
          // the finally clears the guard immediately and a desktop double-click double-spawns.
          else { if (perm) this.permMode[name] = perm; await this.start(name); }
        } finally {
          this.launching[name] = false;
        }
      },
      async _launchHosted(name, perm) {
        try {
          const res = await fetch(ROOT + "/api/instances", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: "hosted", project: name, permission_mode: perm || DEFAULT_PERMISSION_MODE }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            this.toast(name + ": running in the browser", "success");
            await this.refresh();
            if (b && b.claustrum_process_id) this.openHosted(b.claustrum_process_id);  // watch it immediately
          } else { this.toast("start failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("start failed", "error"); }
      },
      async _launchDetached(name, prompt, cloud, perm) {
        try {
          const body = { project: name };
          if (prompt && prompt.trim()) body.prompt = prompt.trim();
          if (cloud) body.rc_name = name;  // "also register on claude.ai"
          if (perm) body.permission_mode = perm;  // fire-and-forget runs unattended — honor the choice
          const res = await fetch(ROOT + "/api/agents", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            // With claude.ai registration this isn't really "fire-and-forget" — it's a live,
            // conversational session you drive from Desktop and can Stop here; say so.
            this.toast(cloud ? name + ": started — connect from claude.ai / Desktop"
                             : name + ": started (fire-and-forget)", "success");
            await this.refresh();
          }
          else { this.toast("start failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("start failed", "error"); }
      },
      // Per-project rollup of live sessions (bridge + hosted; background approximated out
      // for now — bg jobs are keyed by cwd, not project name).
      runningCountFor(name) {
        let n = 0;
        const i = this.instances[name];
        if (i && ["running", "starting", "stopping"].includes(i.status)) n++;
        n += this.hosted.filter((h) => h.project === name && ["running", "starting"].includes(h.status)).length;
        return n;
      },
      // Bridges currently alive (the instances map is project-keyed -> values array).
      activeBridges() {
        return Object.values(this.instances).filter((i) => ["running", "starting", "stopping"].includes(i.status));
      },
      // --- Zone 2 split: a live-only main list + a collapsed "Recent / resumable" group ---
      // so the Active zone (fixed at the top) only ever shows what's genuinely running.
      liveHosted() { return this.hosted.filter((h) => ["running", "starting", "stopping"].includes(h.status)); },
      endedHosted() { return this.hosted.filter((h) => ["stopped", "crashed", "error"].includes(h.status)); },
      liveAgents() { return this.agents.filter((j) => j.worker_alive || ["working", "blocked"].includes(j.state)); },
      endedAgents() { return this.agents.filter((j) => !(j.worker_alive || ["working", "blocked"].includes(j.state))); },
      // Stopped/crashed bridges that can be reconnected (Resume) — surfaced in Recent.
      endedBridges() { return Object.values(this.instances).filter((i) => this.isResumable(i.project)); },
      hasLive() { return this.liveHosted().length + this.activeBridges().length + this.liveAgents().length > 0; },
      hasRecent() { return this.endedHosted().length + this.endedBridges().length + this.endedAgents().length > 0; },
      recentCount() { return this.endedHosted().length + this.endedBridges().length + this.endedAgents().length; },
      // Status -> left-rail colour: the rail encodes liveness/attention, NOT mode (mode is
      // already the badge). live=green · starting=azure · attention=yellow · ended=grey.
      hostedRailClass(h) {
        if (h.status === "running") return "sess-live";
        if (h.status === "starting") return "sess-starting";
        if (h.status === "stopping") return "sess-warn";
        return "sess-dead";
      },
      agentRailClass(j) {
        if (j.state === "blocked") return "sess-warn";
        if (j.worker_alive || j.state === "working") return "sess-live";
        return "sess-dead";
      },
      bridgeRailClass(name) {
        const s = this.displayStatus(name);
        if (s === "running") return "sess-live";
        if (s === "starting") return "sess-starting";
        if (s === "interrupted" || s === "crashed" || s === "stopping") return "sess-warn";
        return "sess-dead";
      },
      // Zone 1 search + cap: keep a long project list from burying Active sessions.
      matchesProject(name) {
        const q = (this.projectFilter || "").trim().toLowerCase();
        return !q || name.toLowerCase().includes(q);
      },
      // A row shows if it matches the search; with no search, only the first 6 show
      // until "Show all" is toggled — but a project with a live session is NEVER hidden by
      // the cap (you should always see what you're running in). We don't *reorder* the list
      // on launch, though — that's the same "don't move things under the user" rule that
      // pinned the Active zone; the row stays put, the "● N running" badge marks it.
      projectVisible(name, idx) {
        if ((this.projectFilter || "").trim()) return this.matchesProject(name);
        if (this.runningCountFor(name) > 0) return true;
        return this.showAllProjects || idx < 6;
      },
      // --- toasts ---
      toast(msg, type = "info") {
        const id = ++this._toastSeq;
        this.toasts.push({ id, msg, type });
        setTimeout(() => this.dismissToast(id), 4500);
      },
      dismissToast(id) { this.toasts = this.toasts.filter((t) => t.id !== id); },
      async refresh() {
        // Single-flight: setInterval can fire a new tick while a slow refresh is still
        // awaiting. Without this, an older refresh can resolve AFTER a newer one and clobber
        // this.instances / this.hosted with stale data. But action flows (`await refresh()`
        // after start/stop) must NOT be silently dropped — queue ONE trailing refresh so the
        // latest state lands right after the in-flight one completes.
        if (this._refreshing) { this._refreshQueued = true; return; }
        this._refreshing = true;
        let ok = true;
        try {
          const [iRes, sRes, aRes] = await Promise.all([
            fetch(ROOT + "/api/instances"),
            fetch(ROOT + "/api/sessions"),
            fetch(ROOT + "/api/agents"),
          ]);
          // Session expired mid-use -> bounce to login instead of silently showing stale data.
          if (iRes.status === 401 || sRes.status === 401 || aRes.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (iRes.ok) {
            const list = await iRes.json();
            const next = {};
            for (const i of list) next[i.project] = i;
            // Preserve a local optimistic "stopping" until the server confirms it's gone.
            for (const n of Object.keys(this.instances)) {
              if (this.instances[n] && this.instances[n].status === "stopping" && !next[n]) next[n] = this.instances[n];
            }
            this.instances = next;
          } else { ok = false; }
          if (sRes.ok) this.externalSessions = await sRes.json();
          else { ok = false; }
          if (aRes.ok) this.agents = await aRes.json();
          else { ok = false; }
          // Hosted sessions live in a separate registry (HostedManager); only poll
          // them when the claustrum channel is configured.
          if (CLAUSTRUM_ENABLED) {
            const hRes = await fetch(ROOT + "/api/hosted");
            if (hRes.status === 401) { window.location.assign(ROOT + "/login"); return; }
            if (hRes.ok) this.hosted = await hRes.json();
            else { ok = false; }
          }
        } catch (e) { ok = false; }
        finally {
          this._refreshing = false;
          // A refresh arrived mid-flight (e.g. from a start/stop action) — run it now so the
          // UI reflects the latest state without waiting for the next timer tick.
          if (this._refreshQueued) { this._refreshQueued = false; this.refresh(); }
        }
        // A single blip is normal; only surface a *persistent* outage so the user
        // knows the data is stale and we're retrying — never fail silently.
        if (ok) { this._refreshFails = 0; this.connLost = false; }
        else if (++this._refreshFails >= 2) this.connLost = true;
      },
      // --- background agents (agent view) ---
      agentBadgeClass(state) {
        const map = {
          working: "bg-blue-lt", blocked: "bg-orange-lt", done: "bg-green-lt",
          failed: "bg-red-lt", stopped: "bg-secondary-lt",
        };
        // Object.hasOwn so a state like "constructor" can't resolve up the
        // prototype chain to a function instead of the fallback class.
        return Object.hasOwn(map, state) ? map[state] : "bg-secondary-lt";
      },
      agentWhen(j) {
        if (!j.updated_at) return "";
        const d = new Date(j.updated_at);
        return isNaN(d.getTime()) ? "" : d.toLocaleString();
      },
      async dispatchAgent() {
        const f = this.agentForm;
        if (!f.project || f.busy) return;
        f.busy = true;
        try {
          const body = { project: f.project };
          if (f.prompt.trim()) body.prompt = f.prompt.trim();
          // "cloud" opens a Remote Control session named after the project.
          if (f.cloud) body.rc_name = f.project;
          const res = await fetch(ROOT + "/api/agents", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            this.toast("background agent dispatched", "success");
            f.prompt = "";  // keep project + cloud for a quick repeat dispatch
          } else {
            this.toast("dispatch failed — " + (b.detail || res.status), "error");
          }
        } catch (e) { this.toast("dispatch failed", "error"); }
        f.busy = false;
        await this.refresh();
      },
      async stopAgent(j) {
        const label = j.name || j.id;
        const msg = j.bridge_session_id
          ? "Stop \"" + label + "\"? This deregisters its cloud session."
          : "Stop and remove \"" + label + "\"?";
        if (!window.confirm(msg)) return;
        this.agentStopping[j.id] = true;
        try {
          const res = await fetch(ROOT + "/api/agents/" + encodeURIComponent(j.id), { method: "DELETE" });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok && b.settled === false) {
            // settled:false means the cloud-deregistering stop wasn't confirmed; removed
            // may also be false if `claude rm` soft-failed (supervisor idle-exited), so
            // don't claim "removed locally" unless it actually was.
            const status = b.removed ? "removed locally, but stop not confirmed"
                                      : "stop not confirmed (local cleanup pending)";
            this.toast(label + ": " + status + " — " + (b.detail || "re-check `claude agents` for a cloud orphan"), "warning");
          }
          else if (res.ok && b.removed) this.toast(label + ": stopped", "success");
          else if (res.ok) this.toast(label + ": stopped (cleanup pending — " + (b.detail || "supervisor restarting") + ")", "warning");
          else this.toast(label + ": stop failed — " + (b.detail || res.status), "error");
        } catch (e) { this.toast(label + ": stop failed", "error"); }
        this.agentStopping[j.id] = false;
        await this.refresh();
      },
      // Forget = drop a stopped/ended session's record so it leaves Recent/resumable.
      // Fail-closed on the server (a live session is refused 409); never stops a process.
      // `forget(name)` is a bridge (keyed by project), `forgetHosted(h)` a hosted session.
      async _forget(id, label) {
        if (!window.confirm("Forget \"" + label + "\"? This drops the stopped session from the "
          + "list so you can start fresh. It does not stop a live session.")) return;
        this.forgetting[id] = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) + "/forget",
                                  { method: "POST" });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) this.toast(label + ": forgotten", "success");
          else this.toast(label + ": " + (b.detail || ("forget failed — " + res.status)), "error");
        } catch (e) { this.toast(label + ": forget failed", "error"); }
        finally { this.forgetting[id] = false; }
        await this.refresh();
      },
      forget(name) { return this._forget(name, name); },
      forgetHosted(h) { return this._forget(h.claustrum_process_id, h.project || h.claustrum_process_id); },
      statusOf(name) { return (this.instances[name] || {}).status || "stopped"; },
      // Display status: an "interrupted" bridge is one that stopped WITHOUT a
      // deliberate Stop (host restart / external kill). It's the same backend status
      // as "stopped" (intentional_stop tells them apart), but reads + acts differently:
      // amber + Resume-forward, vs a neutral "you stopped this" -> Start.
      displayStatus(name) {
        const i = this.instances[name] || {};
        const s = i.status || "stopped";
        return (s === "stopped" && i.intentional_stop === false) ? "interrupted" : s;
      },
      statusLabel(name) { return STATUS_LABELS[this.displayStatus(name)] || "Stopped"; },
      statusBadgeClass(name) { return STATUS_BADGE[this.displayStatus(name)] || "bg-secondary-lt"; },
      statusDotClass(name) { return STATUS_DOT[this.displayStatus(name)] || "bg-secondary"; },
      // A one-line "why" + nudge for the two recoverable, you-didn't-end-it states.
      statusNote(name) {
        const s = this.displayStatus(name);
        if (s === "interrupted") return "Ended without a Stop (host restart or external exit) — Resume to continue.";
        if (s === "crashed") return "The bridge exited unexpectedly — Resume to continue.";
        return null;
      },
      // Hover hint on the status badge — what each state means (the recoverable
      // states reuse statusNote so the wording stays in one place).
      statusTitle(name) {
        const s = this.displayStatus(name);
        return {
          running: "The bridge is live and managing sessions.",
          starting: "The bridge is launching…",
          stopping: "The bridge is shutting down…",
          stopped: "Stopped — Resume the prior session or start a new one.",
          interrupted: this.statusNote(name),
          crashed: this.statusNote(name),
          error: "The bridge failed to start — see the detail below.",
        }[s] || null;
      },
      isRunning(name) { return this.statusOf(name) === "running"; },
      isBusy(name) { return this.statusOf(name) === "starting"; },
      isStopping(name) { return this.statusOf(name) === "stopping"; },
      sessionUrlOf(name) { return (this.instances[name] || {}).session_url || null; },
      envUrlOf(name) { return (this.instances[name] || {}).url || null; },
      errorOf(name) { return this.errors[name] || null; },
      // A stopped/crashed bridge that still has an environment can reconnect to it —
      // show "Resume" instead of "Start" and reuse its stored permission mode.
      isResumable(name) {
        const i = this.instances[name] || {};

      hostedStatusBadge(status) {
        const map = { running: "bg-green-lt", starting: "bg-blue-lt", stopping: "bg-yellow-lt",
                      stopped: "bg-secondary-lt", crashed: "bg-red-lt", error: "bg-red-lt" };
        return Object.hasOwn(map, status) ? map[status] : "bg-secondary-lt";
      },
      // Status-dot colour for a hosted row — mirrors STATUS_DOT so browser/desktop/detached
      // rows present status the same way (dot + capitalized text), not a dotless lowercase pill.
      hostedStatusDot(status) {
        const map = { running: "bg-green", starting: "bg-azure status-dot-animated",
                      stopping: "bg-orange status-dot-animated", stopped: "bg-secondary",
                      crashed: "bg-yellow", error: "bg-red" };
        return Object.hasOwn(map, status) ? map[status] : "bg-secondary";
      },
      async startHosted() {
        const f = this.hostedForm;
        if (!f.project || f.busy) return;
        f.busy = true;
        try {
          const res = await fetch(ROOT + "/api/instances", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: "hosted", project: f.project, permission_mode: f.permission_mode }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            this.toast("hosted session started", "success");
            await this.refresh();
            if (b && b.claustrum_process_id) this.openHosted(b.claustrum_process_id);  // watch it immediately
          } else {
            this.toast("hosted start failed — " + (b.detail || res.status), "error");
          }
        } catch (e) { this.toast("hosted start failed", "error"); }
        f.busy = false;
      },
      async stopHosted(h) {
        const id = h.claustrum_process_id;
        if (!window.confirm("Stop hosted session \"" + (h.label || id) + "\"?")) return;
        this.hostedStopping[id] = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id), { method: "DELETE" });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) this.toast("hosted session stopped", "success");
          else { const b = await res.json().catch(() => ({})); this.toast("stop failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("stop failed", "error"); }
        this.hostedStopping[id] = false;
        this.closeHosted(id);
        await this.refresh();
      },
      // Kill an orphaned survivor (CL-8): terminate the live agent + clear the row.
      // Same DELETE endpoint as stop; the server kills the survivor pid when there's
      // no live session rather than refusing.
      async killHosted(h) {
        const id = h.claustrum_process_id;
        if (!window.confirm("Kill the orphaned session \"" + (h.label || id) + "\"? This terminates the surviving agent.")) return;
        this.hostedStopping[id] = true;
        let killed = false;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id), { method: "DELETE" });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) { killed = true; this.toast("orphaned session killed", "success"); }
          else { const b = await res.json().catch(() => ({})); this.toast("kill failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("kill failed", "error"); }
        this.hostedStopping[id] = false;
        // Only tear down the view on a successful kill; a failed kill leaves the orphan
        // actionable (refresh re-fetches its row so it stays in the list).
        if (killed) this.closeHosted(id);
        await this.refresh();
      },
      async resumeHosted(h) {
        const id = h.claustrum_process_id;
        this.hostedResuming[id] = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) + "/resume",
                                  { method: "POST" });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          const b = await res.json().catch(() => ({}));
          if (res.ok) {
            this.toast("hosted session resumed", "success");
            await this.refresh();
            // Resume spawns a fresh process id under a new card; tear down the dead
            // session's view/WS, then watch the resumed session.
            this.closeHosted(id);
            if (b && b.claustrum_process_id) this.openHosted(b.claustrum_process_id);
          } else {
            this.toast("resume failed — " + (b.detail || res.status), "error");
          }
        } catch (e) { this.toast("resume failed", "error"); }
        this.hostedResuming[id] = false;
      },
      toggleHosted(id) {
        const v = this.hostedView[id];
        if (v && v.open) this.closeHosted(id); else this.openHosted(id);
      },
      // Open (or reconnect) the live stream, resuming from the last event we rendered
      // so a reload / dropped link catches up via ?after= without re-dumping the ring.
      openHosted(id) {
        // Idempotent + token-bound (mirrors openLogs): retire any prior socket first, then
        // bind THIS socket's handlers to its own `view`, checked against the live
        // hostedView[id] by a per-view TOKEN. So a Hide→View race or a stale reconnect can't
        // leave two sockets streaming into one view (duplicating the transcript), and a
        // retired socket's late onmessage/onclose can't touch the fresh view. The new view
        // carries the prior events/input/cursor forward.
        //
        // The retire check compares the token, NOT the object reference: assigning `view`
        // into Alpine's reactive `this.hostedView` wraps it in a Proxy, so
        // `this.hostedView[id] !== view` (raw vs Proxy) is ALWAYS true and would drop every
        // frame — and disable the onclose reconnect/ended path. Comparing the token survives
        // the Proxy.
        const prev = this.hostedView[id];
        if (prev) {
          prev.open = false;
          if (prev.ws) { try { prev.ws.close(); } catch (e) {} }
        }
        const after = prev ? prev.lastSeq : 0;
        const token = ++this._hostedSeq;
        const view = { open: true, ws: null, token, lastSeq: after, events: prev ? prev.events : [],
                       input: prev ? prev.input : "", sending: false, connLost: false,
                       ended: false, endedReason: "" };
        this.hostedView[id] = view;
        const self = this;
        // Resolve the LIVE view as the reactive proxy (or null if retired). Return the proxy
        // `w` — not the raw `view` — so handlers mutate THROUGH Alpine's reactivity and the
        // panel repaints immediately; mutating the raw `view` bypasses the Proxy set-traps and
        // the "link dropped" banner would only surface on the next reactive flush (the 4s
        // poll). The token compare survives the Proxy where object identity would not.
        const liveView = () => {
          const w = self.hostedView[id];
          return w && w.open && w.token === token ? w : null;
        };
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const url = proto + "://" + location.host + ROOT + "/ws/hosted/" +
                    encodeURIComponent(id) + "?after=" + after;
        const ws = new WebSocket(url);
        ws.onmessage = (ev) => {
          if (!liveView()) return;  // a retired socket → ignore (_renderHostedEvent re-reads the proxy)
          let e; try { e = JSON.parse(ev.data); } catch (_) { return; }
          self._renderHostedEvent(id, e);
        };
        ws.onclose = () => {
          const w = liveView();
          if (!w) return;  // deliberate close / retired → don't reconnect
          if (w.ended) return;        // a terminal frame already settled the view
          // Only reconnect a session the snapshot still reports as live. A stopped /
          // crashed / gone session closes the socket immediately (server 1008); blindly
          // reconnecting it loops forever and mislabels a dead session "reconnecting…".
          // The 4s /api/hosted poll keeps `hosted` fresh, so this converges.
          const h = self.hosted.find((x) => x.claustrum_process_id === id);
          if (!h || !["running", "starting"].includes(h.status)) {
            self._markHostedEnded(id, h);
            return;
          }
          w.connLost = true;          // through the proxy → the "link dropped" banner repaints
          setTimeout(() => { const w2 = self.hostedView[id]; if (w2 && w2.token === token && w2.open) self.openHosted(id); }, 1500);
        };
        this.hostedView[id].ws = ws;
      },
      closeHosted(id) {
        const v = this.hostedView[id];
        if (!v) return;
        v.open = false;  // before close(), so the onclose handler sees it as intentional
        if (v.ws) { try { v.ws.close(); } catch (e) {} }
      },
      // Surface a terminal hosted session in the live view: explain why it ended (with the
      // server's error_detail when present) and stop the reconnect loop. Resume (when the
      // session kept its uuid) stays the recovery path, shown on the row above.
      _markHostedEnded(id, h, fallback) {
        const v = this.hostedView[id];
        if (!v) return;
        v.ended = true;
        v.connLost = false;
        if (!v.endedReason) v.endedReason = this._hostedEndedReason(h, fallback);
      },
      // Lead with whatever best explains the end: the snapshot's status phrasing, else a
      // streamed exit/lost frame's text (`fallback`), else a generic line. Either way we
      // still append the snapshot's error_detail + Resume hint — so a terminal frame that
      // beats the 4s poll doesn't lose the richer reason the snapshot already carries.
      _hostedEndedReason(h, fallback) {
        const phrasing = {
          stopped: "Session stopped.",
          crashed: "The session crashed.",
          error: "The session ended with an error.",
          interrupted: "Session interrupted.",
          exited: "Session ended.",
        };
        const base = (h && phrasing[h.status]) || fallback ||
          (h ? "This session is no longer live." : "This session is no longer available.");
        const detail = h && h.error_detail ? " " + h.error_detail : "";
        const resume = h && h.claude_session_uuid ? " Use Resume above to continue it." : "";
        return base + detail + resume;
      },
      _renderHostedEvent(id, e) {
        const v = this.hostedView[id];
        if (!v) return;
        if (typeof e.event_seq === "number") { v.lastSeq = e.event_seq; v.connLost = false; }
        // A terminal frame means the session is over: gate the composer and stop the
        // reconnect loop (its renderable marker/error item still gets pushed below).
        // Route through _markHostedEnded with the snapshot row so error_detail + the
        // Resume hint survive a frame that beats the poll; the frame text is the fallback.
        if (e.type === "exit" || e.type === "lost") {
          const fallback = e.type === "lost"
            ? "Stream lost — " + (e.reason || "the daemon connection dropped.")
            : "Session ended" + (e.exit_code != null ? " (exit " + e.exit_code + ")." : ".");
          this._markHostedEnded(id, this.hosted.find((x) => x.claustrum_process_id === id), fallback);
        }
        // A resolution flips the matching parked-permission item; it adds no new line.
        if (e.type === "control_resolved") {
          this._resolveHostedPermission(id, e.request_id, e.behavior);
          this.$nextTick(() => this.scrollHosted(id));
          return;
        }
        for (const it of this._hostedEventToItems(e)) v.events.push(it);
        if (v.events.length > MAX_LOG_LINES) v.events.splice(0, v.events.length - MAX_LOG_LINES);
        this.$nextTick(() => this.scrollHosted(id));
      },
      _resolveHostedPermission(id, requestId, behavior) {
        const v = this.hostedView[id];
        if (!v) return;
        for (const it of v.events) {
          if (it.kind === "permission" && it.request_id === requestId) {
            it.resolved = true;
            it.decision = ["allow", "deny", "interrupted"].includes(behavior) ? behavior : "answered";
          }
        }
      },
      // Translate one fanned event into renderable conversation items (per the design
      // doc's frame table: gap → "output lost (N frames)", lost → error, etc.).
      _hostedEventToItems(e) {
        switch (e.type) {
          case "frame": return this._hostedFrameToItems(e.frame || {});
          case "control_request": {
            const req = e.request || {};
            let input = "";
            if (req.input != null) { try { input = JSON.stringify(req.input); } catch (_) { input = ""; } }
            return [{ kind: "permission", request_id: e.request_id, subtype: e.subtype || "",
                      tool: req.tool_name || "", input, resolved: false, decision: null }];
          }
          case "control_ack": return [];  // MCP handshake; nothing user-facing
          case "stderr": case "text": return [{ kind: "stderr", text: e.text || "" }];
          case "exit":
            return [{ kind: "marker", text: "session ended" + (e.exit_code != null ? " (exit " + e.exit_code + ")" : "") }];
          case "lost": return [{ kind: "error", text: "stream lost: " + (e.reason || "daemon connection dropped") }];
          case "gap": {
            const n = e.dropped != null ? e.dropped
                    : (e.to_seq != null && e.from_seq != null ? e.to_seq - e.from_seq - 1 : null);
            return [{ kind: "gap", text: "output lost" + (n != null ? " (" + n + " frames)" : "") }];
          }
          default: return [];
        }
      },
      _hostedFrameToItems(frame) {
        const t = frame.type;
        if (t === "system") return [{ kind: "marker", text: "· " + (frame.subtype || "system") + " ·" }];
        if (t === "result") {
          const txt = (typeof frame.result === "string" && frame.result) ? frame.result : "(turn complete)";
          return [{ kind: "result", text: txt }];
        }
        if (t === "assistant" || t === "user") {
          const content = (frame.message || {}).content;
          const items = [];
          if (typeof content === "string") {
            if (content.trim()) items.push({ kind: "msg", role: t, text: content });
          } else if (Array.isArray(content)) {
            for (const block of content) {
              if (!block || typeof block !== "object") continue;
              if (block.type === "text" && block.text) items.push({ kind: "msg", role: t, text: block.text });
              else if (block.type === "tool_use")
                items.push({ kind: "tool", name: block.name || "tool", input: block.input != null ? JSON.stringify(block.input) : "" });
              else if (block.type === "tool_result") {
                let txt = block.content;
                if (Array.isArray(txt)) txt = txt.map((b) => (b && b.text) ? b.text : "").join("");
                if (typeof txt !== "string") txt = "";
                items.push({ kind: "toolresult", text: txt });
              }
            }
          }
          return items;
        }
        return [];  // unknown frame type — ignore rather than dump raw
      },
      scrollHosted(id) {
        const el = document.getElementById("hosted-stream-" + id);
        if (el) el.scrollTop = el.scrollHeight;
      },
      async sendHosted(id) {
        const v = this.hostedView[id];
        if (!v || v.sending) return;
        const text = (v.input || "").trim();
        if (!text) return;
        v.sending = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) + "/message", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) { v.input = ""; }
          else { const b = await res.json().catch(() => ({})); this.toast("send failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("send failed", "error"); }
        v.sending = false;
      },
      // Answer a parked tool-permission request (CL-5). Optimistically flips the item
      // on success; the control_resolved event confirms it (idempotent).
      async respondHosted(id, requestId, decision) {
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) +
                                  "/permissions/" + encodeURIComponent(requestId), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ decision }),
          });
          if (res.status === 401) { window.location.assign(ROOT + "/login"); return; }
          if (res.ok) { this._resolveHostedPermission(id, requestId, decision); }
          else { const b = await res.json().catch(() => ({})); this.toast("permission " + decision + " failed — " + (b.detail || res.status), "error"); }
        } catch (e) { this.toast("permission " + decision + " failed", "error"); }
      },
      // --- log streaming ---
      toggleLogs(name) {
        const s = this.logs[name];
        if (s && s.open) { this.closeLogs(name); } else { this.openLogs(name); }
      },
      openLogs(name) {
        // Idempotent + state-bound: retire any prior state first, then bind THIS socket's
        // handlers to its own `state` object (identity-checked against the live this.logs[name]).
        // So a reconnect (the Reconnect button re-calls this) can't leave two tails streaming
        // into one view, and a retired socket's late onmessage/onclose can't append to — or flip
        // `lost` on — the fresh panel.
        const prev = this.logs[name];
        if (prev) {
          prev.open = false;
          if (prev.ws) { try { prev.ws.close(); } catch (e) {} }
        }
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const url = proto + "://" + location.host + ROOT + "/ws/bridge-log/" + encodeURIComponent(name);
        const state = { open: true, ws: null, lines: [], pending: [], paused: false, lost: false };
        this.logs[name] = state;
        const self = this;
        const ws = new WebSocket(url);
        ws.onmessage = (ev) => {
          if (!state.open || self.logs[name] !== state) return;  // a retired socket → ignore
          state.lost = false;  // a frame arrived → the tail is live again
          if (state.paused) {
            state.pending.push(ev.data);
            if (state.pending.length > MAX_PENDING) state.pending.splice(0, state.pending.length - MAX_PENDING);
            return;
          }
          state.lines.push(ev.data);
          if (state.lines.length > MAX_LOG_LINES) state.lines.splice(0, state.lines.length - MAX_LOG_LINES);
          self.$nextTick(() => self.scrollLog(name));
        };
        // A dropped socket (bridge stopped/died, server 1008 close, network blip) leaves the
        // panel showing a frozen tail; mark it lost so the panel surfaces the disconnect. Bound
        // to `state` + identity-checked, so a retired socket can't flip the fresh panel, and
        // closeLogs() clears `open` first so an intentional close never trips this.
        const lost = () => { if (state.open && self.logs[name] === state) state.lost = true; };
        ws.onerror = lost;
        ws.onclose = lost;
        state.ws = ws;
      },
      closeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.open = false;  // before close(), so the onclose `lost` handler sees it as intentional
        if (s.ws) { try { s.ws.close(); } catch (e) {} }
      },
      pauseLogs(name) { if (this.logs[name]) this.logs[name].paused = true; },
      resumeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.lines.push(...s.pending); s.pending = [];
        if (s.lines.length > MAX_LOG_LINES) s.lines.splice(0, s.lines.length - MAX_LOG_LINES);
        s.paused = false;
        this.$nextTick(() => this.scrollLog(name));
      },
      scrollLog(name) {
        const el = document.getElementById("log-" + name);
        if (el) el.scrollTop = el.scrollHeight;
      },
      jumpToLatest(name) { this.scrollLog(name); },
    };
  }

  function reaper() {
    return {
      open: false, loading: false, loaded: false, error: null,
      ghosts: [], total: 0, liveDirs: 0, busy: false, result: null, deleteTyped: "",
      toggle() { this.open = !this.open; if (this.open && !this.loaded) this.load(); },
      summary() {
        if (!this.ghosts.length) return "No ghost environments — nothing to reap.";
        return this.ghosts.length + " ghost(s) · " + this.liveDirs +
          " live dir(s) kept · cloud Default never touched";
      },
      async load() {
        this.loading = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/ghosts");
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "failed to scan"; }
          else { this.ghosts = body.ghosts || []; this.total = body.total; this.liveDirs = body.live_dirs; }
        } catch (e) { this.error = String(e); }
        finally { this.loaded = true; this.loading = false; }
      },
      async _reap(action, confirm) {
        this.busy = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/reap", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action, confirm, ids: this.ghosts.map((g) => g.id) }),
          });
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "reap failed"; return; }
          const errs = Object.keys(body.errors || {}).length;
          const msg = "✓ " + action + "d " + body.reaped.length + " environment(s)" +
            (body.skipped.length ? " · skipped " + body.skipped.length : "") +
            (errs ? " · " + errs + " error(s)" : "");
          this.deleteTyped = "";
          await this.load();
          this.result = msg;
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; }
      },
      archive() { this._reap("archive", "archive"); },
      del() { if (this.deleteTyped === "DELETE") this._reap("delete", "DELETE"); },
    };
  }
</script>
