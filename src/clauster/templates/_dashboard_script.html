<script nonce="{{ csp_nonce }}">
  const STATUS_LABELS = {
    starting: "Starting", running: "Running", stopping: "Stopping", stopped: "Stopped",
    interrupted: "Interrupted", crashed: "Crashed", error: "Failed to start",
  };
  // Amber = recoverable, you didn't end it (interrupted/crashed -> Resume). Red = you
  // must intervene (error: never started -> fix config). Grey = you stopped it.
  const STATUS_BADGE = {
    running: "bg-green-lt", starting: "bg-azure-lt", stopping: "bg-orange-lt",
    interrupted: "bg-yellow-lt", crashed: "bg-yellow-lt", error: "bg-red-lt",
    // Resting state: no fill. A filled pill is reserved for states that need
    // attention (running/error/interrupted) so a wall of grey pills doesn't read
    // as "everything is flagged"; stopped is just quiet text + its dot.
    stopped: "bg-transparent text-secondary px-1",
  };
  const STATUS_DOT = {
    running: "bg-green", starting: "bg-azure status-dot-animated", stopping: "bg-orange status-dot-animated",
    interrupted: "bg-yellow", crashed: "bg-yellow", error: "bg-red", stopped: "bg-secondary",
  };
  const ROOT = "{{ request.scope.root_path }}";
  const MAX_LOG_LINES = 1000;
  const MAX_PENDING = 1000;   // cap the paused-log buffer so it can't grow without bound
  const MAX_TAIL_TURNS = 1000;  // cap tailRaw so a long-running live-tail doesn't grow the array unbounded
  // Reconnect delay + consecutive-failure cap shared by both live streams: the bridge-log tail
  // (openLogs) and the hosted live-view (openHosted). Both auto-reconnect a dropped socket after
  // LOG_RECONNECT_MS while the bridge/session still reads live, and both give up after
  // MAX_LOG_RECONNECTS consecutive failures so a permanently-dead socket stops retrying. A streamed
  // frame resets each stream's counter, so a genuinely-healthy stream reconnects without limit.
  const LOG_RECONNECT_MS = 1500;
  const MAX_LOG_RECONNECTS = 5;  // give up auto-reconnect after this many consecutive failures (CodeRabbit)
  // Live pty-screen view (#534): fixed geometry MUST match the keeper's pyte render
  // (pty_screen.SCREEN_COLS/SCREEN_ROWS) — the wire carries no resize negotiation.
  const PTY_COLS = 120;
  const PTY_ROWS = 40;
  // name -> { term, ws, token, host, fit }. Deliberately OUTSIDE the Alpine component: an
  // xterm.js Terminal is a large stateful object and must never be wrapped in Alpine's
  // reactive Proxy (it would break its internals and thrash reactivity; cf. #310/#315). Only
  // the lightweight {open,status,error} lifecycle lives in Alpine state (this.ptyScreen).
  const _ptyScreens = {};
  // Client-side fit (#641): the wire geometry stays a fixed PTY_COLS x PTY_ROWS — instead of
  // negotiating a resize, we shrink the rendered terminal with a CSS transform so the fixed
  // grid fits the panel width on narrow viewports (never magnify past 1 — keeps glyphs crisp).
  function _fitPtyScreen(reg) {
    if (!reg || !reg.host) return;
    const inner = reg.host.querySelector(".xterm");  // the terminal's own root element
    if (!inner) return;
    // The intrinsic fixed-grid pixel size lives on .xterm-screen — xterm sets an explicit
    // px width/height there (`screenElement.style.width = canvas.width`). The .xterm root is a
    // plain block with no width, so it stretches to the host and its offsetWidth is NOT the grid
    // width — measuring it would compute scale~=1 and the grid would clip under overflow:hidden.
    const screen = reg.host.querySelector(".xterm-screen");
    if (!screen) return;  // not laid out yet — a later fit (first frame / resize) will catch it
    const naturalW = screen.offsetWidth;
    const naturalH = screen.offsetHeight;
    if (!naturalW || !naturalH) return;
    // Scale the whole terminal (.xterm) from its top-left. Clear any prior transform before
    // recomputing — transforms don't affect the offsetWidth measured above, but this avoids
    // leaving a stale scale on the early-return paths below (e.g. avail <= 0).
    inner.style.transform = "";
    inner.style.transformOrigin = "top left";
    // Pin .xterm to the intrinsic grid width so it doesn't stretch as a block element to fill
    // the host's content box when scale=1 (wide viewport). Without this, .xterm grows wider than
    // .xterm-screen (the canvas), leaving a dark background strip to the right of the grid (#673).
    inner.style.width = naturalW + "px";
    // Available width is the host's content box (clientWidth already excludes its padding).
    const cs = getComputedStyle(reg.host);
    const avail = reg.host.clientWidth -
      (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    if (avail <= 0) return;
    const scale = Math.min(1, avail / naturalW);  // shrink-to-fit only; never upscale
    inner.style.transform = scale < 1 ? "scale(" + scale + ")" : "";
    // Reserve the scaled grid height. The host is border-box (Tabler's * reset), so style.height
    // sets the total box including padding — add both top and bottom padding so the content area
    // available inside the host equals exactly naturalH*scale. Without this the padding eats into
    // the content area and clips the bottom rows of the terminal (#673).
    const padTop = parseFloat(cs.paddingTop) || 0;
    const padBottom = parseFloat(cs.paddingBottom) || 0;
    reg.host.style.height = Math.ceil(naturalH * scale) + padTop + padBottom + "px";
  }
  const PROJECT_NAMES = [{% for p in projects %}{{ p.name | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}];
  const INITIAL_TRUST = { {% for p in projects %}{{ p.name | tojson }}: {{ p.trust_state.value | tojson }}{% if not loop.last %}, {% endif %}{% endfor %} };
  const DEFAULT_SPAWN_MODE = {{ default_spawn_mode | tojson }};
  const DEFAULT_PERMISSION_MODE = {{ default_permission_mode | tojson }};
  const DEFAULT_RESUME_MODE = {{ default_resume_mode | tojson }};
  // Canonical permission-mode labels (#685): the single server-injected source of truth
  // ({mode: {short, long, effect}}) shared with the launch <select> and the config editor.
  // permLabel()/permissionEffect() read from THIS map — no second hand-maintained copy.
  const PERMISSION_LABELS = {{ permission_labels | tojson }};
  const USAGE_MODE = {{ usage_mode | tojson }};  // usage.mode — "cost" | "tokens" | "off"
  const CURRENCY = {{ currency | tojson }};  // usage.currency — code, shown in the tooltip
  const CURRENCY_SYMBOL = {{ currency_symbol | tojson }};  // resolved symbol for cost mode
  const FX_RATE = {{ fx_rate | tojson }};  // usage.fx_rate — static USD->display multiplier
  const TOKENS_INCLUDE_CACHE = {{ token_total_includes_cache | tojson }};  // count cache in the total?
  const METRICS_ENABLED = {{ metrics_enabled | tojson }};  // metrics.enabled — live CPU/mem/disk line
  const METRICS_SHOW_DISK = {{ metrics_show_disk | tojson }};  // metrics.show_disk — disk-rate part
  const METRICS_POLL_MS = {{ metrics_poll_ms | tojson }};  // metrics.poll_seconds × 1000
  const CLAUSTRUM_ENABLED = {{ claustrum_enabled | tojson }};  // claustrum.enabled — hosted live-view channel
  const JSON_HEADERS = Object.freeze({ "Content-Type": "application/json" });
  const CONFIG_MASK = "********";  // config-write redaction sentinel; leave in place to keep the stored value
  // Browser (Web Notifications) channel (#541): the master switch + the per-event
  // toggles the client honours on a polled bridge status transition. crash/ready/stop
  // are the transitions the client can observe from /api/instances without a server push.
  const BROWSER_NOTIFICATIONS_ENABLED = {{ browser_notifications_enabled | tojson }};
  const BROWSER_NOTIFY = {
    crash: {{ browser_notify_on_crash | tojson }},
    ready: {{ browser_notify_on_ready | tojson }},
    stop: {{ browser_notify_on_stop | tojson }},
  };
  // Pre-selected launch mode. Always the stable safe default ("desktop" — the
  // Desktop/bridge launch), never auto-flipped to the experimental hosted
  // ("browser") channel even when claustrum is enabled (#686). Browser stays
  // available + experimental-badged in launchModes(), just not the default pick.
  const DEFAULT_LAUNCH_MODE = "desktop";

  // Humanize a token count for the compact badge (1.2M / 3.4k); the exact value
  // lives in the tooltip (usageTitle).
  function fmtTokens(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  // Theme toggle (navbar) — persisted, mirrors the no-flash init above.
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    function sync() {
      var dark = document.documentElement.getAttribute("data-bs-theme") === "dark";
      btn.querySelector(".icon-sun").style.display = dark ? "none" : "inline-block";
      btn.querySelector(".icon-moon").style.display = dark ? "inline-block" : "none";
    }
    btn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      localStorage.setItem("clauster-theme", next);
      sync();
    });
    sync();
  });

  function dashboard() {
    return {
      // CSP build (#533): the expression evaluator resolves bare identifiers ONLY against
      // the component data-stack (no window fallback), so script-level consts referenced
      // from DIRECTIVES must be surfaced as component state under a scoped name.
      projectNames: PROJECT_NAMES,
      instances: {},          // project -> its STANDARD bridge row (or an optimistic placeholder)
      ptySessions: [],        // interactive (pty) session rows, N per project (#779)
      _byId: {},              // rk -> row, across both collections (key-aware lookups)
      ptyPending: {},         // project -> true while a pty launch awaits its first row (#779)
      externalSessions: {},
      trackedSessions: {},  // instance id (project) -> live working sessions under its bridge (#570)
      bridgeSessOpen: {},   // instance id -> true while its multi-session list is expanded (#570)
      externalOpen: {},   // project name -> true while its external-session detail is expanded
      adoptableProjects: [],  // names whose external session is a standard bridge we can adopt (#330)
      // --- in-app config editor (FE-3, Tier-A allowlist) ---
      configEditor: {
        open: false, loading: false, saving: false, restarting: false,
        fields: {}, specs: {}, edits: {}, editable: [], hash: null,
        error: "", saved: false, trigger: null, gen: 0,
      },
      configQuery: "",
      // --- Claude Code config management (#773) — the first UI over the gated ---
      // --- /api/config-write/* surfaces. Distinct from configEditor above, which ---
      // --- edits clauster.yml; this manages the host's Claude Code config. ---
      // Every write is type-the-name confirmed (configMgmtConfirmToken) and secrets
      // are server-masked. `gen` drops a stale in-flight load/save when the scope,
      // project, or surface changes under it (the configEditor single-flight idiom).
      configMgmt: {
        open: false, loading: false, saving: false, error: "", saved: false,
        scope: "project", project: "", surface: "claude-md",
        confirm: "", trigger: null, gen: 0,
        claudeMd: { content: "", orig: "", hash: null, exists: false },
        settings: {
          text: "", orig: "", hash: null,
          showEffective: false, effective: null, effectiveError: "",
          // #765: a friendly key/value editor for the `env` map layered over the
          // raw JSON. In rows mode `envRows` is the source of truth for `env`; the
          // raw text stays the escape hatch for every other key. `envSeq` mints a
          // stable per-row id so x-for keys on identity, not array index.
          mode: "rows", envRows: [], envError: "", envSeq: 0,
        },
        // JSON surfaces sharing _loadJsonSurface/_saveJsonSurface (#773 slice B).
        permissions: { text: "", orig: "", hash: null },
        hooks: { text: "", orig: "", hash: null },
        // Subagents (#773 slice C): a list surface (list + per-agent markdown editor),
        // user/project only, with read-only built-ins/plugins.
        subagents: {
          list: [], editing: false, isNew: false,
          name: "", content: "", orig: "", hash: null,
          // `busy` is derived from `ops` (a concurrent-op counter) so an early op's
          // finally can't clear it while another subagent request is still in flight.
          confirm: "", busy: false, ops: 0, deletingName: "",
        },
        // MCP servers (#773 slice D): a list surface — the {name: entry} map edited
        // per-entry as JSON, add/edit/delete across all three scopes via the
        // secret-safe per-server POST. Project `.mcp.json` servers also carry
        // approval state (which committed servers Claude may use), managed inline.
        mcp: {
          list: [], hash: null,
          editing: false, isNew: false,
          name: "", entryText: "", orig: "",
          confirm: "", busy: false, ops: 0, deletingName: "",
          approvals: {
            enabled: [], disabled: [], orig: "", loading: false,
            confirm: "", busy: false, ops: 0, resetConfirm: "", resetBusy: false,
          },
        },
        // Skills (#773 slice E): a list surface — user/project skill directories,
        // list/view/add/edit/delete. v1 edits SKILL.md only (no supporting scripts),
        // so the extra script-confirm token is never needed. Same ops-counter idiom
        // as subagents. Plugin/built-in skills are not in this list (not editable).
        skills: {
          list: [], editing: false, isNew: false,
          name: "", content: "", orig: "", hash: null,
          confirm: "", busy: false, ops: 0, deletingName: "",
        },
        // Plugins + marketplaces (#773 slice F): a CLI-driven list surface, all three
        // scopes. Two panels — installed plugins (enable/disable/update/uninstall +
        // install) and marketplaces (add/remove/update). Every action is a single POST
        // gated on the shared scope-token `confirm`; install carries an EXTRA strong
        // confirm (retype the exact plugin id). Actions are stateless (no dirty-toggle
        // state to clobber); `busy` covers each action THROUGH its post-action reload.
        plugins: {
          list: [], marketplaces: [],
          confirm: "",                       // scope-token confirm, shared by all actions
          installId: "", installConfirm: "", // install form: plugin id + strong retype-id
          addSource: "",                     // marketplace add: source (url / owner/repo / path)
          busy: false, ops: 0,
        },
      },
      // Surface tabs — all eight #773 slices (claude-md, settings, permissions, hooks,
      // mcp, subagents, skills, plugins) are present. Data-driven so nav + views stay in sync.
      configMgmtSurfaces: [
        { key: "claude-md", label: "CLAUDE.md" },
        { key: "settings", label: "Settings" },
        { key: "permissions", label: "Permissions" },
        { key: "hooks", label: "Hooks" },
        { key: "mcp", label: "MCP" },
        { key: "subagents", label: "Subagents" },
        { key: "skills", label: "Skills" },
        { key: "plugins", label: "Plugins" },
      ],
      // Surfaces that edit ONE document via the shared footer confirm+Save. List
      // surfaces (subagents, later MCP/skills/plugins) drive their own inline controls.
      configMgmtDocSurfaces: ["claude-md", "settings", "permissions", "hooks"],
      // Surfaces WITHOUT a project-local scope (Claude Code has no local dir for them).
      configMgmtNoLocalSurfaces: ["subagents", "skills"],
      // --- read-only transcript viewer (#431) ---
      // order: "desc" (newest-first, default) | "asc" (oldest-first) — sort toggle (#612).
      // q: in-message substring filter; queryTooShort drives the "keep typing" state (#612).
      transcripts: {
        open: false, loading: false, loadingMore: false,
        project: "", sessions: [],
        session: "", turns: [], total: 0, nextCursor: null,
        error: "", trigger: null, gen: 0,
        order: "desc", q: "", queryTooShort: false,
        // --- live-tail (#614 Part 2): follow a running session's transcript ---
        // SINGLE-LIST design (#614 Part 2 follow-up): a live session is ONE unified,
        // tailing transcript — there is NO separate "live tail" box. `turns` is the one
        // rendered list. For a LIVE session it's DERIVED (search-filtered + sorted) from
        // `tailRaw`, the canonical oldest-first master the poll loop appends to; new
        // turns land per the CURRENT sort (top when newest-first, bottom when oldest-
        // first), the active search filter is honored, and a "following live" badge rides
        // the one list's header. For a non-live (ended) session, `turns` stays the paged
        // backend result (cursor pagination), untouched.
        //
        // live: the session maps to a running bridge/agent/hosted session;
        // tailRaw: oldest-first master of every turn (pre-open history + live), each
        //   stamped with a monotonic _key (stable x-for key, not the index — #720);
        // tailOffset: byte offset to poll from next; tailGen: per-session tail token
        //   (so a stale in-flight poll for an old session is dropped); tailKey: the
        //   monotonic _key counter; _tailTimer + tailBusy: the single-flight poll lock.
        live: false, tailRaw: [], tailOffset: 0, tailGen: 0, tailKey: 0,
        tailBusy: false, tailError: "", tailTruncated: false, _tailTimer: null,
        // Scoped mirror of MAX_TAIL_TURNS: directives must reference component state, not
        // a bare script global — the CSP Alpine build (issue 533) can't resolve globals.
        maxTailTurns: MAX_TAIL_TURNS,
      },
      agents: [],
      agentForm: { project: "", prompt: "", cloud: false, busy: false },
      agentStopping: {},   // job id -> true while a stop request is in flight
      agentResuming: {},   // job id -> true while a resume request is in flight (#336)
      forgetting: {},      // bridge/hosted id -> true while a forget request is in flight
      launching: {},       // project name -> true while a launch is in flight (double-submit guard)
      // --- hosted live-view sessions (claustrum stream-json channel, CL-4c) ---
      hosted: [],                 // GET /api/hosted snapshot (channel="hosted" instances)
      hostedForm: { project: "", permission_mode: DEFAULT_PERMISSION_MODE, busy: false },
      hostedStopping: {},         // hosted id -> true while a stop is in flight
      hostedResuming: {},         // hosted id -> true while a resume is in flight
      hostedView: {},             // hosted id -> { open, ws, token, lastSeq, events[], input, sending, connLost, attempts }
      _hostedSeq: 0,              // monotonic token per opened hosted live-view (retire check; see openHosted)
      errors: {},
      qrOpen: {},
      qrNonce: {},
      logs: {},
      ptyScreen: {},   // project -> { open, status, error } — live pty-screen lifecycle (#534)
      _ptySeq: 0,      // monotonic token per opened pty-screen view (retire check; see openPtyScreen)
      spawnMode: {},
      permMode: {},
      resumeMode: {},
      // project name -> operator-typed custom bridge/session display name (#780,
      // standard/Server Mode only — blank keeps the project-name default).
      customName: {},
      // project name -> per-launch sandbox toggle (#780, standard/Server Mode only):
      // "default" (send nothing) | "on" (--sandbox) | "off" (--no-sandbox).
      sandboxMode: {},
      // Resume picker (#303, pty/Interactive Session only): project name -> the picked
      // past-conversation uuid ("" = fresh conversation; reset on every popover open
      // and after each launch so a stale pick can never silently fork a later spawn),
      // and project name -> the pickable past sessions (from /transcripts, non-live,
      // with at least one turn).
      resumeSessionId: {},
      resumableSessions: {},
      confirmBypass: {},
      bypassTyped: {},
      confirmTrust: {},
      trustConfirmed: {},   // the "I trust…" checkbox in the trust-on-start dialog
      confirmMcp: {},       // #851: interactive-launch MCP-approval soft-block gate (name -> shown)
      mcpOverride: {},      // #851: name -> operator chose "Launch anyway" past the soft-block
      mcpBlockUntilReloaded: {},  // #858: name -> post-write readiness refresh failed; fail closed
      cmd: {},
      usage: {},
      sortMeta: {},       // project name -> {last_used: iso|null, cost_usd: float|null}; Zone 1 sort (lazy)
      preflight: {},      // project name -> per-project preflight result ({ok, checks}); lazy-loaded
      preflightOpen: {},  // project name -> true while its preflight-warning detail is expanded
      metrics: {},        // project name -> live CPU/mem/disk sample (null when not running)
      trustState: {},     // project name -> 'trusted' | 'untrusted' (reactive; no reload on trust)
      trusting: {},       // project name -> bool (trust request in flight)
      toasts: [],
      _toastSeq: 0,
      _logSeq: 0,          // monotonic token per opened log tail (retire check; see openLogs)
      connLost: false,    // polling has failed repeatedly -> data is stale
      _refreshFails: 0,
      _refreshing: false,    // single-flight guard for refresh()
      _refreshQueued: false,  // a refresh requested while one was in flight -> run one trailing
      np: { open: false, name: "", submittedName: "", mode: "create", url: "", shallow: false,
            gitInit: false, busy: false, error: null, warn: null,
            cloning: false, confirmCancel: false, reattached: false,
            progress: { percent: null, phase: "" } },
      // System-readiness (preflight) — the `clauster doctor` checks surfaced in the
      // browser so a precondition (claude not logged in, dir untrusted, …) is visible
      // up front instead of failing silently when you click Start. loaded stays false
      // until /api/doctor answers, so the panel never flashes empty.
      readiness: { loaded: false, ok: true, checks: [], showAll: false, showPanel: false },
      // #838: runtime claude account login state, refreshed by loadLoginStatus() on its
      // OWN path (the cache-only /api/login-status endpoint, decoupled from refresh() so
      // neither its latency nor a subprocess ever stalls the core poll). `known` stays
      // false until a response has included the field (an unauthenticated/failed response
      // omits it) — the header pill only renders once known AND logged out, so it never
      // flashes a false "not logged in".
      claudeLogin: { known: false, ok: true, expiresAt: null },
      activeFilter: "all",   // Zone 2 unified-list filter: all | browser | desktop | detached
      projectFilter: "",     // Zone 1 search box
      showAllProjects: false, // Zone 1: reveal projects beyond the cap
      projectSort: "name",   // Zone 1 sort (FE-2): name (default, no reorder) | last-used | cost
      projectRanks: {},      // project name -> rank int for the 6-row cap + CSS flex `order`; always populated after the first sort (name = A–Z positions, non-name = the chosen key) — do NOT clear on name sort (that caused #585b)
      // First-run orientation card (#692): shown on the empty dashboard until the
      // operator dismisses it. The dismissal persists in localStorage so a fresh
      // self-hoster sees the "what this is / how to start" card exactly once.
      // Read once at construction (mirrors the theme-persistence pattern above);
      // a malformed/blocked store falls back to "not dismissed" (fail open here is
      // harmless — worst case the card shows again).
      orientationDismissed: (function () {
        try { return localStorage.getItem("clauster-orientation-dismissed") === "1"; }
        catch (e) { return false; }
      })(),
      // Hide the orientation card and remember the dismissal across reloads.
      dismissOrientation() {
        this.orientationDismissed = true;
        try { localStorage.setItem("clauster-orientation-dismissed", "1"); }
        catch (e) { /* storage blocked/full — the in-memory flag still hides it this session */ }
      },
      // --- CSP-friendly wrappers (#533): replace inline expressions that the ---
      // --- @alpinejs/csp build forbids (arrow fns, nested prop assigns, .then). ---
      // Focus the modal close button after mount. Replaces:
      //   x-init="$nextTick(() => $el.querySelector('.btn-close')?.focus())"
      focusModalClose(el) {
        this.$nextTick(() => { const b = el.querySelector(".btn-close"); if (b) b.focus(); });
      },
      // Toggle the readiness panel open/closed. Replaces:
      //   @click="readiness.showPanel = !readiness.showPanel"
      toggleReadinessPanel() { this.readiness.showPanel = !this.readiness.showPanel; },
      // Toggle showAll within the readiness panel. Replaces:
      //   @click="readiness.showAll = !readiness.showAll"
      toggleReadinessAll() { this.readiness.showAll = !this.readiness.showAll; },
      // Close the readiness panel. Replaces:
      //   @click="readiness.showPanel = false"
      closeReadinessPanel() { this.readiness.showPanel = false; },
      // Clear both np.error and np.warn (name / type-radio inputs). Replaces:
      //   @input="np.error = null; np.warn = null"
      clearNpErrors() { this.np.error = null; this.np.warn = null; },
      // Clear only np.error (git-URL input). Replaces:
      //   @input="np.error = null"
      clearNpError() { this.np.error = null; },
      // Open the new-project panel in create or clone mode. Replaces:
      //   @click="np.open = true; np.mode = 'create'"  /  np.mode = 'clone'
      openNewProject(mode) { this.np.open = true; this.np.mode = mode; },
      // Returns true when the config editor has no visible fields (all filtered out).
      // Replaces the .some(s => ...) arrow fn in the x-show directive.
      configHasVisibleFields() {
        return this.configSections().some((s) => this.configFieldsVisible(s).length > 0);
      },
      // Focus the trust checkbox after the trust gate opens. Replaces:
      //   x-effect="if (confirmTrust[name]) $nextTick(() => $refs.trustCheck && ...focus())"
      focusTrustCheck(active, refs) {
        if (active) this.$nextTick(() => { if (refs.trustCheck) refs.trustCheck.focus(); });
      },
      // Focus the bypass input after the bypass gate opens. Replaces:
      //   x-effect="if (confirmBypass[name]) $nextTick(() => $refs.bypassInput && ...focus())"
      focusBypassInput(active, refs) {
        if (active) this.$nextTick(() => { if (refs.bypassInput) refs.bypassInput.focus(); });
      },
      // #851: move focus into the MCP-approval soft-block when it opens (WCAG 2.4.3 / 4.1.3)
      // — the Run button hides while the gate shows, so focus would otherwise orphan on <body>.
      focusMcpBlock(active, refs) {
        if (active) this.$nextTick(() => { if (refs.mcpResolveBtn) refs.mcpResolveBtn.focus(); });
      },
      async init() {

      // --- #765: friendly env key/value rows over settings.json -------------------

      // the raw JSON stays the escape hatch for every OTHER key (model / misc). The
      // saved text is DERIVED from the rows (_settingsEnvSerialized) at dirty-check
      // and save time rather than synced on every keystroke — x-model keeps the rows
      // reliable, and nothing races Alpine's render scheduler. The ******** mask
      // sentinel round-trips unchanged (a masked value left alone re-serializes to the

      // Populate envRows from settings.text's `env` map. Returns false (and sets
      // envError) when the text isn't a JSON object or `env` isn't a flat str->str

      _settingsRowsFromText() {
        const s = this.configMgmt.settings;
        let obj;
        try { obj = JSON.parse(s.text || "{}"); }
        catch (e) { s.envError = "Fix the JSON in Raw view before using rows."; return false; }
        if (obj === null || typeof obj !== "object" || Array.isArray(obj)) {
          s.envError = "settings.json must be a JSON object to use rows."; return false;
        }

        if (env !== undefined && (env === null || typeof env !== "object" || Array.isArray(env))) {

        }

          // it silently — send the operator to Raw view instead.
          if (typeof v !== "string") {

          }

      // Re-serialize a settings JSON string through the SAME empty-env normalization
      // the row editor applies on save, so a freshly loaded doc compares equal to its
      // own rows (an on-disk `"env": {}` must not read as an unsaved change). Falls
      // back to the input verbatim for a non-object / unparseable text.
      _settingsNormalize(text) {
        let obj;
        try { obj = JSON.parse(text || "{}"); } catch (e) { return text; }
        if (obj === null || typeof obj !== "object" || Array.isArray(obj)) return text;
        if (obj.env && typeof obj.env === "object" && !Array.isArray(obj.env)
            && Object.keys(obj.env).length === 0) {

      // Serialize the current rows back over settings.text's `env`, preserving every
      // OTHER key. Pure (no state mutation) so it's safe to call from configMgmtDirty
      // on every render. Blank-key rows are dropped; a later duplicate key wins (a
      // non-blocking hint is shown by configMgmtEnvRowsWarning).
      _settingsEnvSerialized() {
        const s = this.configMgmt.settings;
        let obj;
        // Fail closed: if the base text can't be read as a JSON object we cannot safely
        // preserve the non-env keys (model / misc), so signal "can't serialize" (null)
        // rather than rebuilding from {} and silently dropping them. In rows mode the
        // text was proven parseable on entry, so this is defense-in-depth for the
        // dirty-check + save callers.
        try { obj = JSON.parse(s.text || "{}"); } catch (e) { return null; }
        if (obj === null || typeof obj !== "object" || Array.isArray(obj)) return null;
        const env = {};
        for (const row of s.envRows) {
          const k = (row.key || "").trim();
          if (k) env[k] = row.value;

        else delete obj.env;  // an emptied editor removes the key rather than writing {}
        return JSON.stringify(obj, null, 2);

      configMgmtAddEnvRow() {

      configMgmtDirty() {

        // Settings in rows mode: the rows are the source of truth, so compare their

        if (c.surface === "settings" && c.settings.mode === "rows") {

          // `env` (dropped on serialize) doesn't read as a phantom unsaved change. A
          // null serialization (unusable base text) can't be compared → treat as not
          // dirty so Save stays disabled (fail closed).
          const ser = this._settingsEnvSerialized();

      _configMgmtTarget() {

      async _saveClaudeMd(myGen) {

      // Shared JSON-surface saver: parse + validate the editor as a JSON object, PUT it

      async _saveJsonSurface(surface, myGen) {

      configMgmtNewAgent() {

      },

      // cases (ß, Turkish İ). Acceptable here: this only affects the transient live
      // filter; the ended/static path runs the backend casefold scan.
      _liveMatch(turn) {

      // --- live-tail poll loop (#614 Part 2) -----------------------------------

      // responsive without hammering the disk-walk endpoint (the bridge appends in
      // bursts, not per-token), and it's single-flight so a slow poll never stacks.
      TRANSCRIPT_TAIL_POLL_MS: 3000,

      // in-flight poll's response is dropped. Leaves the rendered list (and tailRaw
      // master) in place — the user can still read what arrived — but never appends more.
      _stopTranscriptTail() {
        const t = this.transcripts;
        t.tailGen = (t.tailGen || 0) + 1;  // void any in-flight poll
        if (t._tailTimer) { clearTimeout(t._tailTimer); t._tailTimer = null; }

      // first poll reads from offset 0 so tailRaw mirrors the whole live transcript
      // oldest-first; subsequent polls advance by the server-returned byte offset. The
      // rendered `turns` is derived from tailRaw via _rebuildLiveTurns after each delta.
      _startTranscriptTail() {
        const t = this.transcripts;
        this._stopTranscriptTail();           // clear any prior loop + buffer state
        t.tailRaw = []; t.tailOffset = 0; t.tailError = ""; t.tailKey = 0; t.tailTruncated = false;
        t.turns = []; t.total = 0; t.nextCursor = null;
        t.tailGen = (t.tailGen || 0) + 1;

      },
      // One single-flight tail poll. `myGen` pins the poll to the session/loop it was
      // scheduled for: if the user switched session or closed the modal mid-fetch, the
      // generation moved and we drop the response (never write into a stale view) and
      // never reschedule. Errors are surfaced (not swallowed) but don't stop the loop.
      async _pollTranscriptTail(myGen) {
        const t = this.transcripts;
        if (t.tailGen !== myGen || t.tailBusy) return;  // superseded or already polling
        t.tailBusy = true;
        try {
          const res = await fetch(ROOT + "/api/projects/" + encodeURIComponent(t.project) +
            "/transcripts/" + encodeURIComponent(t.session) +
            "/tail?offset=" + encodeURIComponent(t.tailOffset));
          if (t.tailGen !== myGen) return;  // session changed / closed mid-fetch — drop it
          if (this._authExpired(res)) return;
          if (!res.ok) { t.tailError = "Live tail interrupted."; return; }
          const d = await res.json();
          if (t.tailGen !== myGen) return;  // re-check after the await on .json()

          // no turns and no reset, so there's nothing new to render.

          // A truncated/rotated file restarts from 0: replace the master (and reset the
          // key counter so the re-read doesn't collide keys), don't append.

            // the positional index (#720) — the rendered list is reordered/filtered, so

            // Front-splice (drop oldest) so the rendered view always shows the newest turns.
            // Surface a visible "showing last N" indicator rather than silently dropping.
            if (t.tailRaw.length > MAX_TAIL_TURNS) {

          // filter/reverse pass (and the new-array-reference key-diff it triggers) on the
          // idle polls that dominate a quiet session.
          if (changed) this._rebuildLiveTurns();

          // delta (already applied above) and stop the loop. Uncapped, the one list stays —
          // it holds the full transcript, so flipping live just swaps the header badge and
          // the (already-derived) `turns` render as the static, complete list. A CAPPED
          // tail can't serve as that "complete" view (the oldest turns were dropped, and
          // hiding the live card hides the truncation banner too), so hand the ended
          // session to the paged backend path instead of leaving a silently-short list.
          if (d.live === false) {

            if (t.tailTruncated) { t.tailTruncated = false; this.loadTranscriptTurnsFromStart(); }

          }

          t.tailError = "Live tail interrupted.";  // surface, never silently stall
        } finally {

          // Reschedule only while this generation is still the active tail loop.
          if (t.tailGen === myGen) {
            t._tailTimer = setTimeout(() => this._pollTranscriptTail(myGen), this.TRANSCRIPT_TAIL_POLL_MS);
          }

      },

        // after start/stop) must NOT be silently dropped — queue ONE trailing refresh so the
        // latest state lands right after the in-flight one completes.
        if (this._refreshing) { this._refreshQueued = true; return; }
        this._refreshing = true;

          const [iRes, sRes, aRes, dRes, tRes] = await Promise.all([
            fetch(ROOT + "/api/instances"),
            fetch(ROOT + "/api/sessions"),
            fetch(ROOT + "/api/agents"),
            fetch(ROOT + "/api/sessions/adoptable"),
            fetch(ROOT + "/api/sessions/tracked"),
          ]);

          if (iRes.ok) {
            const list = await iRes.json();

            // id-keyed collection — a project map would clobber N sessions to one.
            const next = {};

            for (const i of list) {
              this._stamp(i);

            }
            // Preserve a local optimistic "stopping" until the server confirms it's gone.
            for (const n of Object.keys(this.instances)) {

            }

            for (const i of pty) byId[i.rk] = i;

          // multi-session expander only; a failed fetch just collapses to the starter link.
          if (tRes.ok) this.trackedSessions = await tRes.json();
          else { this.trackedSessions = {}; }

          // them when the claustrum channel is configured.

      hostedStatusBadge(status) {

                      crashed: "bg-yellow", error: "bg-red" };

            body: JSON.stringify({ channel: "hosted", project: f.project, permission_mode: f.permission_mode }),
          });

      // Kill an orphaned survivor (CL-8): terminate the live agent + clear the row.

                                  { method: "POST" });

      },
      toggleHosted(id) {
        const v = this.hostedView[id];

      },
      // Open (or reconnect) the live stream, resuming from the last event we rendered
      // so a reload / dropped link catches up via ?after= without re-dumping the ring.
      openHosted(id) {
        // Idempotent + token-bound (mirrors openLogs): retire any prior socket first, then
        // bind THIS socket's handlers to its own `view`, checked against the live
        // hostedView[id] by a per-view TOKEN. So a Hide→View race or a stale reconnect can't
        // leave two sockets streaming into one view (duplicating the transcript), and a
        // retired socket's late onmessage/onclose can't touch the fresh view. The new view
        // carries the prior events/input/cursor forward.
        //
        // The retire check compares the token, NOT the object reference: assigning `view`
        // into Alpine's reactive `this.hostedView` wraps it in a Proxy, so
        // `this.hostedView[id] !== view` (raw vs Proxy) is ALWAYS true and would drop every
        // frame — and disable the onclose reconnect/ended path. Comparing the token survives
        // the Proxy.
        const prev = this.hostedView[id];
        if (prev) {
          prev.open = false;
          if (prev.ws) { try { prev.ws.close(); } catch (e) {} }
        }
        const after = prev ? prev.lastSeq : 0;
        const token = ++this._hostedSeq;
        // Carry the consecutive-reconnect counter forward across an auto-reconnect so the cap
        // below bounds the whole retry burst, not each attempt in isolation (mirrors openLogs).
        const view = { open: true, ws: null, token, lastSeq: after, events: prev ? prev.events : [],
                       nextKey: prev ? (prev.nextKey || 0) : 0,
                       input: prev ? prev.input : "", sending: false, connLost: false,
                       ended: false, endedReason: "", attempts: prev ? prev.attempts : 0 };
        this.hostedView[id] = view;
        const self = this;
        // Resolve the LIVE view as the reactive proxy (or null if retired). Return the proxy
        // `w` — not the raw `view` — so handlers mutate THROUGH Alpine's reactivity and the
        // panel repaints immediately; mutating the raw `view` bypasses the Proxy set-traps and
        // the "link dropped" banner would only surface on the next reactive flush (the 4s
        // poll). The token compare survives the Proxy where object identity would not.
        const liveView = () => {
          const w = self.hostedView[id];
          return w && w.open && w.token === token ? w : null;
        };
        const url = this._wsUrl("/ws/hosted/" +
                    encodeURIComponent(id) + "?after=" + after);
        const ws = new WebSocket(url);
        ws.onmessage = (ev) => {
          const w = liveView();
          if (!w) return;  // a retired socket → ignore (_renderHostedEvent re-reads the proxy)
          w.attempts = 0;  // a frame arrived → reset the retry cap; a healthy stream reconnects without limit
          let e; try { e = JSON.parse(ev.data); } catch (_) { return; }
          self._renderHostedEvent(id, e);
        };
        ws.onclose = () => {
          const w = liveView();
          if (!w) return;  // deliberate close / retired → don't reconnect
          if (w.ended) return;        // a terminal frame already settled the view
          // Only reconnect a session the snapshot still reports as live. A stopped /
          // crashed / gone session closes the socket immediately (server 1008); blindly
          // reconnecting it loops forever and mislabels a dead session "reconnecting…".
          // The 4s /api/hosted poll keeps `hosted` fresh, so this converges.
          const h = self.hosted.find((x) => x.claustrum_process_id === id);
          if (!h || !["running", "starting"].includes(h.status)) {
            self._markHostedEnded(id, h);
            return;
          }
          // Cap consecutive failed reconnects: if the snapshot still reads "running" but the socket
          // keeps closing (a stale poll after the session died, or a server that 1008s every attempt),
          // give up after MAX_LOG_RECONNECTS instead of looping forever — mirrors openLogs. A streamed
          // frame (onmessage) resets the counter, so a genuinely-healthy stream reconnects without limit.
          // Give-up surfaces via _markHostedEnded (the "no longer live" banner) — the hosted analog of
          // the bridge-log tail's give-up `lost` banner.
          if (w.attempts >= MAX_LOG_RECONNECTS) {
            self._markHostedEnded(id, h);
            return;
          }
          w.attempts += 1;
          w.connLost = true;          // through the proxy → the "link dropped" banner repaints
          setTimeout(() => { const w2 = self.hostedView[id]; if (w2 && w2.token === token && w2.open) self.openHosted(id); }, LOG_RECONNECT_MS);
        };
        this.hostedView[id].ws = ws;
      },
      closeHosted(id) {
        const v = this.hostedView[id];
        if (!v) return;
        v.open = false;  // before close(), so the onclose handler sees it as intentional
        if (v.ws) { try { v.ws.close(); } catch (e) {} }
      },
      // Surface a terminal hosted session in the live view: explain why it ended (with the
      // server's error_detail when present) and stop the reconnect loop. Resume (when the
      // session kept its uuid) stays the recovery path, shown on the row above.
      _markHostedEnded(id, h, fallback) {
        const v = this.hostedView[id];
        if (!v) return;
        v.ended = true;
        v.connLost = false;
        if (!v.endedReason) v.endedReason = this._hostedEndedReason(h, fallback);
      },
      // Lead with whatever best explains the end: the snapshot's status phrasing, else a
      // streamed exit/lost frame's text (`fallback`), else a generic line. Either way we
      // still append the snapshot's error_detail + Resume hint — so a terminal frame that
      // beats the 4s poll doesn't lose the richer reason the snapshot already carries.
      _hostedEndedReason(h, fallback) {
        const phrasing = {
          stopped: "Session stopped.",
          crashed: "The session crashed.",
          error: "The session ended with an error.",
          interrupted: "Session interrupted.",
          exited: "Session ended.",
        };
        const base = (h && phrasing[h.status]) || fallback ||
          (h ? "This session is no longer live." : "This session is no longer available.");
        const detail = h && h.error_detail ? " " + h.error_detail : "";
        const resume = h && h.claude_session_uuid ? " Use Resume above to continue it." : "";
        return base + detail + resume;
      },
      _renderHostedEvent(id, e) {
        const v = this.hostedView[id];
        if (!v) return;
        if (typeof e.event_seq === "number") { v.lastSeq = e.event_seq; v.connLost = false; }
        // A terminal frame means the session is over: gate the composer and stop the
        // reconnect loop (its renderable marker/error item still gets pushed below).
        // Route through _markHostedEnded with the snapshot row so error_detail + the
        // Resume hint survive a frame that beats the poll; the frame text is the fallback.
        if (e.type === "exit" || e.type === "lost") {
          const fallback = e.type === "lost"
            ? "Stream lost — " + (e.reason || "the daemon connection dropped.")
            : "Session ended" + (e.exit_code != null ? " (exit " + e.exit_code + ")." : ".");
          this._markHostedEnded(id, this.hosted.find((x) => x.claustrum_process_id === id), fallback);
        }
        // A resolution flips the matching parked-permission item; it adds no new line.
        if (e.type === "control_resolved") {
          this._resolveHostedPermission(id, e.request_id, e.behavior);
          this.$nextTick(() => this.scrollHosted(id));
          return;
        }
        // Stamp a stable, monotonic key so the x-for keys on item identity, not list
        // position — the MAX_LOG_LINES front-splice below shifts every index otherwise,
        // and an index key would rebind nodes to the wrong events (the Alpine key gotcha).
        for (const it of this._hostedEventToItems(e)) { it._key = v.nextKey++; v.events.push(it); }
        if (v.events.length > MAX_LOG_LINES) v.events.splice(0, v.events.length - MAX_LOG_LINES);
        this.$nextTick(() => this.scrollHosted(id));
      },
      _resolveHostedPermission(id, requestId, behavior) {
        const v = this.hostedView[id];
        if (!v) return;
        for (const it of v.events) {
          if (it.kind === "permission" && it.request_id === requestId) {
            it.resolved = true;
            it.decision = ["allow", "deny", "interrupted"].includes(behavior) ? behavior : "answered";
          }
        }
      },
      // Translate one fanned event into renderable conversation items (per the design
      // doc's frame table: gap → "output lost (N frames)", lost → error, etc.).
      _hostedEventToItems(e) {
        switch (e.type) {
          case "frame": return this._hostedFrameToItems(e.frame || {});
          case "control_request": {
            const req = e.request || {};
            let input = "";
            if (req.input != null) { try { input = JSON.stringify(req.input); } catch (_) { input = ""; } }
            return [{ kind: "permission", request_id: e.request_id, subtype: e.subtype || "",
                      tool: req.tool_name || "", input, resolved: false, decision: null }];
          }
          case "control_ack": return [];  // MCP handshake; nothing user-facing
          case "stderr": case "text": return [{ kind: "stderr", text: e.text || "" }];
          case "exit":
            return [{ kind: "marker", text: "session ended" + (e.exit_code != null ? " (exit " + e.exit_code + ")" : "") }];
          case "lost": return [{ kind: "error", text: "stream lost: " + (e.reason || "daemon connection dropped") }];
          case "gap": {
            const n = e.dropped != null ? e.dropped
                    : (e.to_seq != null && e.from_seq != null ? e.to_seq - e.from_seq - 1 : null);
            return [{ kind: "gap", text: "output lost" + (n != null ? " (" + n + " frames)" : "") }];
          }
          default: return [];
        }
      },
      _hostedFrameToItems(frame) {
        const t = frame.type;
        if (t === "system") return [{ kind: "marker", text: "· " + (frame.subtype || "system") + " ·" }];
        if (t === "result") {
          // The result frame echoes the final assistant text the `assistant` frame
          // already rendered — re-rendering it double-printed every reply (#591). Keep
          // it only for the error path, where `result` carries text no assistant frame
          // emits (e.g. "Not logged in · Please run /login"); a success collapses to a
          // turn-boundary marker. `is_error` is the SDK's canonical error flag on the
          // result message and the ONLY reliable gate — subtype reads "success" even on
          // auth failure, so we key off is_error. A falsy is_error always means `result`
          // is the assistant-text duplicate (rate-limit / quota / teardown errors all set
          // is_error: true), so collapsing it never drops a user-facing error.
          if (frame.is_error) {
            const txt = (typeof frame.result === "string" && frame.result) ? frame.result : "turn failed";
            return [{ kind: "error", text: txt }];
          }
          return [{ kind: "marker", text: "· turn complete ·" }];
        }
        if (t === "assistant" || t === "user") {
          const content = (frame.message || {}).content;
          const items = [];
          if (typeof content === "string") {
            if (content.trim()) items.push({ kind: "msg", role: t, text: content });
          } else if (Array.isArray(content)) {
            for (const block of content) {
              if (!block || typeof block !== "object") continue;
              if (block.type === "text" && block.text) items.push({ kind: "msg", role: t, text: block.text });
              else if (block.type === "tool_use")
                items.push({ kind: "tool", name: block.name || "tool", input: block.input != null ? JSON.stringify(block.input) : "" });
              else if (block.type === "tool_result") {
                let txt = block.content;
                if (Array.isArray(txt)) txt = txt.map((b) => (b && b.text) ? b.text : "").join("");
                if (typeof txt !== "string") txt = "";
                items.push({ kind: "toolresult", text: txt });
              }
            }
          }
          return items;
        }
        return [];  // unknown frame type — ignore rather than dump raw
      },
      scrollHosted(id) {
        const el = document.getElementById("hosted-stream-" + id);
        if (el) el.scrollTop = el.scrollHeight;
      },
      async sendHosted(id) {
        const v = this.hostedView[id];
        if (!v || v.sending) return;
        const text = (v.input || "").trim();
        if (!text) return;
        v.sending = true;
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) + "/message", {
            method: "POST", headers: JSON_HEADERS, body: JSON.stringify({ text }),
          });

          if (res.ok) { v.input = ""; }
          else { const b = await res.json().catch(() => ({})); this.toast("send failed — " + this._errDetail(res, b), "error"); }
        } catch (e) { this._failToast("send"); }
        // reset on EVERY path incl. the 401 early-return so the input can't wedge (#336 pattern; fixes #401).
        finally { v.sending = false; }
      },
      // Answer a parked tool-permission request (CL-5). Optimistically flips the item
      // on success; the control_resolved event confirms it (idempotent).
      async respondHosted(id, requestId, decision) {
        try {
          const res = await fetch(ROOT + "/api/instances/" + encodeURIComponent(id) +
                                  "/permissions/" + encodeURIComponent(requestId), {
            method: "POST", headers: JSON_HEADERS,
            body: JSON.stringify({ decision }),
          });
          if (this._authExpired(res)) return;
          if (res.ok) { this._resolveHostedPermission(id, requestId, decision); }
          else { const b = await res.json().catch(() => ({})); this.toast("permission " + decision + " failed — " + this._errDetail(res, b), "error"); }
        } catch (e) { this.toast("permission " + decision + " failed", "error"); }
      },
      // --- log streaming ---
      toggleLogs(name) {
        const s = this.logs[name];
        if (s && s.open) { this.closeLogs(name); } else { this.openLogs(name); }
      },
      openLogs(name, manual = false) {
        // `manual` = an operator click on Reconnect (vs. the auto-reconnect re-entry below).
        // A manual retry resets the consecutive-failure counter so the give-up cap can't make
        // the Reconnect button a no-op: once auto-reconnect hits MAX_LOG_RECONNECTS the carried
        // `attempts` would otherwise re-trip the cap on the very first onclose, so the button
        // looked dead even after the bridge's tail was reachable again (#584).
        // Idempotent + state-bound: retire any prior state first, then bind THIS socket's
        // handlers to its own `state` object (identity-checked against the live this.logs[name]).
        // So a reconnect (the Reconnect button re-calls this) can't leave two tails streaming
        // into one view, and a retired socket's late onmessage/onclose can't append to — or flip
        // `lost` on — the fresh panel.
        const prev = this.logs[name];
        if (prev) {
          prev.open = false;
          if (prev.ws) { try { prev.ws.close(); } catch (e) {} }
        }
        const logId = this._requireBridgeId(name);
        if (!logId) return;
        const url = this._wsUrl("/ws/bridge-log/" + encodeURIComponent(logId));
        // Tag this tail with a unique token; the retire check below compares the token, NOT
        // object identity — once Alpine wraps `state` in a reactive Proxy, comparing the raw
        // object against the stored proxy is ALWAYS unequal and would drop every frame (see
        // liveState() below, which returns the proxy so handlers mutate through reactivity).
        const token = ++this._logSeq;
        // Carry the prior tail's lines/buffer forward across a reconnect (auto-reconnect below,
        // or the Reconnect button) so a transient drop doesn't blank the panel — mirrors the
        // hosted view, which carries its events forward on reopen.
        const state = { open: true, ws: null, token,
                        lines: prev ? prev.lines : [], pending: prev ? prev.pending : [],
                        paused: prev ? prev.paused : false, lost: false, reconnecting: false,
                        attempts: (prev && !manual) ? prev.attempts : 0 };
        this.logs[name] = state;
        const self = this;
        // Resolve the LIVE tail as the reactive proxy (or null if retired). The token compare
        // (not object identity) survives the Proxy wrap; returning the proxy `s` — not the raw
        // `state` — means the handlers below mutate THROUGH Alpine's reactivity, so each frame
        // renders immediately. Mutating the raw `state` instead bypasses the Proxy set-traps and
        // the tail would only repaint on the next unrelated reactive flush (the 4s poll). This
        // matches closeLogs/pauseLogs/resumeLogs, which already mutate the proxy.
        const liveState = () => {
          const s = self.logs[name];
          return s && s.open && s.token === token ? s : null;
        };
        const ws = new WebSocket(url);
        ws.onmessage = (ev) => {
          const s = liveState();
          if (!s) return;  // a retired socket → ignore
          s.lost = false;  // a frame arrived → the tail is live again
          s.reconnecting = false;
          s.attempts = 0;  // reset the retry cap — a healthy tail reconnects without limit
          if (s.paused) {
            s.pending.push(ev.data);
            if (s.pending.length > MAX_PENDING) s.pending.splice(0, s.pending.length - MAX_PENDING);
            return;
          }
          s.lines.push(ev.data);
          if (s.lines.length > MAX_LOG_LINES) s.lines.splice(0, s.lines.length - MAX_LOG_LINES);
          self.$nextTick(() => self.scrollLog(name));
        };
        // A dropped socket (network blip, an idle proxy/tunnel reaping a quiet WS, bridge death)
        // used to strand the panel on a "disconnected" banner needing a manual Reconnect. Instead,
        // if the bridge is still live, auto-reconnect after a short delay so a transient drop
        // self-heals — mirroring the hosted live-view (openHosted). Only when the bridge is
        // actually gone do we surface the "disconnected — may have stopped" banner. Token-checked
        // via liveState() so a retired socket can't touch the fresh panel; closeLogs()/openLogs()
        // clear `open` first so an intentional close never reconnects. onclose always follows
        // onerror, so it alone decides — no separate onerror handler needed.
        ws.onclose = () => {
          const s = liveState();
          if (!s) return;  // deliberate close / retired → don't reconnect
          // Only reconnect a tail whose bridge the snapshot still reports as live; a stopped /
          // crashed / gone bridge stays on the disconnect banner instead of looping forever. The
          // 4s /api/instances poll keeps statusOf() fresh, so this converges either way.
          if (!["running", "starting"].includes(self.statusOf(name))) {
            s.reconnecting = false; s.lost = true; return;
          }
          // Cap consecutive failed reconnects: if the snapshot still reads "running" but the socket
          // keeps closing (a stale poll after the bridge died, or a server that 1008s every attempt),
          // give up after MAX_LOG_RECONNECTS instead of looping until the poll catches up. A streamed
          // frame (onmessage) resets the counter, so a genuinely-healthy tail reconnects indefinitely.
          if (s.attempts >= MAX_LOG_RECONNECTS) {
            s.reconnecting = false; s.lost = true; return;
          }
          s.attempts += 1;
          s.lost = false;
          s.reconnecting = true;  // through the proxy → surfaces "reconnecting…"
          setTimeout(() => {
            const s2 = self.logs[name];
            if (s2 && s2.token === token && s2.open) self.openLogs(name);
          }, LOG_RECONNECT_MS);
        };
        this.logs[name].ws = ws;
      },
      closeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.open = false;  // before close(), so the onclose `lost` handler sees it as intentional
        if (s.ws) { try { s.ws.close(); } catch (e) {} }
      },
      pauseLogs(name) { if (this.logs[name]) this.logs[name].paused = true; },
      resumeLogs(name) {
        const s = this.logs[name];
        if (!s) return;
        s.lines.push(...s.pending); s.pending = [];
        if (s.lines.length > MAX_LOG_LINES) s.lines.splice(0, s.lines.length - MAX_LOG_LINES);
        s.paused = false;
        this.$nextTick(() => this.scrollLog(name));
      },
      scrollLog(name) {
        const el = document.getElementById("log-" + name);
        if (el) el.scrollTop = el.scrollHeight;
      },
      jumpToLatest(name) { this.scrollLog(name); },
      // --- read-only live pty-screen view (#534) ---
      togglePtyScreen(name) {
        const s = this.ptyScreen[name];
        if (s && s.open) { this.closePtyScreen(name); } else { this.openPtyScreen(name); }
      },
      openPtyScreen(name) {
        // Refuse while the row's identity is unminted (start()'s optimistic placeholder):
        // opening a view by NAME could attach to a different, hidden bridge (#778).
        const ptyId = this._requireBridgeId(name);
        if (!ptyId) return;
        // Idempotent: retire any prior view first (close its socket + dispose its terminal),
        // then bind THIS view to a fresh per-name token. The token — not object identity — is
        // what the async handlers check, because Alpine wraps ptyScreen[name] in a reactive
        // Proxy and a raw-object identity compare would always fail (mirrors openLogs/#310/#315).
        this.closePtyScreen(name);
        const token = ++this._ptySeq;
        this.ptyScreen[name] = { open: true, status: "connecting", error: null, token };
        const self = this;
        const live = () => {
          const s = self.ptyScreen[name];
          return s && s.open && s.token === token ? s : null;
        };
        // Defer terminal creation until the host div is in the DOM (the x-if just flipped open).
        this.$nextTick(() => {
          const s = live();
          if (!s) return;  // closed again before we mounted
          const host = document.getElementById("pty-screen-" + name);
          if (!host) return;
          if (typeof Terminal === "undefined") {  // xterm.js failed to load (e.g. blocked asset)
            s.status = "error"; s.error = "terminal component unavailable";
            return;
          }
          const term = new Terminal({
            cols: PTY_COLS, rows: PTY_ROWS, disableStdin: true, cursorBlink: false,
            convertEol: false, scrollback: 0, fontSize: 12,
          });
          term.open(host);
          const url = this._wsUrl("/ws/pty-screen/" + encodeURIComponent(ptyId));
          const ws = new WebSocket(url);
          const reg = { term, ws, token, host, fit: null };
          // Fit the fixed grid to the panel now and on every viewport resize (#641). The
          // listener is stored on the reg so closePtyScreen can detach it — leaking it would
          // keep firing against a disposed terminal. Re-fit is cheap (a transform + measure).
          reg.fit = () => { if (_ptyScreens[name] === reg) _fitPtyScreen(reg); };
          // Debounce the resize listener (~100ms): dragging the window edge fires dozens of
          // events/sec and each fit forces a reflow. Immediate fits below call reg.fit directly.
          reg.onResize = () => {
            if (reg._fitTimer) clearTimeout(reg._fitTimer);
            reg._fitTimer = setTimeout(reg.fit, 100);
          };
          window.addEventListener("resize", reg.onResize);
          _ptyScreens[name] = reg;
          _fitPtyScreen(reg);  // first fit once the terminal element is laid out
          ws.onopen = () => {
            // Advance "connecting" -> "connected" on handshake so an idle session (no immediate
            // frame to push) doesn't sit on "connecting"; onmessage then sets the real frame state.
            const s = live();
            if (s && s.status === "connecting") s.status = "connected";
          };
          ws.onmessage = (ev) => {
            const s = live();
            if (!s) return;  // a retired view → ignore
            const reg = _ptyScreens[name];
            if (!reg || reg.token !== token) return;  // a retired socket → ignore
            let frame;
            try { frame = JSON.parse(ev.data); } catch (e) { return; }  // a torn frame → skip
            s.status = frame.state || "live";
            s.error = frame.error || null;
            const scr = frame.screen;
            if (scr && Array.isArray(scr.rows)) {
              const cur = scr.cursor || { x: 0, y: 0 };
              // Autowrap OFF (\x1b[?7l) so a full-width row never wraps/scrolls; home, overwrite
              // every row (each is exactly PTY_COLS wide, so no clear is needed), then place the
              // cursor. Rows are plaintext cells (no control bytes, redacted server-side), so
              // writing them raw can neither inject ANSI nor leak a masked span.
              const out = "\x1b[?7l\x1b[H" + scr.rows.join("\r\n") +
                          "\x1b[" + ((cur.y | 0) + 1) + ";" + ((cur.x | 0) + 1) + "H";
              try { reg.term.write(out); } catch (e) {}
              // Re-fit once after the first frame: the terminal's intrinsic size is only
              // accurate once it has rendered rows, so the open-time fit can be a hair off.
              if (!reg._fittedOnce) { reg._fittedOnce = true; _fitPtyScreen(reg); }
            }
          };
          ws.onclose = () => {
            const s = live();
            if (!s) return;  // deliberate close / retired → leave status as-is
            if (s.status !== "exited") s.status = "disconnected";  // a clean end already reads "exited"
          };
        });
      },
      closePtyScreen(name) {
        const s = this.ptyScreen[name];
        if (s) s.open = false;  // mark closed first so live() retires any late handler
        const reg = _ptyScreens[name];
        if (reg) {
          if (reg.onResize) { try { window.removeEventListener("resize", reg.onResize); } catch (e) {} }
          if (reg._fitTimer) { try { clearTimeout(reg._fitTimer); } catch (e) {} }
          if (reg.ws) { try { reg.ws.close(); } catch (e) {} }
          if (reg.term) { try { reg.term.dispose(); } catch (e) {} }
          delete _ptyScreens[name];
        }
      },
    };
  }

  // --- projectRow (#533): row-local Alpine component, replacing the inline x-data object.
  // Needed for the CSP build: arrow fns, `if (...) {}` statements, and multi-statement
  // handlers are all rejected by its expression parser, and bare identifiers resolve only
  // against the component data-stack — so the row's inline expressions become named
  // methods here, and the script-level default consts its directives reference are
  // surfaced as scoped state (defaultResumeMode).
  function projectRow(name) {
    return {
      lopen: false,
      lmode: DEFAULT_LAUNCH_MODE,
      lperm: DEFAULT_PERMISSION_MODE,
      lcloud: false,
      lprompt: "",
      mopen: false,
      // Surfaced for the row's x-show directives ((resumeMode[name] || defaultResumeMode)):
      // the CSP evaluator has no window fallback for the bare DEFAULT_RESUME_MODE global.
      defaultResumeMode: DEFAULT_RESUME_MODE,
      // NOTE on `this` in these methods: the CSP evaluator binds every function it
      // resolves from a directive to that element's full merged data-stack
      // (Identifier case: `value2.bind(scope2)`, verified in @alpinejs/csp@3.15.12
      // dist), so parent dashboard() state/methods (confirmTrust, coerceSpawnMode,
      // toggleClaudeMd) are reachable through `this` here.
      // Receive the "launch-pop-close" window event and close the popover for this row.
      // (The old inline handler was an if-statement, which the CSP parser rejects.)
      onLaunchPopClose(event) {
        if (event.detail.name === name) { this.lopen = false; this.mopen = false; }
      },
      // Toggle the launch popover; on open, coerce a non-git worktree default to a
      // valid spawn mode. (Was a two-statement inline handler with an if.)
      toggleLaunchPop(isGitRepo) {
        this.lopen = !this.lopen;
        if (this.lopen) {
          this.coerceSpawnMode(name, isGitRepo);
          this.coercePtySpawn(name);
          // #851: every fresh open starts blocked-by-default — clear any prior gate/override
          // so a past "Launch anyway" never silently carries into a new launch attempt.
          this.confirmMcp[name] = false;
          this.mcpOverride[name] = false;
          // Resume picker (#303): every fresh open starts on "New conversation" — a
          // pick from a previous open must never silently fork into this launch —
          // and the list refreshes in the background for the More-options panel.
          this.resumeSessionId[name] = "";
          this.loadResumableSessions(name);
        }
      },
      // Dismiss the popover (outside-click / Escape) AND clear any pending trust/bypass
      // gate (#686) so a hidden gate never lingers; mopen resets so More options
      // collapses on reopen. (Was a four-statement inline handler.)
      dismissLaunchPop() {
        this.lopen = false;
        this.mopen = false;
        this.confirmTrust[name] = false;
        this.confirmBypass[name] = false;
        this.confirmMcp[name] = false;    // #851: clear the MCP soft-block on dismiss too
        this.mcpOverride[name] = false;
      },
      // Card-menu item: open/close the CLAUDE.md editor, then close the menu. `menu`
      // lives on the card-menu's inline x-data scope, which sits ABOVE this component
      // in the merged stack for the menu-item element, so the write lands there.
      pickClaudeMd() {
        this.toggleClaudeMd(name);
        this.menu = false;
      },
      // bypassPermissions is only offered for desktop launches; leaving another mode with
      // it selected must snap back to the default. Replaces the inline `if (...)` @change
      // handler (the CSP parser has no if-statement support).
      clampPermForMode() {
        if (this.lmode !== "desktop" && this.lperm === "bypassPermissions") {
          this.lperm = DEFAULT_PERMISSION_MODE;
        }
      },
    };
  }

  function reaper() {
    return {
      open: false, loading: false, loaded: false, error: null,
      ghosts: [], total: 0, liveDirs: 0, busy: false, result: null, deleteTyped: "",
      toggle() { this.open = !this.open; if (this.open && !this.loaded) this.load(); },
      summary() {
        if (!this.ghosts.length) return "No leftover environments — nothing to clean up.";
        return this.ghosts.length + " leftover · " + this.liveDirs +
          " live dir(s) kept · cloud Default never touched";
      },
      async load() {
        this.loading = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/ghosts");
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "failed to scan"; }
          else { this.ghosts = body.ghosts || []; this.total = body.total; this.liveDirs = body.live_dirs; }
        } catch (e) { this.error = String(e); }
        finally { this.loaded = true; this.loading = false; }
      },
      async _reap(action, confirm) {
        this.busy = true; this.error = null; this.result = null;
        try {
          const res = await fetch(ROOT + "/api/environments/reap", {
            method: "POST", headers: JSON_HEADERS,
            body: JSON.stringify({ action, confirm, ids: this.ghosts.map((g) => g.id) }),
          });
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "reap failed"; return; }
          const errs = Object.keys(body.errors || {}).length;
          const msg = "✓ " + action + "d " + body.reaped.length + " environment(s)" +
            (body.skipped.length ? " · skipped " + body.skipped.length : "") +
            (errs ? " · " + errs + " error(s)" : "");
          this.deleteTyped = "";
          await this.load();
          this.result = msg;
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; }
      },
      archive() { this._reap("archive", "archive"); },
      del() { if (this.deleteTyped === "DELETE") this._reap("delete", "DELETE"); },
    };
  }

  // Login shepherd (#839): dashboard-driven `claude auth login` / `claude setup-token`,
  // gated by login_shepherd.enabled (server-injected). A single-flight flow — the server
  // rejects a second /start while one is active (409), surfaced here as a plain error.
  function loginShepherd() {
    return {
      open: false, mode: "login", started: false, finished: false, busy: false,
      authorizeUrl: null, output: "", code: "", error: null, result: null, copied: false,
      pending: false, pendingMessage: "", pollTimer: null, rechecking: false,
      toggle() { this.open = !this.open; },
      async start() {
        this.busy = true; this.error = null;
        try {
          const res = await fetch(ROOT + "/api/login-shepherd/start", {
            method: "POST", headers: JSON_HEADERS,
            body: JSON.stringify({ mode: this.mode }),
          });
          const body = await res.json();
          if (!res.ok) { this.error = body.detail || "failed to start"; return; }
          this.authorizeUrl = body.authorize_url; this.output = body.output || "";
          this.started = true;
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; }
      },
      // Apply a /code or /status response: terminal (ok, or ok:false without pending) →
      // finish + stop polling; pending → stay IN-PROGRESS and keep polling.
      _applyResult(body) {
        if (body.pending) {
          this.pending = true; this.pendingMessage = body.message || "Still verifying…";
          this.startPolling();
        } else {
          this.result = body; this.finished = true; this.pending = false;
          this.stopPolling();
        }
      },
      async submitCode() {
        if (!this.code) return;
        this.busy = true; this.error = null;
        try {
          const res = await fetch(ROOT + "/api/login-shepherd/code", {
            method: "POST", headers: JSON_HEADERS,
            body: JSON.stringify({ code: this.code }),
          });
          const body = await res.json();
          this.code = "";  // never keep the pasted code in the DOM/state longer than needed
          if (!res.ok) { this.error = body.detail || "failed to submit code"; return; }
          this._applyResult(body);
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; }
      },
      // Poll the eventual outcome after a `pending` submit. 409 = the flow is gone
      // (completed-and-reaped elsewhere, or cancelled) → stop polling and reset to idle.
      //
      // Two defenses against an overlapping status request clobbering an already-captured
      // terminal result (the one-time setup-token) — the "overlapping poll resets result"
      // race where a slow request lands AFTER another request already finished the flow
      // and reaped it server-side, so this one gets a late 409:
      //   1. Single-flight: `rechecking` skips a call while one is already in flight, so an
      //      interval tick and a manual "Recheck now" can't both hit /status at once.
      //   2. Terminal-wins: if the flow is already `finished`, return early — a late
      //      response (409 or otherwise) must never reset() or drop `result`/the token.
      async recheck() {
        if (this.finished || this.rechecking) return;
        this.rechecking = true;
        this.error = null;
        try {
          const res = await fetch(ROOT + "/api/login-shepherd/status", {
            method: "POST", headers: JSON_HEADERS,
          });
          if (this.finished) return;  // a concurrent path finished the flow while we waited
          if (res.status === 409) {
            if (this.finished) return;  // belt-and-suspenders: never clobber a terminal result
            this.stopPolling(); this.reset(); return;
          }
          const body = await res.json();
          if (this.finished) return;  // re-check after the await — never clobber a terminal result
          if (!res.ok) { this.error = body.detail || "failed to check status"; return; }
          this._applyResult(body);
        } catch (e) { this.error = String(e); }
        finally { this.rechecking = false; }
      },
      startPolling() {
        if (this.pollTimer) return;  // already polling — never stack intervals
        this.pollTimer = setInterval(() => { this.recheck(); }, 3000);
      },
      stopPolling() {
        if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
      },
      async cancel() {
        this.busy = true; this.error = null;
        this.stopPolling();
        try {
          await fetch(ROOT + "/api/login-shepherd/cancel", { method: "POST", headers: JSON_HEADERS });
        } catch (e) { this.error = String(e); }
        finally { this.busy = false; this.reset(); }
      },
      // "Start another" must cancel any still-active server-side flow before resetting
      // local state, so a pending (or already-finished) flow is never orphaned.
      async startAnother() { await this.cancel(); },
      reset() {
        this.stopPolling();
        this.started = false; this.finished = false; this.authorizeUrl = null;
        this.output = ""; this.code = ""; this.result = null; this.error = null;
        this.copied = false; this.pending = false; this.pendingMessage = "";
        this.rechecking = false;
      },
      async copyToken() {
        const text = this.result && this.result.token;
        if (!text) return;
        try {
          if (window.isSecureContext && navigator.clipboard) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text; ta.setAttribute("readonly", "");
            ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          this.copied = true;
          setTimeout(() => { this.copied = false; }, 2000);
        } catch (e) { /* clipboard denied — the value is still selectable/readable inline */ }
      },
    };
  }

  // CSP build (#533): x-data expressions resolve component factories ONLY through the
  // Alpine.data() registry — a bare script-global function is "Undefined variable" to the
  // CSP evaluator and the page would render nothing. This inline script runs before the
  // deferred alpine.csp.min.js, so the listener is registered in time for alpine:init.
  document.addEventListener("alpine:init", () => {
    Alpine.data("dashboard", dashboard);
    Alpine.data("projectRow", projectRow);
    Alpine.data("reaper", reaper);
    Alpine.data("loginShepherd", loginShepherd);
  });
</script>
