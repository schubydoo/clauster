# Alembic config for the clauster persistence layer (#362).
#
# In production this file is loaded by clauster.db.bootstrap, which sets
# script_location to the packaged migrations dir and injects the live engine
# connection via config.attributes -- so no sqlalchemy.url is hardcoded here.
# A developer running `alembic` by hand can set CLAUSTER_DB_URL (env.py reads it).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Use os.pathsep when splitting prepend_sys_path (silences the legacy-split warning).
path_separator = os
# Match the project's 99-col / pep257 style on generated revisions.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
