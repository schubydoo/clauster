# Release automation for clauster — knope (replaces release-please).
#
# Model: CHANGESETS-ONLY. Every user-facing change ships a `.changeset/*.md`
# fragment; those fragments drive BOTH the version bump and the changelog.
# Conventional commits are IGNORED for release purposes (no commit/fragment
# duplication, full section control). See CONTRIBUTING.md for how to write one.
#
# knope replaces only release-please's orchestration (version PR + changelog +
# draft-release creation). The build / Sigstore-sign / actions/attest / publish
# supply chain and release.yml (PyPI + GHCR on the tag) are unchanged.

[package]
versioned_files = [
  "pyproject.toml",                                                            # native
  { path = "src/clauster/__init__.py", regex = '__version__ = "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

# clauster's changelog sections beyond the built-in Features (minor) / Fixes
# (patch) / Breaking changes (major). A custom-typed change is always a `patch`
# bump (knope rule), which matches how these landed under release-please.
extra_changelog_sections = [
  { name = "Performance", types = ["perf"] },
  { name = "Security", types = ["security"] },
  { name = "Build System & Dependencies", types = ["build"] },
]

# Signed dists + standalone binaries + the SLSA provenance bundle are built and
# staged into dist/release-assets/ by the `release` workflow BEFORE `knope
# release` runs. With `assets` set, the Release step creates the GitHub release
# as a DRAFT, uploads every asset one at a time, then un-drafts (publishes) — the
# git tag is created only at publish, so the release locks immutable WITH its
# assets (the #98 invariant). A fail-closed gate in the workflow asserts the full
# signed set is present before knope runs, so a missing target aborts before any
# publish instead of shipping a partial release.
assets = "dist/release-assets/*"

[changes]
ignore_conventional_commits = true   # fragments are the sole source of truth

[github]
owner = "schubydoo"
repo = "clauster"

# --- changelog entry rendering ----------------------------------------------
# Auto-append the PR number to each changelog entry. knope traces the changeset
# file's commit to the PR that introduced it ($pr_number, knope 0.23.0+) — so
# authors write a plain summary and the link is added at release time; nobody
# types a number they don't have yet. Ordered most- to least-specific: knope uses
# the first template whose variables ALL resolve for a given change, so a
# headed/complex changeset keeps its `### + body` shape, a one-line changeset
# renders as a bullet, and either drops the `(#NNN)` suffix when the change isn't
# yet traceable to a committed PR (e.g. a local --dry-run).
[release_notes]
change_templates = [
  "### $summary ([#$pr_number](https://github.com/schubydoo/clauster/pull/$pr_number))\n\n$details",
  "### $summary\n\n$details",
  "- $summary ([#$pr_number](https://github.com/schubydoo/clauster/pull/$pr_number))",
  "- $summary",
]

# --- prepare-release: open/refresh the release PR (run on every push to main) -
# PrepareRelease consumes the .changeset fragments, bumps pyproject.toml +
# src/clauster/__init__.py + CHANGELOG.md, and stages them. We then resync
# uv.lock to the new version, commit, force-push the `release` branch, and
# open/update the release PR. A human merging that PR is the approval gate.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "uv lock"

[[workflows.steps]]
type = "Command"
command = 'git commit -am "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and publishes **v$version**.\n\nGenerated by knope from the `.changeset/` fragments — don't edit it by hand; add or amend a changeset on the source PR instead.\n\n---\n\n$changelog"

# --- release: tag + GitHub Release (run when the release PR merges) -----------
# A single Release step. The workflow has already built + Sigstore-signed the
# dists/binaries and staged them into dist/release-assets/, so this step creates
# the draft, uploads the assets, and publishes. The tag is pushed as the
# clauster-ci App (GITHUB_TOKEN in the job env) so it triggers release.yml.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# --- document-change: scaffold a new changeset fragment (local convenience) ---
# `knope document-change` walks you through creating a .changeset/*.md file.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
