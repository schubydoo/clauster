<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Root 404 handler for the versioned (mike) docs site.

    WHY THIS EXISTS. Before versioning, every page lived at the site root:
    https://schubydoo.github.io/clauster/quickstart/. mike moves them under a
    version directory (/latest/quickstart/), and `mike set-default` only writes a
    root index.html — it rescues `/` and nothing beneath it. Every previously
    published deep link would 404: README links we can rewrite, but also
    bookmarks, Reddit posts, and search results we cannot.

    GitHub Pages serves the repository-root 404.html for any path it cannot
    resolve, so this stub forwards /<path> to /latest/<path>, preserving the
    query string and fragment. The HTTP status stays 404 (Pages cannot rewrite
    it); this rescues humans following a stale link, not crawlers.

    NOT part of the MkDocs build. It is copied to the gh-pages root by the
    "Preserve pre-version deep links" step in .github/workflows/docs.yml, because
    anything inside docs/ would be built into each version directory instead.

    LOOP GUARD. If the first path segment is already a version ("latest", "dev",
    or an X.Y snapshot), the page is genuinely missing and we must NOT redirect —
    otherwise /latest/nope/ would bounce to /latest/latest/nope/ and onward.
  -->
  <title>Page moved — Clauster docs</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
    code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e8e8e8; }
      code { background: #2c2c2c; }
      a { color: #8ab4f8; }
    }
  </style>
  <script>
    (function () {
      var BASE = "/clauster/";
      var path = window.location.pathname;
      if (path.indexOf(BASE) !== 0) { return; }

      var rest = path.slice(BASE.length);
      var first = rest.split("/")[0];

      // Already inside a version directory (or the bare root, which index.html
      // owns) -> a real 404. Redirecting again would loop.
      if (first === "" || first === "latest" || first === "dev" ||
          /^[0-9]+\.[0-9]+$/.test(first)) { return; }

      window.location.replace(
        BASE + "latest/" + rest + window.location.search + window.location.hash
      );
    })();
  </script>
</head>
<body>
  <h1>This page moved</h1>
  <p>
    The Clauster documentation is now versioned. Pages that used to live at the
    site root are under <code>/latest/</code> (the newest release) or
    <code>/dev/</code> (unreleased, built from <code>main</code>).
  </p>
  <p>
    You should be redirected automatically. If not, try
    <a href="/clauster/latest/">the latest documentation</a>.
  </p>
</body>
</html>
