# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration. Schema: https://www.coderabbit.ai/integrations/schema.v2.json
#
# NOTE: this repo-level file OVERRIDES the CodeRabbit web dashboard — configure
# everything here, not in the dashboard (dashboard edits won't take effect).
#
# Docstrings: our gate is ruff's pydocstyle (D) rules, enforced on EVERY PR by the
# "lint" CI job (.github/workflows/lint.yml, `on: pull_request`). It requires
# docstrings on all public modules/classes/functions (pep257 convention; D105/D107
# and tests/** are intentionally exempt — see pyproject.toml). CodeRabbit's separate
# docstring-coverage pre-merge check counts inner/nested helpers our gate exempts,
# so it reports a misleadingly low % against its 80% default — defer to ruff D as
# the single source of truth and turn both CodeRabbit docstring features off.
language: "en-US"
early_access: true

# Calibrated from the repo's nitpick history (~63% high-signal / ~13% noise), and
# squeezed under CodeRabbit's 250-char tone_instructions cap. Encourage the
# substantive categories that paid off; skip what CI already gates.
tone_instructions: >-
  Assertive but high-signal. Prioritize: error handling/silent failures,
  concurrency/lifecycle bugs, Actions/release-workflow correctness, frontend
  state, weak assertions. Skip what CI linters gate (style/lint/format), typos,
  Jinja2-autoescape XSS.

reviews:
  profile: "assertive"
  # Nitpicks — there is NO setting to force them inline (verified vs schema.v2 +
  # empirically on PR #136). CodeRabbit posts a nitpick as an inline, *resolvable*
  # thread whenever it can anchor to a CHANGED line in the diff; the `main` ruleset's
  # required_conversation_resolution then forces resolving each before merge. It only
  # falls back to the collapsed "Nitpick comments" section in the review body for
  # OUT-OF-DIFF lines, which GitHub's review API physically can't anchor as a thread —
  # no config relocates those; treat that section as advisory (it's unchanged code).
  # Auto-approve once CodeRabbit's comments are resolved and no pre-merge checks fail.
  request_changes_workflow: true
  high_level_summary: false
  high_level_summary_placeholder: ""
  high_level_summary_in_walkthrough: true
  review_status: true
  # Publish a pass/fail commit status (becomes a visible gate signal; not a *required*
  # check unless added to the main ruleset).
  fail_commit_status: true
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  pre_merge_checks:
    # See the docstrings note at the top — ruff D is the single source of truth.
    docstrings:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  auto_review:
    enabled: true
    drafts: false
    # Bot PRs (Renovate, release-please) are reviewed, NOT ignored — on purpose. We
    # gate `main` on a required `CodeRabbit` status check (fail_commit_status below);
    # an *ignored* bot PR posts no status, so it would be unmergeable (admins are
    # enforced — no one could override). Reviewing them is cheap (deps / CHANGELOG /
    # version; uv.lock is path-filtered out) and keeps the gate uniform, with no
    # ruleset bypass actors. (No `ignore_usernames` for this reason.)
  # Public repo: flag spam / low-quality drive-by PRs.
  slop_detection:
    enabled: true
  # Don't spend review effort on vendored / generated / lockfile content.
  path_filters:
    - "!src/clauster/static/vendor/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!uv.lock"
    - "!package-lock.json"
  path_instructions:
    - path: "src/clauster/templates/**"
      instructions: >-
        These are Jinja2 templates (autoescape on) driving Alpine.js. Values
        rendered with {{ }} are HTML-escaped by default — don't flag ordinary
        interpolation as XSS. Only raw / `| safe` output, or interpolation into
        event-handler attributes / inline script, is a genuine concern.
    - path: "tests/**"
      instructions: >-
        Tests use FastAPI's TestClient. WebSocket and background-task tests must
        wrap the client in `with _client(...)` so the app lifespan/startup runs.

chat:
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  # Review against our documented conventions, not just generic best-practice.
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
