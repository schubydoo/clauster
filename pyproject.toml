[project]
name = "clauster"
version = "0.1.0.dev0"
description = "Self-hosted web UI for spawning and managing Claude Code remote-control bridges on a remote host."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcus", email = "marcus@schuby.org" }]
keywords = ["claude", "claude-code", "remote-control", "self-hosted", "homelab"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "jinja2-fragments>=1.5",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
eval = [
    # Evaluation tooling only — NOT a committed part of the core stack.
    "logfire>=4.34.0",
]

[project.scripts]
clauster = "clauster.__main__:main"

[project.urls]
Homepage = "https://github.com/schubydoo/clauster"
Repository = "https://github.com/schubydoo/clauster"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
