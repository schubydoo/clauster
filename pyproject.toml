[project]
name = "clauster"
version = "0.1.0.dev0"
description = "Self-hosted web UI for spawning and managing Claude Code remote-control bridges on a remote host."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcus", email = "marcus@schuby.org" }]
keywords = ["claude", "claude-code", "remote-control", "self-hosted", "homelab"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "jinja2-fragments>=1.5",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "psutil>=5.9",
    "segno>=1.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]
eval = [
    # Evaluation tooling only — NOT a committed part of the core stack.
    "logfire>=4.34.0",
]
package = [
    # Standalone-binary builds (see clauster.spec + scripts/build-binary.sh).
    # Built in CI / a full environment, not in the dev sandbox.
    "pyinstaller>=6.0",
]

[project.scripts]
clauster = "clauster.__main__:main"

[project.urls]
Homepage = "https://github.com/schubydoo/clauster"
Repository = "https://github.com/schubydoo/clauster"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage runs by default (pytest-cov is in the dev extra, which the test env needs
# anyway). Gate at 96%; the suite sits at ~97%. The ~52 uncovered lines are
# intentional: best-effort backup OSError swallows (state/trust), poll-loop
# exception guards (runner), and guards unreachable by construction (e.g. a
# name that passes the project-name regex can't escape projects_root).
addopts = "--cov=src/clauster --cov-report=term-missing:skip-covered --cov-fail-under=96"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
