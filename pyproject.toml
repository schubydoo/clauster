[project]
name = "clauster"
version = "1.1.0"
description = "Self-hosted web UI for spawning and managing Claude Code remote-control bridges on a remote host."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "schubydoo", email = "12485317+schubydoo@users.noreply.github.com" }]
keywords = ["claude", "claude-code", "remote-control", "self-hosted", "homelab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "jinja2-fragments>=1.5",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2.7",
    "psutil>=5.9",
    "segno>=1.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "setproctitle>=1.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",  # outbound lifecycle webhooks (#371); lean async client
    "cryptography>=42.0",  # self-signed cert generation (tls.provision = self-signed, issue 674)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    # Linux-only (no Windows/macOS atheris wheels — the marker keeps `uv lock`
    # cross-platform and the Windows/macOS cells green). In `dev` so the fuzz-
    # harness import-smoke test (tests/test_fuzz_harness_smoke.py) actually runs
    # in the default suite on Linux instead of perpetually skipping; it
    # importorskips where atheris is absent.
    #
    # Pinned PER INTERPRETER because atheris's wheel coverage shifts across
    # releases and it ships no sdist for the latest: 3.1.0 has cp312/cp313/cp314
    # wheels but dropped cp311, while 3.0.0 has the cp311 wheel (but no cp314). An
    # unpinned `>=3.0.0` floats to 3.1.0 and then `uv sync` has nothing to install
    # on the 3.11 leg (no wheel, no sdist) — failing CI. So gate by python_version
    # to the newest atheris that has a wheel for each interpreter; the smoke test
    # then runs on every Linux leg instead of skipping on 3.11. Both legs carry an
    # upper bound so a future wheel-gapped release can't silently float in via a lock
    # bump and re-break a leg — raise a ceiling deliberately when atheris re-widens.
    "atheris>=3.0.0,<3.2.0; sys_platform == 'linux' and python_version >= '3.12'",
    "atheris>=3.0.0,<3.1.0; sys_platform == 'linux' and python_version < '3.12'",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6.1",
    # Per-test wall-clock guard. A hung test (e.g. a blocking read/join that never
    # returns on one platform) would otherwise freeze an xdist worker until the CI
    # job's 15-minute cap — a slow, opaque failure. `--timeout` (below) aborts the
    # offending test with an all-thread traceback instead, so a hang fails fast and
    # points at itself.
    "pytest-timeout>=2.3",
    # Rerun a failed test a bounded couple of times before reporting red. Used ONLY by
    # the opt-in browser-e2e leg (scripts/e2e.sh passes --reruns); the required suite
    # never reruns, so this can never mask a real regression there. The e2e leg runs on
    # a 2-core CI runner that starves agent-browser, so a fill/click can stochastically
    # not register (#947) and a downstream wait times out — a different few tests each
    # run, cleared by a fresh re-run. The driver's self-verifying fill fixes the fill
    # class deterministically; --reruns absorbs the residual click/CLI-transient class.
    "pytest-rerunfailures>=14",
    # httpx2 (pydantic's httpx 2.x line, #888): Starlette 1.3+ deprecates plain httpx with
    # its TestClient and auto-uses httpx2 when installed (`import httpx2 as httpx`), so this
    # silences the StarletteDeprecationWarning and moves the test client to the intended
    # backend. Dev-only — the shipped package's outbound-webhook client stays on httpx>=0.27
    # (unifying the production client on httpx2 is a separate follow-up per #888).
    # Floor is >=2.7: 2.5.x signalled TestClient WebSocket disconnect differently, which
    # stopped exercising the pty-screen WS-disconnect handler (a coverage regression #888
    # deferred on); 2.7.0 restores the plain-httpx WebSocketDisconnect behaviour.
    "httpx2>=2.7",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "yamllint>=1.38",
    "pre-commit>=4.0",
    # pyte (live pty-screen view, #534) is an OPTIONAL runtime extra (see `pty` below) but
    # is ALSO listed here so the pty_screen tests run in the default/CI suite and count
    # toward the 96% coverage gate (same pattern as atheris above). `dev` is never bundled
    # into the distributed binary, so listing it here carries no LGPL/relink obligation.
    "pyte>=0.8.2",
]
package = [
    # Standalone-binary builds (see clauster.spec + scripts/build-binary.sh).
    # Built in CI / a full environment, not in the dev sandbox.
    "pyinstaller>=6.0",
    # pip is bundled INTO the binary (clauster.spec `collect_all("pip")`) so the frozen binary
    # can drive `clauster deps install <extra>` in-process (#904 slice 2b). It must be present in
    # the BUILD env for PyInstaller to collect it (uv venvs omit pip by default). Upper-bounded
    # because the side-install uses pip's private `pip._internal.cli.main.main`, which can drift
    # across majors — raise the ceiling deliberately after verifying a new pip against deps.py.
    # Keeping this current / evaluating a switch to bundled-uv is tracked post-1.0 by #935.
    "pip>=24.0,<27",
]
docs = [
    # Build the mkdocs-material documentation site (see mkdocs.yml + docs/).
    # Not needed at runtime; `mkdocs build --strict` / `mkdocs serve` only.
    "mkdocs-material>=9.5",
    # Old-URL redirects for moved/renamed pages: every page move MUST add an entry
    # to `redirect_maps` in mkdocs.yml, or the published URL 404s (`--strict` does
    # NOT catch missing redirects — it only validates internal links).
    # Pinned exactly: 1.2.3 adds a `properdocs` dependency (a second documentation
    # engine in the docs env that injects text into builds) and caps mkdocs<=1.6.1,
    # blocking MkDocs upgrades. Keep 1.2.2 until the maintainer decides otherwise —
    # do not accept a Renovate bump to 1.2.3.
    "mkdocs-redirects==1.2.2",
    # Surfaces the root community-health files (UPGRADING, CHANGELOG, CONTRIBUTING,
    # SUPPORT, SECURITY) on the site while they stay canonical at the repo root.
    "mkdocs-include-markdown-plugin>=6.2",
    # Versioned publishing (#1084): commits each built version to the `gh-pages`
    # branch and drives the Material version selector. Only the Docs workflow's
    # deploy job runs it — `mkdocs build --strict` and `just docs-build` do not,
    # so a local build never touches gh-pages.
    "mike>=2.1",
]
notify = [
    # Outbound crash/lifecycle notifications (see notify.py + notifications.*).
    # Optional: install with `pip install 'clauster[notify]'`. Apprise fans a single
    # call out to Slack/Discord/Telegram/email/etc.
    "apprise>=1.9",
]
pty = [
    # Live read-only pty terminal view (#534): server-side terminal emulation via pyte,
    # rendered to redacted cells for the dashboard's xterm.js panel. Optional — install
    # with `pip install 'clauster[pty]'`.
    #
    # LGPLv3: pyte is deliberately kept OUT of [project.dependencies] and the Apache-2.0
    # standalone PyInstaller binary, so the default distribution carries no (L)GPL relink
    # obligation. clauster imports it LAZILY (pty_screen.py:_import_pyte) and degrades to a
    # clear "install clauster[pty]" error when absent. If a future build ever bundles pyte,
    # add an LGPL THIRD_PARTY_NOTICES entry and honor the relink terms.
    "pyte>=0.8.2",
    # Interactive Session on Windows (#892): the POSIX pty keeper uses os.openpty +
    # termios, absent on Windows, so the keeper drives a ConPTY pseudo-console via
    # pywinpty instead (MIT; ConPTY needs Win10 1803+, with a winpty fallback). win32-only
    # marker — no wheels/meaning elsewhere. Lazily imported (pty_keeper._load_pty_process).
    # Being MIT, nothing *forces* it out of the frozen binary (unlike pyte's LGPL) — but ConPTY
    # reassembles the connect URL via pyte, and the binary ships no extras anyway, so it rides
    # this extra: `pip install 'clauster[pty]'` enables it; the frozen binary falls back to
    # Server Mode. A detect/offer-install flow for the extras is tracked in #904.
    "pywinpty>=2.0; sys_platform == 'win32'",
]
fuzz = [
    # Standalone-fuzzing convenience extra: `uv pip install '.[fuzz]'` then
    # `python fuzz/<name>_fuzzer.py -max_total_time=60`. NB `pty_screen_feed_fuzzer` drives
    # the real PtyScreen and additionally needs the OPTIONAL `pty` extra (pyte) — without it
    # it raises PyteUnavailableError on every input, so use `.[fuzz,pty]` for that one. The
    # same reason `.clusterfuzzlite/build.sh` installs `clauster[pty]`; the licensing
    # rationale for keeping pyte optional lives on the `pty` extra above.
    # atheris is also in `dev`
    # (so the import-smoke test runs in the default suite); this extra keeps the
    # fuzzing dependency discoverable on its own. Marked linux-only — atheris has
    # no Windows/macOS wheels, so an unmarked dep would break cross-platform
    # `uv lock` and the Windows/macOS cells. In CI the OSS-Fuzz base-builder-python
    # image (ClusterFuzzLite) already provides atheris, so build.sh doesn't need this.
    # Per-interpreter pin mirrors `dev` above (3.1.0 dropped cp311; 3.0.0 lacks cp314),
    # including the upper bounds that stop a future wheel-gapped release floating in.
    "atheris>=3.0.0,<3.2.0; sys_platform == 'linux' and python_version >= '3.12'",
    "atheris>=3.0.0,<3.1.0; sys_platform == 'linux' and python_version < '3.12'",
]

[project.scripts]
clauster = "clauster.__main__:main"

[project.urls]
Homepage = "https://github.com/schubydoo/clauster"
Repository = "https://github.com/schubydoo/clauster"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage runs by default (pytest-cov is in the dev extra, which the test env needs
# anyway). Gate at 96%; the suite sits at ~97%. The ~52 uncovered lines are
# intentional: best-effort backup OSError swallows (state/trust), poll-loop
# exception guards (runner), and guards unreachable by construction (e.g. a
# name that passes the project-name regex can't escape projects_root).
# `-n auto` parallelizes across CPU cores (pytest-xdist) — ~40% faster locally and in
# every CI cell. pytest-cov auto-combines per-worker coverage, so the 96% gate is
# unchanged. xdist distributes whole test functions (never splits one), so the
# threading tests (flock serialization, concurrent writers) run intact in one worker.
#
# `--ignore=tests/e2e`: the browser E2E suite (agent-browser, real Chromium against a
# live clauster subprocess) is OPT-IN and NOT part of the default/CI run — it needs a
# browser binary and would skew the coverage gate. Run it with `scripts/e2e.sh`
# (which clears these addopts via `-o addopts=`). Keeping it out of the default run
# leaves the required `tests` gate — and its cost — exactly as it was.
addopts = "-n auto --strict-markers --timeout=90 --timeout-method=thread --cov=src/clauster --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=96 --ignore=tests/e2e"
markers = [
    "real_migration: run the actual Alembic upgrade instead of the template-DB copy",
    "e2e: browser end-to-end test (agent-browser + real Chromium; opt-in, see scripts/e2e.sh)",
    # Static guard over a repo-meta file (.github/**, rulesets, repo-config). These run in the
    # always-on required `lint` job as well as the normal suite, because the `tests` matrix is
    # SKIPPED on a `.github/**`-only PR (see .github/actions/changed-code) — which is exactly
    # the PR these guards exist to police. Marking a new one is enforced by
    # test_ci_change_filter.py::test_every_repo_meta_guard_is_marked.
    "repo_meta: static guard over a repo-meta file; also run in the always-on lint job",
]

[tool.coverage.run]
# templates/ + static/ are bundled data assets, not Python — `--cov=src/clauster`
# would otherwise try to parse the Jinja templates and emit a per-file
# `CoverageWarning: Couldn't parse …` (cosmetic, no effect on the numbers).
omit = ["tests/*", "src/clauster/templates/*", "src/clauster/static/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
# PEP 8 sanctions up to 99 for a team that agrees on it ("it is okay to increase
# the line length limit up to 99 characters"); we use that ceiling.
line-length = 99
target-version = "py311"
src = ["src", "tests"]
# Fake-CLI test fixtures: extensionless shebang-Python stand-ins for the real
# `claude`/`git` binaries, with intentionally realistic (long) emulated output.
# Ruff's normal discovery skips them (no .py extension) so CI never lints them;
# exclude them explicitly so pre-commit — which detects them as Python by shebang
# and passes them directly — agrees (the hooks use --force-exclude). Keeps lint
# scope identical across CI, pre-commit, and local runs.
extend-exclude = ["tests/fixtures/fake_*/"]

[tool.ruff.lint]
# A pragmatic starter set: pyflakes (F), pycodestyle (E/W), import-sort (I),
# pyupgrade (UP), flake8-bugbear (B), flake8-bandit (S) — the bandit-derived
# security checks that replace the dropped Semgrep job (CodeQL covers SAST) — and
# pydocstyle (D), our docstring-coverage gate (require docstrings on public
# classes/methods/functions; D105/D107 ignored below as boilerplate-prone).
select = ["E", "F", "I", "W", "UP", "B", "S", "D"]
# S603 (subprocess-without-shell-equals-true) fires on *every* subprocess call and
# is advisory; we never use shell=True, always pass a list argv, and resolve/validate
# the binary (resolve_binary) and project names before spawning. S607 (partial
# executable path) trips only on the offline doctor's `git` call (guarded by a .git
# check) — the bridge runner always resolves its binary to an absolute path, so it
# never trips this. Both are ignored globally rather than scattering noqa.
# D105 (magic methods) and D107 (__init__) are skipped: a docstring there is
# almost always redundant with the class docstring or low-value boilerplate.
ignore = ["S603", "S607", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
# pep257 base convention (disables the positional D2xx rules that conflict with
# our "summary on the opening-quote line" style). With D105/D107 ignored above,
# this enforces: docstrings on public modules/classes/methods/functions, a blank
# line between summary and body (D205), and imperative-mood summaries (D401).
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101) and fixture-only "secrets", bind-all hosts,
# and temp paths — none are real security issues in test code. Tests are also
# self-describing (the function name is the spec), so docstrings aren't required (D).
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S108", "D"]
# Fuzz harnesses (ClusterFuzzLite/Atheris): standalone entry points built in the
# OSS-Fuzz image, not a package and not part of src/. Exempt docstring-coverage
# (D), the implicit-namespace-package rule (INP001 — no __init__.py by design),
# and assert (S101 — an assert IS the property check; Atheris reports a failing
# assert as a fuzzer crash).
"fuzz/**" = ["D", "INP001", "S101"]

[tool.pyright]
include = ["src/clauster"]
pythonVersion = "3.11"
# `basic` to start — `standard`/`strict` would surface a large initial backlog
# in a codebase not written under a type checker. Tighten incrementally.
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
